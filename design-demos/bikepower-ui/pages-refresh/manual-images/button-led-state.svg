<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 460" font-family="'PingFang SC','Microsoft YaHei',sans-serif">
  <title>按钮操作和默认 LED 状态</title>
  <rect width="800" height="460" fill="#fff"/>
  <text x="400" y="38" text-anchor="middle" font-size="22" font-weight="bold" fill="#222">一个按钮 · 调功与配网</text>
  <g font-size="16" fill="#222">
    <rect x="30" y="70" width="740" height="55" rx="8" fill="#e3f2fd" stroke="#1976d2"/>
    <text x="400" y="104" text-anchor="middle">BLE_ACTIVE · 待连接慢闪；已连接常亮</text>
    <rect x="30" y="150" width="350" height="90" rx="8" fill="#e8f5e9" stroke="#388e3c"/>
    <text x="205" y="183" text-anchor="middle">短按 &lt;500ms</text>
    <text x="205" y="214" text-anchor="middle">减一个步进（默认 20W）</text>
    <rect x="400" y="150" width="370" height="90" rx="8" fill="#fff3e0" stroke="#ef6c00"/>
    <text x="585" y="183" text-anchor="middle">按住 ≥500ms 且 &lt;2s 松开</text>
    <text x="585" y="214" text-anchor="middle">每 200ms 加一个步进</text>
    <rect x="30" y="265" width="740" height="65" rx="8" fill="#fff3e0" stroke="#ef6c00"/>
    <text x="400" y="292" text-anchor="middle">长按 ≥2s 松开 → 回滚本次调功 → WIFI_CONFIRM（快闪）</text>
    <text x="400" y="317" text-anchor="middle">3s 内再按：进入配网；未确认：取消并恢复 BLE_ACTIVE</text>
    <rect x="30" y="352" width="740" height="58" rx="8" fill="#e0f7fa" stroke="#00838f"/>
    <text x="400" y="386" text-anchor="middle">WIFI_CONFIG · BLE 在线 · 300s 超时或关闭 WiFi 后回 BLE</text>
    <text x="400" y="441" text-anchor="middle" font-size="14" fill="#555">调功示例适用于模拟固定模式；LED 灯效可配置，RGB 板支持颜色</text>
  </g>
</svg>
