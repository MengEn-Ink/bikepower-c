/* ===== 模式四：用户手册 ===== */
#mode-manual{min-height:calc(100vh - 64px)}
.manual-grid{display:grid;grid-template-columns:268px minmax(0,1fr) 236px;min-height:calc(100vh - 64px)}
.manual-toc{border-right:1px solid var(--line);padding:26px 20px 32px;position:sticky;top:64px;align-self:start;max-height:calc(100vh - 64px);overflow-y:auto;overscroll-behavior:contain}
.manual-toc::-webkit-scrollbar{width:6px}.manual-toc::-webkit-scrollbar-thumb{background:var(--line-soft)}
.toc-head{padding-bottom:16px;border-bottom:1px solid var(--line);margin-bottom:14px}
.toc-title{margin:10px 0 4px;color:var(--strong);font:900 22px/1.1 var(--sans);letter-spacing:-.03em}
.toc-sub{color:var(--muted);font:12px/1.55 var(--mono)}
.toc-progress{display:flex;align-items:center;gap:12px;margin:14px 0 16px;padding:12px 0;border-top:1px solid var(--line-soft);border-bottom:1px solid var(--line-soft)}
.toc-ring{position:relative;width:44px;height:44px;flex:0 0 auto}
.toc-ring svg{transform:rotate(-90deg);display:block}
.toc-ring .bg{fill:none;stroke:var(--line-soft);stroke-width:4}
.toc-ring .fg{fill:none;stroke:var(--accent);stroke-width:4;stroke-linecap:round;transition:stroke-dashoffset .4s}
.toc-ring .num{position:absolute;inset:0;display:grid;place-items:center;font:800 12px/1 var(--mono);color:var(--strong)}
.toc-progress-text{display:flex;flex-direction:column;gap:2px}
.toc-progress-text b{color:var(--strong);font:800 12px/1 var(--mono);letter-spacing:.04em}
.toc-progress-text span{color:var(--muted);font:11px/1.4 var(--mono)}
.toc-list{list-style:none;margin:0;padding:0}
.toc-list a{display:grid;grid-template-columns:32px 1fr;align-items:baseline;gap:10px;padding:9px 0;color:var(--muted);text-decoration:none;border-bottom:1px solid var(--line-soft);transition:color .15s}
.toc-list a:hover{color:var(--strong)}
.toc-list a.active{color:var(--strong)}
.toc-list a.active .toc-num{color:var(--accent)}
.toc-num{font:600 20px/1 var(--display);color:var(--faint);letter-spacing:-.02em}
.toc-label{font-size:13px;line-height:1.4;font-weight:700}
.toc-foot{margin-top:18px;padding-top:14px;border-top:1px solid var(--line-soft);font:11px/1.6 var(--mono);color:var(--faint)}
.toc-foot b{color:var(--muted);display:block;margin-bottom:4px}

.manual-content{min-width:0;padding:44px 56px 80px;background:var(--bg);max-width:920px}
.manual-hero{padding-bottom:36px;border-bottom:1px solid var(--line);margin-bottom:40px}
.manual-hero .eye{display:flex;align-items:center;gap:14px;color:var(--muted);font:12px/1 var(--mono);letter-spacing:.12em;text-transform:uppercase}
.manual-hero .eye i{width:36px;height:1px;background:var(--accent);display:inline-block}
.manual-hero h1{margin:18px 0 10px;color:var(--strong);font:600 56px/.95 var(--display);letter-spacing:-.03em}
.manual-hero h1 em{color:var(--accent);font-style:normal}
.manual-hero p.lead{color:var(--ink);font-size:17px;line-height:1.7;max-width:640px}
.manual-meta{margin-top:22px;display:grid;grid-template-columns:repeat(4,auto);justify-content:start;border-top:1px solid var(--line-soft);border-bottom:1px solid var(--line-soft)}
.manual-meta>div{padding:14px 28px 14px 0;border-right:1px solid var(--line-soft);margin-right:28px}
.manual-meta>div:last-child{border-right:0;margin-right:0;padding-right:0}
.manual-meta span{display:block;color:var(--muted);font:11px/1.4 var(--mono);letter-spacing:.05em}
.manual-meta b{display:block;margin-top:4px;color:var(--strong);font:800 14px/1.3 var(--sans)}

.ch{padding:10px 0 32px;scroll-margin-top:80px}
.ch+.ch{border-top:1px solid var(--line);padding-top:56px;margin-top:24px}
.ch-head{display:grid;grid-template-columns:118px 1fr;gap:24px;align-items:start;margin-bottom:28px}
.ch-num{color:var(--accent);font:600 92px/.85 var(--display);letter-spacing:-.04em;padding-top:6px}
.ch-meta{padding-top:10px}
.ch-kicker{color:var(--muted);font:800 11px/1 var(--mono);letter-spacing:.14em;text-transform:uppercase;margin-bottom:10px}
.ch-title{margin:0 0 10px;color:var(--strong);font:900 28px/1.15 var(--sans);letter-spacing:-.025em}
.ch-desc{color:var(--ink);font-size:15px;line-height:1.7;max-width:580px;margin:0}
.ch-body{padding-left:142px}
.ch-body>*+*{margin-top:20px}
h3.ch-sub{margin:36px 0 14px;color:var(--strong);font:800 18px/1.3 var(--sans);letter-spacing:-.01em;display:flex;align-items:center;gap:10px}
h3.ch-sub::before{content:"";width:10px;height:10px;background:var(--accent);display:inline-block;flex:0 0 auto}
.m-steps{list-style:none;padding:0;margin:0;counter-reset:step;display:grid;gap:0;border-top:1px solid var(--line-soft)}
.m-steps li{counter-increment:step;display:grid;grid-template-columns:50px 1fr;gap:20px;padding:16px 0;border-bottom:1px solid var(--line-soft);align-items:baseline}
.m-steps li::before{content:counter(step,decimal-leading-zero);color:var(--accent);font:600 24px/1 var(--display);letter-spacing:-.02em}
.m-steps li p{margin:0;color:var(--ink);font-size:15px;line-height:1.7}
.m-steps li p b,.m-p b{color:var(--strong);font-weight:800}
.m-steps li p code,.m-p code{font-family:var(--mono);font-size:13px;color:var(--amber);background:var(--amber-soft);padding:1px 6px;border:1px solid var(--line-soft)}
.m-p{color:var(--ink);font-size:15px;line-height:1.75}
.m-callout{padding:16px 18px;border-left:3px solid var(--accent);background:var(--accent-soft);color:var(--ink);font-size:14px;line-height:1.65}
.m-callout.warn{border-left-color:var(--amber);background:var(--amber-soft)}
.m-callout b{color:var(--strong);font-weight:800}
.m-callout code{font-family:var(--mono);font-size:13px;color:var(--strong);background:rgba(var(--bg-rgb),.5);padding:1px 6px;border:1px solid var(--line)}
kbd{display:inline-block;min-width:24px;padding:2px 8px;border:1px solid var(--line);background:var(--panel-2);color:var(--strong);font:700 12px/1.4 var(--mono);text-align:center}
.m-tbl{width:100%;border-collapse:collapse;font-size:13.5px;margin:6px 0}
.m-tbl th,.m-tbl td{padding:11px 14px;text-align:left;border-bottom:1px solid var(--line-soft);vertical-align:top}
.m-tbl th{color:var(--accent);font:800 11px/1.4 var(--mono);letter-spacing:.08em;text-transform:uppercase;border-bottom:1px solid var(--line);background:var(--panel)}
.m-tbl td{color:var(--ink);line-height:1.6}
.m-tbl td b{color:var(--strong)}
.m-tbl td code{font-family:var(--mono);font-size:12.5px;color:var(--amber)}
.m-tbl tr:last-child td{border-bottom:1px solid var(--line)}

.m-fig{margin:24px 0;border:1px solid var(--line);background:var(--panel)}
.m-fig-head{padding:10px 14px;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;gap:12px;color:var(--muted);font:11px/1.4 var(--mono);letter-spacing:.08em;text-transform:uppercase}
.m-fig-head b{color:var(--strong);margin-right:8px}
.m-fig-head .m-fig-tag{padding:3px 8px;background:var(--accent-soft);border:1px solid var(--accent-dark);color:var(--accent);font-weight:800}
.m-fig-body{padding:24px;display:grid;grid-template-columns:minmax(0,1fr) 220px;gap:24px;align-items:start;background:linear-gradient(180deg,var(--panel) 0%,var(--panel-2) 100%)}
.m-fig-body.full{grid-template-columns:1fr}
.m-phone{justify-self:center;width:100%;max-width:300px;border:1px solid var(--line);background:#e9eef3;padding:10px;box-shadow:0 20px 50px rgba(0,0,0,calc(.4*var(--shadow-k))),0 0 0 1px rgba(245,196,81,.08);cursor:zoom-in;position:relative}
.m-phone img{width:100%;display:block;border:1px solid rgba(0,0,0,.08)}
.m-wide{width:100%;background:#fdfaf3;padding:18px 20px;border:1px solid var(--line);cursor:zoom-in;position:relative}
.m-wide img{width:100%;display:block}
.m-phone::after,.m-wide::after{content:"⤢";position:absolute;top:14px;right:14px;width:24px;height:24px;background:rgba(var(--bg-rgb),.75);color:var(--strong);font-family:var(--mono);font-size:14px;display:grid;place-items:center;opacity:0;transition:opacity .15s}
.m-phone:hover::after,.m-wide:hover::after{opacity:1}
.m-fig-cap{color:var(--muted);font-size:13px;line-height:1.65}
.m-fig-cap b{color:var(--strong);font-weight:800;display:block;margin-bottom:6px;font:800 11px/1.4 var(--mono);letter-spacing:.08em;text-transform:uppercase}
.m-fig-cap ul{margin:10px 0 0;padding:0;list-style:none;counter-reset:annot}
.m-fig-cap ul li{padding:7px 0;display:grid;grid-template-columns:24px 1fr;gap:8px;font-size:12.5px;color:var(--ink);border-bottom:1px dashed var(--line-soft)}
.m-fig-cap ul li:last-child{border-bottom:0}
.m-fig-cap ul li::before{content:counter(annot);counter-increment:annot;display:inline-grid;place-items:center;width:20px;height:20px;border:1px solid var(--accent);color:var(--accent);font:800 11px/1 var(--mono)}

.m-faq details{border-bottom:1px solid var(--line-soft);padding:14px 0}
.m-faq summary{cursor:pointer;display:flex;align-items:center;gap:14px;color:var(--strong);font-weight:800;font-size:15px;list-style:none}
.m-faq summary::-webkit-details-marker{display:none}
.m-faq summary .q{color:var(--accent);font:600 20px/1 var(--display);min-width:36px;letter-spacing:-.02em}
.m-faq summary .plus{color:var(--accent);font:12px var(--mono);margin-left:auto}
.m-faq details[open] summary .plus::before{content:"−"}
.m-faq details:not([open]) summary .plus::before{content:"+"}
.m-faq .a{margin-top:12px;padding-left:50px;color:var(--ink);font-size:14.5px;line-height:1.7}

.m-tldr{display:grid;grid-template-columns:repeat(2,1fr);gap:14px;margin-top:10px}
.m-tldr>div{padding:22px 20px;border:1px solid var(--line);background:linear-gradient(180deg,var(--panel) 0%,var(--panel-2) 100%);min-height:170px;display:flex;flex-direction:column}
.m-tldr .n{color:var(--accent);font:600 42px/1 var(--display);letter-spacing:-.03em;margin-bottom:12px}
.m-tldr .k{color:var(--strong);font-weight:900;font-size:16px;margin-bottom:8px}
.m-tldr .b{color:var(--ink);font-size:13.5px;line-height:1.65}

.ch-nav{margin-top:40px;padding-top:22px;border-top:1px solid var(--line);display:grid;grid-template-columns:1fr 1fr;gap:14px}
.ch-nav .nav-btn{padding:16px 18px;border:1px solid var(--line);background:var(--panel);text-align:left;color:var(--ink);text-decoration:none;transition:border-color .15s,background .15s;cursor:pointer}
.ch-nav .nav-btn:hover{border-color:var(--accent);background:var(--panel-2)}
.ch-nav .nav-btn.next{text-align:right}
.ch-nav .nav-btn span{color:var(--muted);font:11px/1 var(--mono);letter-spacing:.1em;text-transform:uppercase}
.ch-nav .nav-btn b{display:block;margin-top:8px;color:var(--strong);font-size:15px;font-weight:800}
.ch-nav .nav-btn.disabled{opacity:.3;pointer-events:none}

.manual-aside{border-left:1px solid var(--line);padding:26px 18px 32px;position:sticky;top:64px;align-self:start;max-height:calc(100vh - 64px);overflow-y:auto}
.manual-aside::-webkit-scrollbar{width:6px}.manual-aside::-webkit-scrollbar-thumb{background:var(--line-soft)}
.manual-aside h4{margin:0 0 10px;color:var(--strong);font:800 11px/1 var(--mono);letter-spacing:.12em;text-transform:uppercase}
.manual-aside .block+.block{margin-top:22px;padding-top:22px;border-top:1px solid var(--line-soft)}
.manual-aside p{margin:0 0 8px;color:var(--muted);font-size:12.5px;line-height:1.6}
.key-points{list-style:none;margin:0;padding:0}
.key-points li{padding:7px 0 7px 14px;position:relative;font-size:12.5px;line-height:1.55;color:var(--ink);border-bottom:1px dashed var(--line-soft)}
.key-points li::before{content:"";position:absolute;left:0;top:15px;width:6px;height:1px;background:var(--accent)}
.key-points li:last-child{border-bottom:0}
.aside-foot{margin-top:26px;padding-top:18px;border-top:1px solid var(--line);color:var(--faint);font:11px/1.6 var(--mono)}

.manual-lightbox{position:fixed;inset:0;background:rgba(var(--bg-rgb),.92);display:grid;place-items:center;z-index:100;padding:40px;cursor:zoom-out;backdrop-filter:blur(4px)}
.manual-lightbox img{max-width:94vw;max-height:86vh;border:1px solid var(--line);box-shadow:0 30px 100px rgba(0,0,0,calc(.6*var(--shadow-k)));background:#fff}
.manual-lightbox .lb-close{position:absolute;top:24px;right:28px;color:var(--muted);font:12px/1 var(--mono);letter-spacing:.12em;text-transform:uppercase;pointer-events:none}

@media(max-width:1240px){.manual-grid{grid-template-columns:240px minmax(0,1fr)}.manual-aside{display:none}.manual-content{padding:36px 40px 60px}}
@media(max-width:900px){
  .manual-grid{grid-template-columns:1fr}
  .manual-toc{position:static;max-height:none;border-right:0;border-bottom:1px solid var(--line);padding:20px 16px}
  .manual-content{padding:28px 20px 50px}
  .ch-body{padding-left:0}
  .ch-head{grid-template-columns:70px 1fr;gap:14px}
  .ch-num{font-size:60px}
  .manual-hero h1{font-size:40px}
  .m-fig-body{grid-template-columns:1fr}
  .manual-meta{grid-template-columns:1fr 1fr}
  .manual-meta>div{border-right:0;margin-right:0;padding-right:0;border-bottom:1px solid var(--line-soft)}
  .m-tldr{grid-template-columns:1fr}
}

/* ===== 新模块：BLE 原始通知检查器 ===== */
#mode-inspector,#mode-health{max-width:1180px;margin:24px auto 0;padding:0 20px 40px}
.inspector-actions{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin:18px 0 14px;padding-bottom:14px;border-bottom:1px solid var(--line-soft)}
.inspector-filter{display:inline-flex;align-items:center;gap:7px;color:var(--muted);font-size:13px;margin-left:auto}
.inspector-filter input{accent-color:var(--accent);width:14px;height:14px}
.inspector-grid{display:grid;grid-template-columns:380px minmax(0,1fr);gap:0;border:1px solid var(--line);background:var(--panel-2);min-height:520px}
.inspector-tree{border-right:1px solid var(--line);padding:18px;overflow-y:auto;max-height:640px}
.inspector-head{margin-bottom:14px}
.inspector-head .eyebrow{display:block;margin-bottom:6px}
.inspector-head strong{display:block;color:var(--strong);font-size:16px;letter-spacing:-.01em;word-break:break-all}
.inspector-head small{display:block;margin-top:4px;color:var(--faint);font:600 11px/1.4 var(--mono);letter-spacing:.04em}
.inspector-svc{margin-top:14px;padding-top:12px;border-top:1px dashed var(--line-soft)}
.inspector-svc:first-child{border-top:0;padding-top:0;margin-top:0}
.inspector-svc-head{display:flex;justify-content:space-between;gap:10px;color:var(--strong);font-weight:800;font-size:13px;margin-bottom:8px}
.inspector-svc-head small{color:var(--faint);font:600 11px/1.4 var(--mono)}
.inspector-char{display:grid;grid-template-columns:1fr auto;gap:10px;padding:8px 10px;border:1px solid var(--line-soft);background:var(--bg);margin-bottom:6px;align-items:center}
.inspector-char-name{color:var(--ink);font-weight:700;font-size:13px}
.inspector-char-uuid{color:var(--faint);font:500 11px/1.3 var(--mono);word-break:break-all}
.inspector-char-props{color:var(--muted);font:600 10px/1 var(--mono);letter-spacing:.04em;margin-top:3px}
.inspector-char-sub{display:inline-flex;align-items:center;gap:6px;color:var(--muted);font-size:12px;cursor:pointer;user-select:none}
.inspector-char-sub input{accent-color:var(--accent);width:14px;height:14px}
.inspector-char-sub.disabled{opacity:.4;cursor:not-allowed}
.inspector-char.subscribed{border-color:var(--accent);background:var(--accent-soft)}
.inspector-char.subscribed .inspector-char-sub{color:var(--accent);font-weight:800}
.inspector-stream{display:flex;flex-direction:column;min-height:520px}
.inspector-stream-head{display:flex;justify-content:space-between;align-items:center;padding:14px 18px;border-bottom:1px solid var(--line)}
.inspector-stream-head strong{display:block;color:var(--strong);font:700 14px/1 var(--mono);margin-top:4px}
.inspector-stream-tools{display:flex;gap:8px;align-items:center}
.inspector-filter-sel{min-height:34px;background:var(--panel);border:1px solid var(--line);color:var(--ink);padding:0 10px;font:600 12px/1 var(--mono)}
.inspector-stream-body{flex:1;overflow-y:auto;padding:10px 18px;background:var(--bg);font:500 12px/1.55 var(--mono);min-height:360px;max-height:520px}
.inspector-frame{padding:8px 0;border-bottom:1px dashed var(--line-soft);color:var(--ink)}
.inspector-frame-head{display:flex;gap:12px;align-items:baseline;flex-wrap:wrap}
.inspector-frame-time{color:var(--accent);font-weight:800;letter-spacing:.02em}
.inspector-frame-char{color:var(--strong);font-weight:800}
.inspector-frame-len{color:var(--faint)}
.inspector-frame-hex{color:var(--ink);word-break:break-all;margin-top:3px;letter-spacing:.04em}
.inspector-frame-parsed{color:var(--green);margin-top:3px;font-family:var(--sans);font-size:12px;font-weight:600}
.inspector-stream-foot{display:flex;justify-content:space-between;padding:10px 18px;border-top:1px solid var(--line);color:var(--muted);font:600 11px/1 var(--mono);letter-spacing:.03em}
.inspector-stream-foot b{color:var(--strong)}
.inspector-empty{padding:40px 20px;text-align:center;color:var(--faint);font-family:var(--sans)}

/* ===== 新模块：健康检查 ===== */
.health-top{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:22px;margin:18px 0 18px;padding-bottom:18px;border-bottom:1px solid var(--line)}
.health-cta{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.health-summary{display:grid;grid-template-columns:repeat(4,minmax(84px,auto));gap:0;margin:0}
.health-summary>div{padding:0 18px;border-left:1px solid var(--line-soft);text-align:right}
.health-summary>div:first-child{border-left:0}
.health-summary dt{color:var(--muted);font:700 10px/1.4 var(--mono);letter-spacing:.08em;margin:0}
.health-summary dd{margin:4px 0 0;color:var(--strong);font:600 32px/1 var(--display)}
.health-steps{list-style:none;margin:0;padding:0;counter-reset:healthstep}
.health-steps li{display:grid;grid-template-columns:48px minmax(0,1fr) auto;gap:16px;padding:16px 0;border-bottom:1px solid var(--line-soft);align-items:start}
.health-steps li:last-child{border-bottom:0}
.health-steps li::before{counter-increment:healthstep;content:"0"counter(healthstep);color:var(--faint);font:600 24px/1 var(--display);align-self:start;margin-top:2px}
.health-step-body strong{display:block;color:var(--strong);font-size:14px;font-weight:800}
.health-step-body p{margin:4px 0 0;color:var(--muted);font-size:13px;line-height:1.6}
.health-step-body code{font:500 12px/1.4 var(--mono);color:var(--ink);background:var(--panel-2);padding:0 4px;border:1px solid var(--line-soft)}
.health-step-stat{color:var(--faint);font:600 11px/1.3 var(--mono);letter-spacing:.04em;margin-top:5px}
.health-step-badge{min-width:70px;text-align:center;padding:4px 8px;font:700 11px/1 var(--mono);letter-spacing:.08em;border:1px solid var(--line);color:var(--muted)}
.health-step-badge.pending{color:var(--muted)}
.health-step-badge.running{color:var(--amber);border-color:var(--amber);background:var(--amber-soft);animation:healthpulse 1.1s linear infinite}
.health-step-badge.pass{color:var(--green);border-color:var(--green);background:var(--green-soft)}
.health-step-badge.warn{color:var(--amber);border-color:var(--amber);background:var(--amber-soft)}
.health-step-badge.fail{color:var(--red);border-color:var(--red);background:var(--red-soft)}
.health-step-badge.skip{color:var(--faint)}
@keyframes healthpulse{0%,100%{opacity:1}50%{opacity:.45}}
.health-report-pre{max-height:360px;overflow:auto;background:var(--bg);color:var(--ink);padding:14px;border:1px solid var(--line-soft);font:500 12px/1.55 var(--mono);white-space:pre-wrap;word-break:break-all;margin:10px 0 0}

/* ===== 全局确认弹窗 ===== */
.confirm-mask{position:fixed;inset:0;background:rgba(var(--bg-rgb),.82);z-index:120;display:grid;place-items:center;padding:24px}
.confirm-mask.confirm-top{z-index:140}
.confirm-box{width:min(420px,100%);background:var(--panel);border:1px solid var(--accent);padding:24px}
.confirm-box strong{display:block;color:var(--strong);font-size:18px;font-weight:900;letter-spacing:-.01em}
.confirm-box p{margin:10px 0 20px;color:var(--ink);font-size:14px;line-height:1.6}
.confirm-box p b{color:var(--accent);font-family:var(--mono);font-size:15px}
.confirm-actions{display:flex;gap:10px;justify-content:flex-end}

/* ===== 自动连接 / 跨标签页关联 ===== */
.autolink{margin:16px 0 0;border:1px solid var(--line);background:var(--panel)}
.autolink-toggle{display:flex;align-items:center;gap:10px;min-height:44px;padding:10px 12px;cursor:pointer;color:var(--strong);font-size:13px;font-weight:800}
.autolink-toggle input{width:18px;height:18px;accent-color:var(--accent);flex:none}
.autolink-status{padding:0 12px 11px;color:var(--muted);font:12px/1.55 var(--mono);min-height:30px}
.autolink-status.busy{color:var(--amber)}.autolink-status.ok{color:var(--green)}.autolink-status.err{color:var(--red)}
.tab-relay{display:flex;align-items:center;gap:8px;border-top:1px dashed var(--line);padding:9px 12px;font:11px/1.4 var(--mono);color:var(--faint);letter-spacing:.04em}
.tab-relay .node{width:9px;height:9px;border:1px solid var(--faint);flex:none}
.tab-relay .node.me{background:var(--accent-fill);border-color:var(--accent)}
.tab-relay .node.peer{border-color:var(--green)}.tab-relay .node.peer.live{background:var(--green)}
.tab-relay .wire{flex:1;height:1px;background:repeating-linear-gradient(90deg,var(--line) 0 4px,transparent 4px 7px)}
.tab-relay.linked .wire{background:repeating-linear-gradient(90deg,var(--green) 0 4px,transparent 4px 7px);background-size:14px 1px;animation:relay 1.2s linear infinite}
@keyframes relay{to{background-position:14px 0}}
.tab-relay b{color:var(--ink);font-weight:700;text-align:right}
.tab-relay .me-label{white-space:nowrap}
.mirror-flag{display:inline-block;margin-left:8px;padding:1px 6px;border:1px solid var(--green);color:var(--green);font:11px/1.5 var(--mono);vertical-align:middle}

/* ===== GATT 中文解析 ===== */
.gatt-intro{margin:0 0 10px;color:var(--muted);font-size:13px;line-height:1.6}
.svc-cn{display:block;color:var(--strong);font-size:14px;font-weight:900;font-family:var(--sans)}
.svc-desc{display:block;margin-top:2px;color:var(--muted);font-size:12px;line-height:1.5;font-family:var(--sans);font-weight:400}
.gchar{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.15fr);gap:6px 16px;padding:9px 0;border-top:1px solid var(--line-soft)}
.gchar:first-child{border-top:0}
.gchar-name b{display:block;color:var(--ink);font-size:13px}
.gchar-name small{display:block;color:var(--faint);font:11px/1.45 var(--mono);overflow-wrap:anywhere}
.gchar-desc{display:block;margin-top:3px;color:var(--muted);font-size:12px;line-height:1.5}
.gchar-props{display:flex;flex-wrap:wrap;gap:4px;margin-top:5px}
.gchar-props span{padding:0 5px;border:1px solid var(--line);color:var(--muted);font:11px/1.6 var(--mono)}
.gchar-props span.live{border-color:var(--accent);color:var(--accent)}
.gval{align-self:start;min-height:40px;padding:7px 10px;border-left:2px solid var(--line);background:var(--bg);font:12px/1.55 var(--mono);color:var(--strong);overflow-wrap:anywhere;white-space:pre-line;transition:border-color .5s,background-color .5s}
.gval.empty{color:var(--faint)}
.gval.flash{border-left-color:var(--accent);background:var(--accent-soft);transition:none}
.gval .unit{color:var(--accent)}
@media(max-width:760px){.gchar{grid-template-columns:1fr}}

/* ===== 模板写入开发板 ===== */
.writer-box{width:min(680px,100%);max-height:calc(100vh - 48px);overflow:auto;background:var(--panel);border:1px solid var(--accent);padding:24px}
.writer-box h3{margin:0;color:var(--strong);font-size:20px;font-weight:900}
.writer-lead{margin:8px 0 16px;color:var(--muted);font-size:13px;line-height:1.65}
.writer-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px 14px}
.writer-grid .span-all{grid-column:1/-1}
.writer-grid .form-field input[type="text"]{font-family:var(--mono)}
.byte-count{float:right;color:var(--faint);font:11px/1.8 var(--mono);font-weight:400}
.byte-count.over{color:var(--red)}
.writer-steps{margin:16px 0 0;padding:0;list-style:none;border:1px solid var(--line-soft)}
.writer-steps li{display:flex;gap:10px;padding:8px 12px;border-top:1px solid var(--line-soft);font-size:13px;color:var(--muted)}
.writer-steps li:first-child{border-top:0}
.writer-steps li i{font-style:normal;font:12px/1.6 var(--mono);width:44px;flex:none;color:var(--faint)}
.writer-steps li.run i{color:var(--amber)}.writer-steps li.ok i{color:var(--green)}.writer-steps li.err i{color:var(--red)}
.writer-steps li.ok{color:var(--ink)}.writer-steps li.err{color:var(--red)}
.writer-actions{display:flex;flex-wrap:wrap;gap:10px;justify-content:flex-end;margin-top:18px}
.writer-note{margin-top:14px;padding:11px 13px;border-left:3px solid var(--amber);background:var(--amber-soft);color:var(--ink);font-size:12px;line-height:1.65}
@media(max-width:600px){.writer-grid{grid-template-columns:1fr}}

/* ===== 手册首页：工具导航 ===== */
.mode-btn.mode-home{position:relative;margin-right:7px}
.mode-btn.mode-home::after{content:"";position:absolute;right:-5px;top:8px;bottom:8px;width:1px;background:var(--line)}
.mode-btn.mode-home .mode-title::before{content:"¶ ";color:var(--accent)}
.mode-btn.mode-home.active .mode-title::before{color:var(--accent)}
.launchpad{margin-top:34px}
.launchpad-head{display:flex;align-items:baseline;justify-content:space-between;gap:16px;flex-wrap:wrap}
.launchpad-head h2{margin:0;color:var(--strong);font:900 22px/1.2 var(--sans);letter-spacing:-.02em}
.launchpad-head p{margin:0;color:var(--muted);font-size:13px}
.launch-route{margin:14px 0 0;display:flex;flex-wrap:wrap;align-items:center;border:1px solid var(--line-soft);background:var(--panel)}
.launch-route span{padding:9px 14px;color:var(--muted);font:12px/1.4 var(--mono);border-right:1px solid var(--line-soft)}
.launch-route span b{color:var(--accent);margin-right:6px}
.launch-route span:last-child{border-right:0}
.launch-grid{margin-top:14px;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));border-top:1px solid var(--line);border-left:1px solid var(--line)}
.launch-card{position:relative;display:flex;flex-direction:column;gap:8px;min-height:188px;padding:18px 18px 16px;border:0;border-right:1px solid var(--line);border-bottom:1px solid var(--line);background:var(--bg);color:var(--ink);text-align:left;cursor:pointer;transition:background .15s}
.launch-card:hover,.launch-card:focus-visible{background:var(--panel)}
.launch-card:hover .launch-go{color:var(--accent);transform:translateX(3px)}
.launch-no{color:var(--faint);font:600 30px/1 var(--display);letter-spacing:-.03em}
.launch-card:hover .launch-no{color:var(--accent)}
.launch-card b{color:var(--strong);font-size:16px;font-weight:900}
.launch-card p{margin:0;color:var(--muted);font-size:13px;line-height:1.6;flex:1}
.launch-need{color:var(--faint);font:11px/1.5 var(--mono)}
.launch-foot{display:flex;align-items:center;justify-content:space-between;gap:8px;padding-top:10px;border-top:1px dashed var(--line-soft)}
.launch-live{font:11px/1.4 var(--mono);color:var(--faint);display:flex;align-items:center;gap:6px;min-width:0}
.launch-live i{width:7px;height:7px;border-radius:50%;background:var(--line);flex:none}
.launch-live.on{color:var(--green)}.launch-live.on i{background:var(--green);box-shadow:0 0 0 3px var(--green-soft)}
.launch-go{color:var(--muted);font:800 12px/1 var(--mono);transition:transform .15s,color .15s;white-space:nowrap}
@media(max-width:1100px){.launch-grid{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media(max-width:600px){.launch-grid{grid-template-columns:1fr}.launch-card{min-height:0}}

/* ===== 设备比对：角色识别与写入流程 ===== */
.flow-rail{margin:4px 0 16px;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));border:1px solid var(--line)}
.flow-step{position:relative;padding:16px 18px 15px;border-right:1px solid var(--line);background:var(--panel-2);transition:background .2s}
.flow-step:last-child{border-right:0}
.flow-step::after{content:"";position:absolute;left:0;right:0;bottom:-1px;height:3px;background:transparent;transition:background .25s}
.flow-step.done::after{background:var(--green)}
.flow-step.now::after{background:var(--accent)}
.flow-step.now{background:var(--accent-soft)}
.flow-step .flow-k{display:flex;align-items:center;gap:8px;color:var(--faint);font:800 11px/1 var(--mono);letter-spacing:.1em}
.flow-step .flow-k i{font-style:normal;width:20px;height:20px;display:inline-grid;place-items:center;border:1px solid currentColor;font-size:11px}
.flow-step.done .flow-k{color:var(--green)}.flow-step.now .flow-k{color:var(--accent)}
.flow-step b{display:block;margin-top:10px;color:var(--strong);font-size:15px;font-weight:900}
.flow-step p{margin:6px 0 0;color:var(--muted);font-size:12.5px;line-height:1.6}
.flow-step .flow-state{display:block;margin-top:8px;font:12px/1.4 var(--mono);color:var(--ink)}
.role-badge{display:inline-flex;align-items:center;gap:6px;min-height:26px;padding:3px 9px;border:1px solid var(--line);font:800 12px/1 var(--mono);white-space:nowrap}
.role-badge::before{content:"";width:7px;height:7px;background:currentColor}
.role-badge.board{color:var(--accent);border-color:var(--accent);background:var(--accent-soft)}
.role-badge.board-legacy{color:var(--amber);border-color:var(--amber);background:var(--amber-soft)}
.role-badge.external{color:var(--violet);border-color:var(--violet);background:color-mix(in srgb,var(--violet) 10%,transparent)}
.role-evidence{margin:12px 0 0;padding:0;list-style:none;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));border:1px solid var(--line-soft)}
.role-evidence li{padding:9px 11px;border-right:1px solid var(--line-soft);font-size:12px;line-height:1.5;color:var(--muted)}
.role-evidence li:last-child{border-right:0}
.role-evidence li b{display:block;font:800 11px/1.3 var(--mono);color:var(--faint);letter-spacing:.04em}
.role-evidence li.yes b{color:var(--green)}
.role-tip{margin-top:10px;font-size:12.5px;line-height:1.6;color:var(--muted)}
.role-tip b{color:var(--strong)}
.compare-card-board{border-color:var(--accent)!important}
.compare-rules{margin-top:12px}
.compare-rules table{width:100%;border-collapse:collapse;margin-top:10px;font-size:13px}
.compare-rules th,.compare-rules td{padding:9px 12px;border-bottom:1px solid var(--line-soft);text-align:left;vertical-align:top;line-height:1.55;color:var(--ink)}
.compare-rules th{color:var(--accent);font:800 11px/1.4 var(--mono);letter-spacing:.06em}
.compare-rules code{font-family:var(--mono);font-size:12px;color:var(--amber)}
@media(max-width:760px){.flow-rail{grid-template-columns:1fr}.flow-step{border-right:0;border-bottom:1px solid var(--line)}.flow-step:last-child{border-bottom:0}.role-evidence{grid-template-columns:1fr}.role-evidence li{border-right:0;border-bottom:1px solid var(--line-soft)}}

/* 新模块响应式 */
@media(max-width:960px){
  .inspector-grid{grid-template-columns:1fr}
  .inspector-tree{border-right:0;border-bottom:1px solid var(--line);max-height:320px}
  .health-top{grid-template-columns:1fr}
  .health-summary{grid-template-columns:repeat(4,1fr)}
}
@media(max-width:760px){
  #mode-inspector,#mode-health{margin-top:18px;padding:0 14px 28px}
  .mode-select{max-width:420px}
  .health-steps li{grid-template-columns:36px minmax(0,1fr);gap:10px}
  .health-steps li::before{font-size:20px}
  .health-step-badge{grid-column:1/-1;justify-self:start;margin-top:4px}
}

/* ===== IDE 外壳：底部面板 + 状态栏 + 可折叠侧栏 ===== */
body.ide-shell.ide-wide{padding-bottom:calc(var(--dock-space,0px) + var(--status-h,0px))}
body.ide-shell.ide-wide .wrap{min-height:calc(100vh - var(--dock-space,0px) - var(--status-h,0px))}
body.dock-dragging{cursor:ns-resize;user-select:none}
.ide-dock{background:var(--panel);border-top:1px solid var(--line);display:flex;flex-direction:column;z-index:30}
body.ide-wide .ide-dock{position:fixed;left:0;right:0;bottom:var(--status-h,0px);height:var(--dock-h,300px)}
body.ide-wide .ide-dock[data-open="0"]{height:36px}
.ide-dock[data-open="0"] .dock-body,.ide-dock[data-open="0"] .dock-resize{display:none}
.dock-resize{position:absolute;left:0;right:0;top:-4px;height:8px;cursor:ns-resize;z-index:2}
.dock-resize:hover,.dock-resize:focus-visible{background:linear-gradient(transparent 3px,var(--accent) 3px,var(--accent) 5px,transparent 5px);outline:0}
body:not(.ide-wide) .dock-resize{display:none}
.dock-tabs{display:flex;align-items:stretch;min-height:36px;border-bottom:1px solid var(--line);padding:0 6px 0 0;flex:0 0 auto;overflow-x:auto;scrollbar-width:none}
.dock-tab{display:inline-flex;align-items:center;gap:8px;padding:0 14px;border:0;border-right:1px solid var(--line-soft);background:transparent;color:var(--faint);font:700 11px/1 var(--mono);letter-spacing:.04em;cursor:pointer;white-space:nowrap;position:relative}
.dock-tab:hover{color:var(--strong);background:var(--panel-2)}
.dock-tab.active{color:var(--strong);background:var(--bg)}
.dock-tab.active::after{content:"";position:absolute;left:0;right:0;top:0;height:2px;background:var(--accent)}
.ide-dock[data-open="0"] .dock-tab.active{background:transparent}
.ide-dock[data-open="0"] .dock-tab.active::after{display:none}
.dock-count{min-width:18px;padding:2px 5px;border:1px solid var(--line);color:var(--muted);font:700 10px/1 var(--mono);text-align:center}
.dock-count.unread{border-color:var(--accent);color:var(--accent)}
.dock-count.err{border-color:var(--red);color:var(--red)}
.dock-spacer{flex:1}
.dock-tools{display:flex;align-items:center;gap:4px;padding-right:6px}
.dock-tool{min-height:26px;padding:0 9px;border:1px solid var(--line);background:transparent;color:var(--muted);font:700 11px/1 var(--mono);cursor:pointer;white-space:nowrap}
.dock-tool:hover{color:var(--accent);border-color:var(--accent)}
.dock-tabs .pane-x{align-self:center}
#dock-toggle-btn svg{transition:transform .2s}
#dock-toggle-btn.flip svg{transform:rotate(180deg)}
.ide-dock[data-max="1"] #dock-max-btn{color:var(--accent)}
.dock-body{flex:1 1 auto;min-height:0;position:relative;background:var(--bg)}
.dock-pane{display:none;height:100%;overflow:auto;padding:14px 18px 18px}
.dock-pane.active{display:block}
body:not(.ide-wide) .dock-pane{height:auto;max-height:70vh}
.dock-empty{padding:26px 6px;color:var(--muted);font-size:13px;line-height:1.7;max-width:640px}
.dock-empty b{display:block;color:var(--strong);font-size:15px;margin-bottom:4px}
.dock-pane-bar{display:flex;align-items:center;justify-content:space-between;gap:14px;padding-bottom:10px;border-bottom:1px solid var(--line-soft);color:var(--muted);font-size:12px;flex-wrap:wrap}
#pane-log{padding:0}
#pane-log .log{height:100%;border:0;padding:10px 18px}
body:not(.ide-wide) #pane-log .log{height:260px}
#pane-gatt .svc-list{display:grid;grid-template-columns:repeat(auto-fill,minmax(420px,1fr));gap:8px;align-items:start}
#pane-gatt .gatt-intro{margin:0 0 10px}
#pane-nvs .config-panel{border:0;padding:0;background:transparent}
.ide-status{display:none}
body.ide-wide .ide-status{position:fixed;left:0;right:0;bottom:0;height:var(--status-h,26px);z-index:31;display:flex;align-items:stretch;background:var(--bg);border-top:1px solid var(--line);font:11px/1 var(--mono);color:var(--muted)}
.st-item{display:inline-flex;align-items:center;gap:7px;padding:0 11px;border:0;border-right:1px solid var(--line-soft);background:transparent;color:inherit;font:inherit;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:320px}
button.st-item{cursor:pointer}
button.st-item:hover{color:var(--strong);background:var(--panel)}
.st-link{color:var(--ink)}
.st-dot{width:7px;height:7px;border-radius:50%;background:var(--faint);flex:0 0 auto}
.st-link[data-link="connected"]{background:var(--accent-fill);color:var(--on-accent);font-weight:800}
.st-link[data-link="connected"]:hover{background:var(--accent-fill-hover);color:var(--on-accent)}
.st-link[data-link="connected"] .st-dot{background:var(--bg)}
.st-link[data-link="connecting"] .st-dot,.st-link[data-link="mirror"] .st-dot{background:var(--amber)}
.st-link[data-link="lost"] .st-dot{background:var(--red)}
.st-spacer{flex:1}
.st-keys{color:var(--faint)}
.st-views{display:flex;border-left:1px solid var(--line-soft)}
.st-view{width:32px;border:0;background:transparent;color:var(--faint);cursor:pointer;display:grid;place-items:center;padding:0}
.st-view svg{width:15px;height:15px;fill:none;stroke:currentColor;stroke-width:1.2}
.st-view svg .fill{stroke-width:1.2}
.st-view[aria-pressed="true"]{color:var(--accent)}
.st-view:hover:not(:disabled){color:var(--strong);background:var(--panel)}
.st-view:disabled{opacity:.3;cursor:default}
@media(max-width:1280px){.st-keys{display:none}}

/* 实时监控：PC 首屏一屏装下主窗口；侧栏各自滚动 */
.rail-reopen{display:none;writing-mode:vertical-rl;border:0;border-right:1px solid var(--line);background:var(--panel);color:var(--faint);font:800 10px/1 var(--mono);letter-spacing:.2em;cursor:pointer;padding:14px 0}
.rail-reopen.right{border-right:0;border-left:1px solid var(--line)}
.rail-reopen:hover{color:var(--accent);background:var(--panel-2)}
.rail-identity:empty{display:none}
.rail-identity{margin:18px 0 0;padding-top:4px;border-top:1px solid var(--line)}
.rail-identity h3{margin:12px 0 6px;color:var(--faint);font:800 10px/1 var(--mono);letter-spacing:.12em}
.rail-identity .row{padding:7px 0;font-size:12px}
.rail-identity .row span:first-child{min-width:64px}
.rail-identity .dc-head{flex-wrap:wrap;margin-bottom:6px}
.rail-identity .dc-name{display:none}
.rail-identity .dc-meta{display:none}
.rail-identity .dc-foot{display:grid;gap:6px}
.rail-identity .dc-foot .btn{width:100%}
.monitor-rail>.pane-title,.evidence>.pane-title{margin:-30px -18px 18px}
@media(min-width:1100px) and (min-height:600px){
  body.ide-wide #mode-connect{min-height:0}
  body.ide-wide #mode-connect .monitor-grid{height:calc(100vh - 64px - var(--dock-space,0px) - var(--status-h,0px));min-height:420px;grid-template-columns:260px minmax(0,1fr) 272px}
  body.ide-wide #mode-connect .monitor-grid[data-left="off"]{grid-template-columns:28px minmax(0,1fr) 272px}
  body.ide-wide #mode-connect .monitor-grid[data-right="off"]{grid-template-columns:260px minmax(0,1fr) 28px}
  body.ide-wide #mode-connect .monitor-grid[data-left="off"][data-right="off"]{grid-template-columns:28px minmax(0,1fr) 28px}
  body.ide-wide .monitor-grid[data-left="off"] .monitor-rail,body.ide-wide .monitor-grid[data-right="off"] .evidence{display:none}
  body.ide-wide .monitor-grid[data-left="off"] .rail-reopen.left{display:block;grid-column:1;grid-row:1}
  body.ide-wide .monitor-grid[data-right="off"] .rail-reopen.right{display:block;grid-column:3;grid-row:1}
  body.ide-wide .monitor-grid .monitor-rail{grid-column:1;grid-row:1}
  body.ide-wide .monitor-grid .signal-stage{grid-column:2;grid-row:1}
  body.ide-wide .monitor-grid .evidence{grid-column:3;grid-row:1}
  body.ide-wide .monitor-rail,body.ide-wide .evidence{overflow:auto;min-height:0;scrollbar-width:thin}
  body.ide-wide .signal-stage{display:flex;flex-direction:column;min-height:0;overflow:auto;padding:16px 22px 16px}
  body.ide-wide .hero-readout{padding:6px 0 14px}
  body.ide-wide .signal-head{padding:5px 0 8px}
  body.ide-wide .hero-value{font-size:clamp(56px,min(8vw,11vh),150px)}
  body.ide-wide .hero-copy p{font-size:13px;line-height:1.55}
  body.ide-wide .trace-head{min-height:48px;padding:4px 10px}
  body.ide-wide .legend-btn,body.ide-wide .trace-range-btn,body.ide-wide .trace-tool-btn{min-height:34px}
  body.ide-wide .trace-meta{min-height:30px;padding:5px 12px}
  body.ide-wide .trace-stat{padding:7px 12px}
  body.ide-wide .trace-stat b{font-size:13px}
  body.ide-wide .trace-panel{flex:1 1 auto;display:flex;flex-direction:column;min-height:240px;margin-top:10px}
  body.ide-wide .trace-window{flex:1 1 auto;height:auto;min-height:90px}
  body.ide-wide .mini-metric{padding:7px 12px}
  body.ide-wide .mini-metric span{font-size:11px}
  body.ide-wide .mini-metric b{margin-top:2px;font-size:20px}
  body.ide-wide .monitor-rail>.pane-title,body.ide-wide .evidence>.pane-title{position:sticky;top:-30px;z-index:2;background:var(--bg)}
}
@media(max-width:1099px){.monitor-rail>.pane-title .pane-x,.evidence>.pane-title .pane-x{display:none}}

/* ==================== 新手引导层：帮助菜单 / 欢迎卡环境检测 / 聚光灯 / 刷写向导 ==================== */
.help-wrap{position:relative}
.help-btn{display:inline-flex;align-items:center;gap:7px;height:40px;padding:0 12px;border:1px solid var(--line);background:var(--bg);color:var(--ink);font-weight:700;cursor:pointer}
.help-btn:hover,.help-btn[aria-expanded="true"]{border-color:var(--accent);color:var(--strong)}
.help-q{display:inline-grid;place-items:center;width:18px;height:18px;color:var(--accent);font-family:var(--mono);font-weight:700}
.help-caret{color:var(--faint);font-size:10px}
.help-menu{position:absolute;right:0;top:calc(100% + 6px);z-index:60;width:300px;background:var(--panel);border:1px solid var(--line);box-shadow:0 20px 50px rgba(0,0,0,calc(.6*var(--shadow-k)));text-align:left}
.help-item{display:block;width:100%;text-align:left;padding:10px 16px;border:0;border-bottom:1px solid var(--line-soft);background:none;color:inherit;cursor:pointer}
.help-item:hover{background:var(--panel-2)}
.help-item b{display:block;font-size:13px;color:var(--strong)}
.help-item span{display:block;font-size:11.5px;color:var(--muted);margin-top:1px}
.help-keys{padding:10px 16px;border-bottom:1px solid var(--line-soft);font-family:var(--mono);font-size:11px;color:var(--muted);display:grid;grid-template-columns:auto 1fr;gap:3px 12px}
.help-keys span:nth-child(odd){color:var(--faint)}
.help-foot{display:flex;align-items:center;justify-content:space-between;padding:9px 16px;font-family:var(--mono);font-size:11px;color:var(--faint)}
.help-foot button{border:0;background:none;color:var(--accent);cursor:pointer;padding:0}
.help-foot button:hover{text-decoration:underline}
@media(max-width:760px){.help-label{display:none}}

/* 欢迎卡：环境检测网格 */
.gate-env{display:grid;grid-template-columns:repeat(4,1fr);border:1px solid var(--line-soft);margin-top:14px}
.gate-env-item{padding:7px 8px;font-size:11px;color:var(--muted);border-right:1px solid var(--line-soft)}
.gate-env-item:last-child{border-right:0}
.gate-env-item i{font-style:normal;margin-right:5px;font-family:var(--mono);font-weight:700}
.gate-env-item.ok i{color:var(--green)}
.gate-env-item.bad i{color:var(--red)}
.gate-env-note{margin:7px 0 0;font-size:11.5px;color:var(--faint)}
.gate-withtour{margin-top:10px;border-top:1px solid var(--line-soft);padding-top:10px;font-size:12px;color:var(--muted)}
.gate-withtour input{accent-color:var(--accent);margin-right:6px}

/* 手册首页：新手引导入口卡 */
.ob-card{margin-top:18px;border:1px solid var(--line);background:var(--panel);display:grid;grid-template-columns:minmax(0,1fr) auto;align-items:stretch}
.ob-card-main{padding:16px 18px}
.ob-card-eyebrow{font-family:var(--mono);font-size:10.5px;letter-spacing:.12em;color:var(--accent);font-weight:700;margin-bottom:5px}
.ob-card-main b{font-size:16px;color:var(--strong)}
.ob-card-main p{margin:4px 0 0;font-size:13px;color:var(--muted);line-height:1.6}
.ob-card-actions{display:flex;flex-direction:column;border-left:1px solid var(--line);min-width:170px}
.ob-card-actions .btn{border:0;border-bottom:1px solid var(--line);border-radius:0;justify-content:center;height:auto;padding:12px 16px}
.ob-card-actions .btn:last-child{border-bottom:0}
@media(max-width:760px){.ob-card{grid-template-columns:1fr}.ob-card-actions{flex-direction:row;border-left:0;border-top:1px solid var(--line)}.ob-card-actions .btn{flex:1;border-bottom:0;border-right:1px solid var(--line)}.ob-card-actions .btn:last-child{border-right:0}}

/* 聚光灯：DevTools 检查器式取景框 */
.ob-blocker{position:fixed;inset:0;z-index:79}
.ob-hole{position:fixed;z-index:80;pointer-events:none;box-shadow:0 0 0 200vmax var(--scrim);outline:1px solid var(--accent);transition:top .28s cubic-bezier(.2,.7,.2,.1),left .28s cubic-bezier(.2,.7,.2,.1),width .28s cubic-bezier(.2,.7,.2,.1),height .28s cubic-bezier(.2,.7,.2,.1)}
.ob-hole.ring-only{box-shadow:0 0 0 4px rgba(245,196,81,.18);animation:obRing 1.8s ease-in-out infinite;outline-color:rgba(245,196,81,.8)}
.ob-hole::before{content:"";position:absolute;inset:0;background:repeating-linear-gradient(135deg,rgba(245,196,81,.07) 0 6px,transparent 6px 12px);animation:obHatch .6s ease-out 1}
.ob-corner{position:absolute;width:10px;height:10px;border:2px solid var(--accent)}
.ob-corner.tl{top:-5px;left:-5px;border-right:0;border-bottom:0}
.ob-corner.tr{top:-5px;right:-5px;border-left:0;border-bottom:0}
.ob-corner.bl{bottom:-5px;left:-5px;border-right:0;border-top:0}
.ob-corner.br{bottom:-5px;right:-5px;border-left:0;border-top:0}
.ob-tag{position:absolute;left:-1px;top:-22px;white-space:nowrap;font-family:var(--mono);font-size:10.5px;line-height:20px;padding:0 7px;background:var(--accent-fill);color:#0b0b0b;max-width:70vw;overflow:hidden;text-overflow:ellipsis}
.ob-tag.below{top:auto;bottom:-22px}
@keyframes obHatch{0%{opacity:1}100%{opacity:0}}
@keyframes obRing{0%,100%{box-shadow:0 0 0 3px rgba(245,196,81,.14)}50%{box-shadow:0 0 0 8px rgba(245,196,81,.24)}}
.ob-pop{position:fixed;z-index:90;width:min(380px,86vw);background:var(--panel);border:1px solid var(--line);box-shadow:0 24px 60px rgba(0,0,0,calc(.6*var(--shadow-k)));outline:none;animation:obRise .22s cubic-bezier(.2,.7,.2,.1) both}
.ob-pop:focus{outline:1px solid var(--accent);outline-offset:2px}
@keyframes obRise{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.ob-pop.kicker-row{display:flex;align-items:center;justify-content:space-between;padding:13px 16px 0}
@media(max-width:760px){
  .ob-pop{position:fixed;inset:auto 0 0 0;width:100%;max-height:72vh;overflow:auto;border-left:0;border-right:0;border-bottom:0;animation:obSheet .26s cubic-bezier(.2,.7,.2,.1) both}
  @keyframes obSheet{from{transform:translateY(100%)}to{transform:none}}
}

/* 导览卡 */
.tour-kicker{font-family:var(--mono);font-size:10.5px;letter-spacing:.12em;color:var(--accent)}
.tour-skip{border:0;background:none;color:var(--muted);font-size:12px;cursor:pointer;padding:0}
.tour-skip:hover{color:var(--strong)}
.tour-skip .mono{font-family:var(--mono);color:var(--faint)}
.tour-title{margin:7px 16px 0;font-size:16px;font-weight:800;color:var(--strong);line-height:1.35}
.tour-body{margin:7px 16px 0;font-size:13px;color:var(--ink);line-height:1.65}
.tour-points{margin:10px 16px 0;border:1px solid var(--line-soft)}
.tour-points .tp{display:grid;grid-template-columns:6.5em 1fr;gap:8px;padding:6px 10px;border-bottom:1px solid var(--line-soft);font-size:12px}
.tour-points .tp:last-child{border-bottom:0}
.tour-points dt{font-weight:700;color:var(--strong)}
.tour-points dd{margin:0;color:var(--muted)}
.tour-foot{display:flex;align-items:center;gap:12px;padding:12px 16px;margin-top:13px;border-top:1px solid var(--line-soft)}
.tour-dots{display:flex;gap:4px}
.tour-dots i{display:block;height:3px;width:10px;background:var(--line-soft)}
.tour-dots i.done{background:var(--faint)}
.tour-dots i.cur{width:20px;background:var(--accent)}
.tour-never{display:flex;align-items:center;gap:6px;font-size:11.5px;color:var(--muted);cursor:pointer}
.tour-never input{accent-color:var(--accent)}
.tour-nav{margin-left:auto;display:flex;gap:6px}
.tour-nav .btn{height:32px;padding:0 12px;font-size:12.5px;border-radius:0}
.tour-nav .btn.primary{font-weight:800}

/* 刷写向导（右侧停靠 / 移动底部卡） */
#fg-root{position:fixed;top:64px;right:0;bottom:0;z-index:70;width:min(400px,30vw);min-width:330px;background:var(--panel);border-left:1px solid var(--line);display:flex;flex-direction:column;box-shadow:-20px 0 50px rgba(0,0,0,calc(.45*var(--shadow-k)));animation:fgIn .24s cubic-bezier(.2,.7,.2,.1) both}
@keyframes fgIn{from{transform:translateX(24px);opacity:0}to{transform:none;opacity:1}}
.fg-head{padding:13px 16px 12px;border-bottom:1px solid var(--line);flex:0 0 auto}
.fg-head-row{display:flex;align-items:center;justify-content:space-between}
.fg-kicker{font-family:var(--mono);font-size:10.5px;letter-spacing:.12em;color:var(--accent)}
.fg-x{border:0;background:none;color:var(--muted);font-size:18px;line-height:1;cursor:pointer;width:26px;height:26px}
.fg-x:hover{color:var(--strong)}
.fg-title{margin:5px 0 0;font-size:17px;font-weight:800;color:var(--strong)}
.fg-segments{display:grid;grid-template-columns:repeat(6,1fr);gap:5px;margin-top:10px}
.fg-segments i{height:3px;background:var(--line-soft);cursor:pointer;border:0;padding:0}
.fg-segments i.done{background:var(--faint)}
.fg-segments i.cur{background:var(--accent)}
.fg-body{flex:1 1 auto;min-height:0;overflow:auto;padding:14px 16px;font-size:13px;line-height:1.65;color:var(--ink)}
.fg-body p{margin:0 0 10px}
.fg-list{margin:10px 0 0;padding:0;list-style:none;border:1px solid var(--line-soft)}
.fg-list li{padding:8px 11px;border-bottom:1px solid var(--line-soft);font-size:12.5px}
.fg-list li:last-child{border-bottom:0}
.fg-list b{color:var(--strong);font-size:12.5px}
.fg-list .fg-sub{display:block;color:var(--muted);font-size:12px;margin-top:2px}
.fg-dl{margin:10px 0 0;border:1px solid var(--line-soft);font-size:12px}
.fg-dl > div{padding:8px 11px;border-bottom:1px solid var(--line-soft)}
.fg-dl > div:last-child{border-bottom:0}
.fg-dl dt{font-weight:700;color:var(--strong)}
.fg-dl dd{margin:3px 0 0;color:var(--muted)}
.fg-state{margin-top:11px;padding:8px 11px;border:1px solid var(--line);font-size:12px}
.fg-state.ok{border-color:var(--green);color:var(--green)}
.fg-state.warn{border-color:var(--amber);color:var(--amber)}
.fg-state.bad{border-color:var(--red);color:var(--red)}
.fg-target{margin-top:11px;border:1px solid var(--accent);background:rgba(245,196,81,.07);padding:10px 12px}
.fg-target .k{font-family:var(--mono);font-size:10.5px;letter-spacing:.1em;color:var(--accent)}
.fg-target .v{font-size:13px;font-weight:700;color:var(--strong);margin-top:3px;line-height:1.4}
.fg-target .x{font-size:11.5px;color:var(--muted);margin-top:3px}
.fg-phases{margin:10px 0 0;padding:0;list-style:none;border:1px solid var(--line-soft)}
.fg-phases li{display:grid;grid-template-columns:18px 1fr;gap:8px;padding:8px 11px;border-bottom:1px solid var(--line-soft)}
.fg-phases li:last-child{border-bottom:0}
.fg-phases li.run{background:rgba(245,196,81,.08)}
.fg-phases .idx{font-family:var(--mono);font-size:11px;color:var(--faint)}
.fg-phases li.done .idx{color:var(--green)}
.fg-phases li.run .idx{color:var(--accent)}
.fg-phase-zh{font-size:12.5px;font-weight:700;color:var(--strong)}
.fg-phase-en{font-family:var(--mono);font-size:10px;color:var(--muted);margin-left:5px}
.fg-phase-desc{font-size:11.5px;color:var(--muted);margin-top:1px}
.fg-foot{flex:0 0 auto;padding:12px 16px;border-top:1px solid var(--line);display:flex;gap:8px;align-items:center}
.fg-foot .btn{height:36px;font-size:12.5px;border-radius:0}
.fg-hint{margin-left:auto;font-family:var(--mono);font-size:10.5px;color:var(--faint)}
@media(max-width:760px){
  #fg-root{top:auto;left:0;bottom:0;width:100%;min-width:0;max-height:74vh;border-left:0;border-top:1px solid var(--accent);animation:obSheet .26s cubic-bezier(.2,.7,.2,.1) both}
}
.fg-errors{margin-top:16px;border:1px solid var(--line-soft)}
.fg-errors summary{padding:8px 11px;font-size:12.5px;font-weight:700;color:var(--ink);cursor:pointer}
.fg-err-btn{display:flex;justify-content:space-between;width:100%;text-align:left;border:0;border-top:1px solid var(--line-soft);background:none;color:var(--muted);padding:7px 11px;font-size:12px;cursor:pointer}
.fg-err-btn:hover{color:var(--strong);background:var(--panel-2)}
.fg-err-btn span{color:var(--accent)}

/* 串口名称解释（mac/win 切换 + 拔插对比 + 浏览器弹窗示意） */
.pe-os{display:flex;border:1px solid var(--line);margin-bottom:10px}
.pe-os button{flex:1;height:32px;border:0;background:none;color:var(--ink);font-size:12.5px;font-weight:700;cursor:pointer}
.pe-os button.on{background:#f5e3b3;color:#0b0b0b}
.pe-plug{display:inline-flex;border:1px solid var(--line);margin:0 0 8px}
.pe-plug button{padding:0 10px;height:24px;border:0;background:none;color:var(--muted);font-size:11.5px;cursor:pointer}
.pe-plug button+button{border-left:1px solid var(--line)}
.pe-plug button.on{background:var(--panel-3);color:var(--strong)}
.pe-chrome{background:#f6f3ef;color:#1f1f1f;border-radius:7px;overflow:hidden;font-family:-apple-system,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;font-size:11.5px}
.pe-chrome-head{padding:7px 12px;font-weight:600;border-bottom:1px solid #ddd}
.pe-row{position:relative;padding:6px 12px;border-bottom:1px solid #e8e4df;display:flex;align-items:center;gap:8px}
.pe-row:last-child{border-bottom:0}
.pe-row.good{background:#fff7e0;outline:2px solid #d99a1c;outline-offset:-2px;font-weight:600}
.pe-mark{font-family:var(--mono);font-size:10px;width:14px;text-align:center}
.pe-row.good .pe-mark{color:#8a5d00}.pe-row.bad .pe-mark{color:#b33}
.pe-row.bad{color:#555}
.pe-row .pe-why{padding-left:22px;font-size:10.5px;color:#888}
.pe-row.good .pe-why{color:#8a5d00}
.pe-new{margin-left:auto;font-family:var(--mono);font-size:9.5px;padding:1px 4px;background:#d99a1c;color:#0b0b0b;animation:peRow .5s ease-out both}
@keyframes peRow{from{opacity:0;transform:translateX(-10px)}to{opacity:1;transform:none}}
.pe-ol{margin:11px 0 0;padding:0;list-style:none}
.pe-ol li{display:grid;grid-template-columns:14px 1fr;gap:7px;font-size:12px;margin-bottom:6px;color:var(--ink)}
.pe-ol li i{font-style:normal;color:var(--accent);font-family:var(--mono)}
.pe-cli{margin-top:9px;padding-top:8px;border-top:1px solid var(--line-soft);font-family:var(--mono);font-size:10.5px;color:var(--faint);word-break:break-all}
.pe-nodata{margin-top:8px;font-size:11.5px;color:var(--amber)}

/* 刷写成功 / 错误 模态卡 */
.ob-modal{position:fixed;inset:0;z-index:95;background:var(--scrim);display:grid;place-items:center;animation:obFade .18s ease-out both;padding:16px}
@keyframes obFade{from{opacity:0}to{opacity:1}}
.ob-card2{position:relative;width:min(540px,92vw);background:var(--panel);border:1px solid var(--line);animation:obRise .22s cubic-bezier(.2,.7,.2,.1) both;max-height:90vh;overflow:auto}
.ob-card2.ok{border-color:var(--green)}.ob-card2.err{border-color:var(--red)}
.ob-count{position:absolute;top:0;left:0;right:0;height:3px;background:var(--line-soft)}
.ob-count i{display:block;height:100%;background:var(--green);transform-origin:left center;animation:obCount 5s linear forwards}
.ob-count i.paused{animation-play-state:paused}
@keyframes obCount{from{transform:scaleX(1)}to{transform:scaleX(0)}}
.ob-m-body{padding:22px 24px 0}
.ob-m-kicker{font-family:var(--mono);font-size:10.5px;letter-spacing:.12em}
.ob-m-kicker.ok{color:var(--green)}.ob-m-kicker.err{color:var(--red)}
.ob-m-title{margin:7px 0 0;font-size:21px;font-weight:800;color:var(--strong);line-height:1.3}
.ob-m-lead{margin:8px 0 0;font-size:13px;color:var(--ink);line-height:1.65}
.ob-stripe{height:10px;background:var(--accent-fill);margin-top:12px;background-image:repeating-linear-gradient(-45deg,rgba(11,11,11,.28) 0 6px,transparent 6px 12px);background-size:17px 17px;animation:obStripe .8s linear infinite}
@keyframes obStripe{to{background-position:17px 0}}
.ob-led{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--amber);animation:obLed 1.6s ease-in-out infinite}
@keyframes obLed{0%,100%{opacity:1}50%{opacity:.15}}
.ob-m-actions{display:flex;align-items:center;gap:8px;padding:16px 24px 20px}
.ob-m-actions .btn{border-radius:0;height:36px;padding:0 15px;font-size:12.5px}
.ob-m-actions .spacer{margin-left:auto;font-size:12px;color:var(--muted)}
.ob-steps{margin:12px 0 0;padding:0;list-style:none;border:1px solid var(--line-soft)}
.ob-steps li{display:grid;grid-template-columns:22px 1fr;gap:6px;padding:8px 11px;border-bottom:1px solid var(--line-soft);font-size:12.5px;line-height:1.55}
.ob-steps li:last-child{border-bottom:0}
.ob-steps li i{font-style:normal;color:var(--accent);font-family:var(--mono)}
.ob-code{margin-top:9px;font-family:var(--mono);font-size:10.5px;color:var(--faint)}
.ob-reboot{margin-top:13px;border:1px solid var(--line-soft);display:grid;grid-template-columns:auto 1fr;gap:12px;align-items:center;padding:11px 13px}
.ob-reboot .chip{position:relative;width:36px;height:36px;border:1px solid var(--line);display:grid;place-items:center;font-family:var(--mono);font-size:11px;color:var(--strong)}
.ob-reboot .chip i{position:absolute;right:-4px;top:-4px;width:9px;height:9px;border-radius:50%;background:var(--amber);animation:obLed 1.6s ease-in-out infinite}
.ob-reboot b{font-size:13.5px;color:var(--strong)}
.ob-reboot p{margin:2px 0 0;font-size:12px;color:var(--muted)}
@media(prefers-reduced-motion:reduce){*{animation-duration:.001ms!important;transition-duration:.001ms!important}}
/* =====================================================================
   AI Hero 主题层：墨色承载信息，金色只标记下一步
   - 1px 线 + 背景明度差分层，几乎零阴影；圆角 9px
   - 数据信号色（功率黄 / 踏频绿 / 心率红 / 速度蓝 / 参照紫）只用于数值与曲线
   ===================================================================== */
body{letter-spacing:-.005em;font-feature-settings:"ss01","cv11"}
::selection{background:rgba(245,196,81,.28);color:var(--strong)}
:is(h1,h2,h3){letter-spacing:-.025em}

/* ---- 窗口标题栏：品牌 | 工具标签 | 帮助 + 连接胶囊，单行对齐 ---- */
.masthead{height:64px;min-height:64px;background:rgba(var(--bg-rgb),.92);backdrop-filter:saturate(1.2) blur(10px);-webkit-backdrop-filter:saturate(1.2) blur(10px);border-bottom-color:var(--line)}
.brand h1{font-weight:700;font-size:17px;letter-spacing:-.035em}
.brand h1 span{color:var(--strong)}
.brand-c{font-style:normal;color:var(--accent);font:700 13px/1 var(--mono);letter-spacing:0;margin-left:2px}
.brand-mark .logo-accent{fill:var(--accent)}
.masthead-right{display:flex;align-items:center;gap:8px}
.help-btn{height:40px;border-radius:var(--radius);background:transparent}
.help-btn:hover,.help-btn[aria-expanded="true"]{background:var(--panel)}
.help-q{color:var(--accent)}
.mode-select{border:1px solid var(--line);border-radius:calc(var(--radius) + 3px);padding:3px;gap:2px;min-height:0;background:var(--panel)}
.mode-btn{min-height:34px;border:0;border-radius:var(--radius);padding:0 13px}
.mode-btn:hover{background:var(--panel-2)}
.mode-btn.active{background:rgba(245,196,81,.14);color:var(--accent);font-weight:700;box-shadow:inset 0 0 0 1px rgba(245,196,81,.32)}
.mode-btn .mode-title{font-weight:600;letter-spacing:-.01em}
.mode-btn.active .mode-title{font-weight:700}
.mode-btn.active[data-mode="flash"] .mode-title::after{color:color-mix(in srgb,var(--accent) 60%,transparent)}

/* ---- 连接胶囊：未连接时只用金色薄底，不与页面主按钮争抢 ---- */
.cap-btn{min-height:40px;border-radius:var(--radius)}
.cap-glyph{border-radius:6px}
.link-capsule[data-link="idle"] .cap-btn{background:rgba(245,196,81,.12);border-color:rgba(245,196,81,.45)}
.link-capsule[data-link="idle"] .cap-btn:hover{background:rgba(245,196,81,.2);border-color:var(--accent)}
.link-capsule[data-link="idle"] .cap-name{color:var(--accent)}
.link-capsule[data-link="idle"] .cap-sub,.link-capsule[data-link="idle"] .cap-caret{color:color-mix(in srgb,var(--accent) 62%,transparent)}
.link-capsule[data-link="idle"] .cap-glyph{border-color:rgba(245,196,81,.4);color:var(--accent)}
.link-capsule[data-link="connected"] .cap-btn{border-color:color-mix(in srgb,var(--green) 40%,transparent)}
.link-capsule[data-link="connected"] .cap-dot{box-shadow:0 0 0 2px var(--bg),0 0 0 5px color-mix(in srgb,var(--green) 18%,transparent)}
.cap-panel,.help-menu{border-radius:calc(var(--radius) + 3px);overflow:hidden;box-shadow:0 18px 50px rgba(0,0,0,calc(.5*var(--shadow-k)))}

/* ---- 不支持蓝牙：窄条提示，不打断窗口布局 ---- */
#support-warning{max-width:none;margin:0;padding:9px 22px;border:0;border-bottom:1px solid color-mix(in srgb,var(--red) 28%,transparent);background:color-mix(in srgb,var(--red) 6%,transparent);color:var(--ink);font-size:13px;line-height:1.5;border-radius:0}
#support-warning b{display:inline-block;margin-right:10px;padding:2px 7px;border:1px solid color-mix(in srgb,var(--red) 50%,transparent);border-radius:5px;color:var(--red);font:700 11px/1.4 var(--mono)}
@media(min-width:1100px) and (min-height:600px){
  body.no-ble.ide-wide #mode-connect .monitor-grid{height:calc(100vh - 64px - 39px - var(--dock-space,0px) - var(--status-h,0px))}
}
body.no-ble .fw-ide{min-height:calc(100vh - 64px - 39px - var(--dock-space,0px) - var(--status-h,0px))}

/* ---- 通用控件：9px 圆角、金色 CTA ---- */
.btn{border-radius:var(--radius);font-weight:700}
.btn.primary{color:var(--on-accent);font-weight:800}
.btn.primary:hover:not(:disabled){color:var(--on-accent)}
/* 弹窗打开时，背后的金色主按钮降级为描边，保证视口内只有一个实心金按钮 */
body.gate-lock .wrap>:not(#connect-gate) .btn.primary{background:transparent;color:var(--accent);border-color:rgba(245,196,81,.4)}
.btn.primary:disabled{background:transparent;border-color:rgba(245,196,81,.32);color:color-mix(in srgb,var(--accent) 70%,transparent);opacity:.6}
.btn.alt{border-color:rgba(245,196,81,.5);background:rgba(245,196,81,.06)}
.btn.alt:hover:not(:disabled){border-color:var(--accent);color:var(--accent);background:rgba(245,196,81,.12)}
.btn.danger{color:var(--on-danger)}
.badge{border-radius:6px}
.card,.trace-panel,.ob-card,.svc-item,.tpl-item,.device-card,.config-group,.config-panel,.flash-step,.fw-rollback,.flash-anim,.fw-notes,.linkbar,.gate-known,.serial-scope,.flash-warning,.config-status,.check-line,.trace-tooltip{border-radius:var(--radius)}
.trace-panel,.ob-card,.flash-anim,.gate-known{overflow:hidden}
.gate-card{border-radius:14px}
.gate-core{border-radius:12px}
.trace-ranges{border-radius:8px;overflow:hidden}
.trace-tool-btn,.legend-btn{border-radius:8px}
.trace-range-btn.active{background:rgba(245,196,81,.14);color:var(--accent)}
.form-field input[type="number"],.form-field input[type="text"],.form-field select,#firmware-board{border-radius:8px}
esp-web-install-button{--esp-tools-button-border-radius:9px}
.dock-count,.dock-tool{border-radius:5px}

/* ---- IDE 面板标题：窗口 chrome ---- */
.pane-title{background:var(--panel);letter-spacing:.14em}
.pane-title::before{content:"";width:6px;height:6px;border-radius:50%;background:var(--line);margin-right:-2px;flex:0 0 auto}
.pane-title>span{flex:1}
.ide-dock{background:var(--panel)}
.dock-tab.active{color:var(--accent)}
body.ide-wide .ide-status{background:var(--page-bg)}
.st-link[data-link="connected"]{color:var(--on-accent)}

/* ---- 实时读数：数据信号色 ---- */
.hero-value{font:700 clamp(92px,10vw,176px)/.8 var(--sans);letter-spacing:-.055em;font-variant-numeric:tabular-nums}
.hero-value.sig-power{color:var(--sig-power)}
.hero-value small{font:700 clamp(22px,2.4vw,36px)/1 var(--mono);letter-spacing:-.02em;color:color-mix(in srgb,var(--accent) 62%,transparent)}
.hero-value.tick #m-power{animation:readTick .6s cubic-bezier(.2,.8,.2,1)}
@keyframes readTick{0%{text-shadow:0 0 0 rgba(245,196,81,0)}25%{text-shadow:0 0 28px rgba(245,196,81,.45)}100%{text-shadow:0 0 0 rgba(245,196,81,0)}}
body.ide-wide .hero-value{font-size:clamp(56px,min(8vw,11vh),150px)}
.mini-metric b{font-variant-numeric:tabular-nums}
.mini-metric.sig-cadence b{color:var(--sig-cadence)}
.mini-metric.sig-hr b{color:var(--sig-hr)}
.mini-metric.sig-speed b{color:var(--sig-speed)}
.mini-metric.sig-cadence em,.mini-metric.sig-hr em,.mini-metric.sig-speed em{color:var(--muted)}
.mini-metric.sig-cadence>span::before,.mini-metric.sig-hr>span::before,.mini-metric.sig-speed>span::before{content:"";display:inline-block;width:8px;height:8px;border-radius:2px;margin-right:7px;vertical-align:0;background:currentColor}
.mini-metric.sig-cadence>span::before{color:var(--sig-cadence)}.mini-metric.sig-hr>span::before{color:var(--sig-hr)}.mini-metric.sig-speed>span::before{color:var(--sig-speed)}
.trace-stat.sig-power b{color:var(--sig-power)}
.trace-stat.sig-cadence b{color:var(--sig-cadence)}
.trace-stat.sig-hr b{color:var(--sig-hr)}
.trace-stat em{color:var(--muted)}
.trace-meta strong{color:var(--accent)}
.health-score>b{font-variant-numeric:tabular-nums}
.role-badge.external{color:var(--sig-ref);border-color:color-mix(in srgb,var(--violet) 50%,transparent)}
@media(prefers-reduced-motion:reduce){.hero-value.tick #m-power{animation:none}}

/* =====================================================================
   移动端引导页（< 900px）：只读，不进入蓝牙 / 串口工作流
   ===================================================================== */
.mobile-guide{display:none}
@media(max-width:899px){
  .ob-modal,.ob-hole,.ob-pop,.ob-blocker{display:none!important}
  body.gate-lock{overflow:auto}
  .mobile-guide{display:block;min-height:100vh;padding:0 0 calc(28px + env(safe-area-inset-bottom));background:var(--bg)}
}
.mg-bar{position:sticky;top:0;z-index:5;display:flex;align-items:center;justify-content:space-between;gap:12px;height:56px;padding:0 18px;border-bottom:1px solid var(--line);background:rgba(var(--bg-rgb),.9);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px)}
.mg-brand{display:flex;align-items:center;gap:9px}
.mg-brand .brand-mark{width:26px;height:26px}
.mg-brand b{color:var(--strong);font:700 16px/1 var(--sans);letter-spacing:-.035em}
.mg-chip{padding:5px 9px;border:1px solid var(--line);border-radius:999px;color:var(--muted);font:600 11px/1 var(--mono)}
.mg-hero{padding:34px 20px 26px;border-bottom:1px solid var(--line)}
.mg-eyebrow{display:inline-flex;align-items:center;gap:10px;color:var(--faint);font:600 11px/1 var(--mono);letter-spacing:.12em;text-transform:uppercase}
.mg-eyebrow::before{content:"";width:22px;height:1px;background:var(--accent)}
.mg-hero h1{margin:16px 0 0;color:var(--strong);font:700 clamp(32px,9vw,44px)/1.08 var(--sans);letter-spacing:-.04em}
.mg-hero h1 em{font-style:normal;color:var(--accent)}
.mg-hero p{margin:14px 0 0;color:var(--ink);font-size:15px;line-height:1.7}
.mg-channels{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));margin-top:22px;border:1px solid var(--line);border-radius:var(--radius);overflow:hidden;background:var(--panel)}
.mg-ch{position:relative;min-width:0;padding:12px 10px 10px;border-right:1px solid var(--line-soft)}
.mg-ch:last-child{border-right:0}
.mg-ch span{display:block;color:var(--muted);font-size:12px}
.mg-ch b{display:block;margin-top:2px;color:var(--c);font:700 17px/1.2 var(--mono);letter-spacing:-.02em}
.mg-ch i{display:flex;align-items:flex-end;gap:3px;height:26px;margin-top:8px}
.mg-ch s{flex:1;height:30%;border-radius:2px 2px 0 0;background:var(--c);opacity:.85;animation:mgBar 1.6s ease-in-out infinite}
.mg-ch s:nth-child(2){animation-delay:-.2s}.mg-ch s:nth-child(3){animation-delay:-.45s}.mg-ch s:nth-child(4){animation-delay:-.7s}.mg-ch s:nth-child(5){animation-delay:-.95s}.mg-ch s:nth-child(6){animation-delay:-1.2s}.mg-ch s:nth-child(7){animation-delay:-1.4s}
.mg-ch:nth-child(2) s{animation-duration:1.15s}.mg-ch:nth-child(3) s{animation-duration:.9s}.mg-ch:nth-child(4) s{animation-duration:2.1s}
@keyframes mgBar{0%,100%{height:22%}50%{height:100%}}
.mg-ch small{display:block;margin-top:7px;color:var(--faint);font:10px/1.2 var(--mono);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mg-desk{margin:22px 16px 0;padding:18px;border:1px solid rgba(245,196,81,.32);border-radius:14px;background:var(--accent-wash)}
.mg-desk-head{display:flex;gap:12px;align-items:flex-start}
.mg-num{width:34px;height:34px;flex:0 0 auto;display:grid;place-items:center;border-radius:var(--radius);background:rgba(245,196,81,.14);color:var(--accent);font:700 15px/1 var(--mono)}
.mg-desk h2{margin:0;color:var(--strong);font-size:19px;line-height:1.3}
.mg-desk-head p{margin:3px 0 0;color:var(--muted);font-size:13px}
.mg-url{display:block;margin-top:14px;padding:11px 12px;border:1px solid var(--line);border-radius:var(--radius);background:var(--bg);color:var(--strong);font:500 13px/1.45 var(--mono);word-break:break-all;user-select:all;-webkit-user-select:all}
.mg-actions{display:grid;gap:8px;margin-top:12px}
.mg-actions .btn{width:100%}
.mg-copied{min-height:18px;margin:8px 0 0;color:var(--green);font-size:12px}
.mg-sec{margin:0 16px;padding:26px 0 4px;border-bottom:1px solid var(--line-soft)}
.mg-sec:last-of-type{border-bottom:0}
.mg-h{display:flex;align-items:baseline;gap:10px;margin:0 0 14px;color:var(--strong);font-size:18px}
.mg-h span{color:var(--accent);font:700 12px/1 var(--mono)}
.mg-steps{list-style:none;margin:0;padding:0;counter-reset:mg}
.mg-steps li{position:relative;padding:0 0 18px 40px;counter-increment:mg}
.mg-steps li::before{content:counter(mg,decimal-leading-zero);position:absolute;left:0;top:0;width:28px;height:28px;display:grid;place-items:center;border:1px solid var(--line);border-radius:8px;color:var(--muted);font:700 11px/1 var(--mono)}
.mg-steps li::after{content:"";position:absolute;left:14px;top:32px;bottom:4px;width:1px;background:var(--line-soft)}
.mg-steps li:last-child::after{display:none}
.mg-steps b{display:flex;align-items:center;gap:8px;color:var(--strong);font-size:15px;line-height:28px}
.mg-steps b em{font-style:normal;padding:2px 6px;border:1px solid var(--line);border-radius:5px;color:var(--muted);font:600 10px/1.3 var(--mono)}
.mg-steps li:last-child b em{border-color:color-mix(in srgb,var(--green) 45%,transparent);color:var(--green)}
.mg-steps p{margin:4px 0 0;color:var(--ink);font-size:14px;line-height:1.7}
.mg-steps code,.mg-facts dd{font-family:var(--mono)}
.mg-steps code{padding:1px 5px;border-radius:4px;background:var(--panel-2);color:var(--strong);font-size:12.5px}
.mg-tools{list-style:none;margin:0 0 18px;padding:0;display:grid;grid-template-columns:1fr 1fr;border:1px solid var(--line);border-radius:var(--radius);overflow:hidden}
.mg-tools li{padding:12px;border-right:1px solid var(--line-soft);border-bottom:1px solid var(--line-soft);background:var(--panel)}
.mg-tools li:nth-child(2n){border-right:0}
.mg-tools li:nth-last-child(-n+2){border-bottom:0}
.mg-tools b{display:block;color:var(--strong);font-size:14px}
