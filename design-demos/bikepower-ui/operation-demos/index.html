<!doctype html><html lang="zh-CN" data-theme="light"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>BikePower 操作演示</title><style>
:root{
  --bg:#0b0b0b;
  --panel:#100f0e;
  --panel-2:#171614;
  --panel-3:#1e1c19;
  --line:#2e2c29;
  --line-soft:#1f1e1c;
  --ink:#c9c6c1;
  --strong:#f4f3f1;
  --muted:#9a968f;
  --faint:#6b6762;
  --accent:#f5c451;
  --accent-dark:#5c4716;
  --accent-soft:rgba(245,196,81,.13);
  --green:#6fd39a;
  --green-soft:rgba(111,211,154,.12);
  --red:#ff6b6b;
  --red-soft:rgba(255,107,107,.12);
  --amber:#f29a4a;
  --amber-soft:rgba(242,154,74,.12);
  --violet:#a78bfa;
  /* 数据信号色：只用于数值与曲线，不用于按钮；金色 CTA 仍是唯一“下一步” */
  --sig-power:#f5c451;
  --sig-cadence:#6fd39a;
  --sig-hr:#ff6b6b;
  --sig-speed:#6aa8ff;
  --sig-ref:#a78bfa;
  --accent-wash:rgba(245,196,81,.06);
  --radius:9px;
  --mono:"JetBrains Mono",Menlo,"SFMono-Regular",Consolas,monospace;
  --sans:"DM Sans","PingFang SC","Noto Sans SC","Microsoft YaHei",sans-serif;
  --display:"DM Sans","PingFang SC","Noto Sans SC",sans-serif;
  /* 主题无关的派生变量：金色实底 / 墨色前景 / 遮罩 / 阴影强度 */
  --page-bg:#080808;
  --accent-fill:#f5c451;
  --accent-fill-hover:#ffd873;
  --on-accent:#0b0b0b;
  --on-danger:#0b0b0b;
  --bg-rgb:11,11,11;
  --strong-rgb:244,243,241;
  --scrim:rgba(4,4,4,.78);
  --shadow-k:1;
  color-scheme:dark;
}
/* ===== 亮色主题：AI Hero light 令牌（墨色承载信息，金色只做实底 CTA） =====
   --accent 在亮色下是“深琥珀”，只用于文字/线条；实心金按钮走 --accent-fill。 */
:root[data-theme="light"]{
  color-scheme:light;
  --page-bg:#f1f2f5;
  --bg:#fbfbfc;
  --panel:#ffffff;
  --panel-2:#f5f6f8;
  --panel-3:#eceef2;
  --line:#e0e2e7;
  --line-soft:#ebedf0;
  --ink:#383b41;
  --strong:#14161a;
  --muted:#5b5f67;
  --faint:#82868e;
  --accent:#946600;
  --accent-dark:#e6cf94;
  --accent-soft:rgba(245,196,81,.22);
  --accent-wash:rgba(245,196,81,.12);
  --accent-fill-hover:#eab534;
  --green:#14804a;
  --green-soft:rgba(20,128,74,.1);
  --red:#cc3437;
  --red-soft:rgba(204,52,55,.09);
  --amber:#b85d0c;
  --amber-soft:rgba(184,93,12,.1);
  --violet:#6a4bd0;
  --sig-power:#a26f00;
  --sig-cadence:#14804a;
  --sig-hr:#cc3437;
  --sig-speed:#2160c4;
  --sig-ref:#6a4bd0;
  --on-danger:#ffffff;
  --bg-rgb:251,251,252;
  --strong-rgb:20,22,26;
  --scrim:rgba(20,22,26,.42);
  --shadow-k:.2;
}
/* 切换瞬间的整页色彩过渡（只在切换时挂 0.32s，避免影响实时数值渲染） */
html.theme-swap,html.theme-swap *,html.theme-swap *::before,html.theme-swap *::after{
  transition:background-color .32s ease,border-color .32s ease,color .32s ease,fill .32s ease,stroke .32s ease!important;
}
@media (prefers-reduced-motion:reduce){html.theme-swap *{transition:none!important}}
*{box-sizing:border-box}
html{background:var(--page-bg)}
html,body{margin:0;padding:0}
body{background:var(--bg)}
body{
  color:var(--ink);font-family:var(--sans);font-size:15px;line-height:1.55;
  min-height:100vh;-webkit-font-smoothing:antialiased;
}
button,a,select,summary{font:inherit}
button:focus-visible,a:focus-visible,input:focus-visible,select:focus-visible,summary:focus-visible{outline:2px solid var(--accent);outline-offset:3px}
.wrap{min-height:100vh}
.hidden{display:none!important}

/* ===== 顶部品牌与任务导航 ===== */
.masthead{
  min-height:64px;border-bottom:1px solid var(--line);padding:0 22px;
  display:grid;grid-template-columns:auto minmax(0,1fr) auto;align-items:center;gap:18px;
  background:rgba(var(--bg-rgb),.96);position:sticky;top:0;z-index:20;
}
.brand{display:flex;align-items:center;gap:10px;min-width:0}
.brand-mark{
  width:30px;height:30px;display:block;flex:0 0 auto;color:var(--strong);
}
.brand-mark .logo-accent{fill:var(--accent)}
.brand-mark .logo-line{fill:none;stroke:currentColor;stroke-width:6;stroke-linecap:square}
.brand-mark .logo-hub{fill:var(--bg);stroke:currentColor;stroke-width:4}
.brand h1{font-size:16px;line-height:1;margin:0;font-weight:900;letter-spacing:-.04em;color:var(--strong)}
.brand h1 span{color:var(--accent)}
.brand .sub{display:none}
.masthead-right{justify-self:end}
.chip{display:inline-flex;align-items:center;gap:8px;color:var(--muted);font:12px/1 var(--mono);white-space:nowrap}
.chip .dot{width:7px;height:7px;border-radius:50%;background:var(--green)}
.mode-select{display:flex;align-items:stretch;justify-self:center;max-width:100%;overflow-x:auto;scrollbar-width:none;border:1px solid var(--line);min-height:40px}
.mode-btn{
  min-width:0;flex:0 0 auto;min-height:44px;border:0;border-right:1px solid var(--line);
  padding:0 16px;background:transparent;color:var(--muted);cursor:pointer;
  display:grid;place-items:center;transition:background .15s,color .15s;
}
.mode-btn:last-child{border-right:0}
.mode-btn:hover{color:var(--strong);background:var(--panel)}
.mode-btn.active{background:var(--ink);color:var(--bg);font-weight:900}
.mode-btn .ico,.mode-btn .mode-desc{display:none}
.mode-btn .mode-title{font-size:13px;font-weight:800;white-space:nowrap}
.mode-btn[data-mode="flash"] .mode-title::after{content:" · USB";color:var(--faint);font:700 10px/1 var(--mono)}
.mode-btn.active[data-mode="flash"] .mode-title::after{color:var(--line)}

/* ===== 右上角常驻蓝牙连接胶囊（主连接 = BLE） ===== */
.link-capsule{position:relative}
.cap-btn{
  display:inline-flex;align-items:center;gap:10px;min-height:44px;max-width:320px;padding:0 12px 0 9px;
  border:1px solid var(--line);background:var(--bg);color:var(--ink);cursor:pointer;transition:border-color .15s,background .15s,color .15s;
}
.cap-btn:hover{border-color:var(--accent);background:var(--panel)}
.cap-glyph{position:relative;width:26px;height:26px;display:grid;place-items:center;flex:0 0 auto;border:1px solid var(--line);color:var(--accent)}
.cap-glyph svg{width:14px;height:14px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:square;stroke-linejoin:miter}
.cap-dot{position:absolute;right:-4px;bottom:-4px;width:8px;height:8px;border-radius:50%;background:var(--faint);box-shadow:0 0 0 2px var(--bg)}
.cap-text{display:flex;flex-direction:column;gap:4px;min-width:0;text-align:left}
.cap-name{color:var(--strong);font:800 13px/1 var(--sans);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:190px}
.cap-sub{color:var(--muted);font:10px/1 var(--mono);letter-spacing:.03em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:230px}
.cap-caret{color:var(--faint);font:10px/1 var(--mono)}
.link-capsule[data-link="idle"] .cap-btn{background:var(--accent-fill);border-color:var(--accent-fill)}
.link-capsule[data-link="idle"] .cap-btn:hover{background:var(--accent-fill-hover);border-color:var(--accent-fill-hover)}
.link-capsule[data-link="idle"] .cap-name{color:var(--on-accent)}
.link-capsule[data-link="idle"] .cap-sub,.link-capsule[data-link="idle"] .cap-caret{color:rgba(11,11,11,.62)}
.link-capsule[data-link="idle"] .cap-glyph{border-color:rgba(11,11,11,.35);color:var(--on-accent)}
.link-capsule[data-link="idle"] .cap-dot{display:none}
.link-capsule[data-link="connected"] .cap-dot{background:var(--green)}
.link-capsule[data-link="connected"] .cap-glyph{border-color:var(--accent-dark)}
.link-capsule[data-link="connecting"] .cap-dot{background:var(--amber);animation:capBlink .9s steps(2) infinite}
.link-capsule[data-link="mirror"] .cap-dot{background:var(--amber)}
.link-capsule[data-link="lost"] .cap-dot{background:var(--red)}
.link-capsule[data-link="lost"] .cap-btn{border-color:var(--red)}
.link-capsule[data-link="unsupported"] .cap-glyph{color:var(--faint)}
@keyframes capBlink{50%{opacity:.15}}
.link-capsule.cap-arrive .cap-glyph::after{content:"";position:absolute;inset:-1px;border:1px solid var(--accent);animation:capArrive .9s cubic-bezier(.2,.7,.2,1) forwards}
@keyframes capArrive{from{transform:scale(1);opacity:1}to{transform:scale(2.6);opacity:0}}
.cap-panel{
  position:absolute;right:0;top:calc(100% + 8px);width:340px;max-width:calc(100vw - 24px);z-index:60;
  background:var(--panel);border:1px solid var(--line);box-shadow:0 18px 50px rgba(0,0,0,calc(.55*var(--shadow-k)));
}
.cp-head{display:flex;justify-content:space-between;align-items:center;padding:12px 16px;border-bottom:1px solid var(--line);color:var(--faint);font:700 10px/1 var(--mono);letter-spacing:.12em}
.cp-state{letter-spacing:.04em}
.cp-state.connected{color:var(--green)}.cp-state.connecting,.cp-state.mirror{color:var(--amber)}.cp-state.lost{color:var(--red)}
.cp-main{padding:16px}
.cp-name{color:var(--strong);font:600 30px/1.05 var(--display);word-break:break-all}
.cp-id{margin-top:6px;color:var(--faint);font:11px/1.4 var(--mono);word-break:break-all}
.cp-role{margin-top:12px}
.cp-rows{margin-top:12px;border-top:1px solid var(--line-soft)}
.cp-row{display:flex;justify-content:space-between;gap:12px;padding:7px 0;border-bottom:1px solid var(--line-soft);font-size:12px}
.cp-row span:first-child{color:var(--muted)}.cp-row span:last-child{color:var(--strong);font-family:var(--mono);text-align:right;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:200px}
.cp-note{margin-top:10px;color:var(--muted);font-size:12px;line-height:1.6}
.cp-actions{display:grid;grid-template-columns:1fr 1fr;border-top:1px solid var(--line)}
.cp-actions .btn{border:0;border-right:1px solid var(--line);border-bottom:1px solid var(--line);min-height:46px}
.cp-actions .btn:nth-child(2n){border-right:0}
.cp-actions .btn:last-child:nth-child(odd){grid-column:1/-1;border-right:0}
.cp-serial{display:flex;justify-content:space-between;align-items:center;gap:10px;width:100%;padding:11px 16px;border:0;background:var(--bg);color:var(--muted);font-size:12px;text-align:left;cursor:pointer}
.cp-serial b{color:var(--ink);font:700 11px/1 var(--mono)}
.cp-serial:hover{color:var(--accent)}

/* ===== 进站连接门（类钱包连接）：半圆功率表盘 = 蓝牙扫描雷达 ===== */
body.gate-lock{overflow:hidden}
.gate{position:fixed;inset:0;z-index:110;display:grid;place-items:center;padding:24px;background:rgba(var(--bg-rgb),.86);backdrop-filter:blur(6px);transition:opacity .32s ease}
.gate.gate-leaving{opacity:0;pointer-events:none}
.gate-card{position:relative;width:min(468px,100%);max-height:calc(100vh - 48px);overflow:auto;background:var(--panel);border:1px solid var(--line);box-shadow:0 30px 90px rgba(0,0,0,calc(.6*var(--shadow-k)))}
.gate-x{position:absolute;top:8px;right:8px;z-index:2;width:44px;height:44px;border:0;background:transparent;color:var(--muted);font-size:20px;cursor:pointer}
.gate-x:hover{color:var(--strong)}
.gate-radar{position:relative;height:196px;overflow:hidden;border-bottom:1px solid var(--line);background:radial-gradient(circle at 50% 100%,rgba(245,196,81,.12),transparent 62%),var(--bg)}
.radar-rings{position:absolute;inset:0;background:repeating-radial-gradient(circle at 50% 100%,transparent 0 37px,var(--line-soft) 37px 38px)}
.radar-ticks{position:absolute;left:50%;bottom:0;width:372px;height:186px;margin-left:-186px;border-radius:186px 186px 0 0;border:1px solid var(--line);border-bottom:0}
.radar-scale{position:absolute;bottom:8px;color:var(--faint);font:10px/1 var(--mono);letter-spacing:.08em}
.radar-scale.l{left:14px}.radar-scale.r{right:14px}
.radar-sweep{position:absolute;left:50%;bottom:0;width:400px;height:400px;margin-left:-200px;margin-bottom:-200px;border-radius:50%;
  background:conic-gradient(from 0deg,transparent 0 318deg,rgba(245,196,81,.05) 320deg,rgba(245,196,81,.42) 358deg,var(--accent) 359.4deg,transparent 360deg);
  animation:gateSweep 3.6s linear infinite}
@keyframes gateSweep{from{transform:rotate(-90deg)}to{transform:rotate(270deg)}}
.gate[data-gate="auto"] .radar-sweep,.gate[data-gate="connecting"] .radar-sweep{animation-duration:1.25s}
.gate[data-gate="locked"] .radar-sweep{animation:none;transform:rotate(0deg);opacity:.9}
.gate[data-gate="error"] .radar-sweep,.gate[data-gate="unsupported"] .radar-sweep{display:none}
.gate[data-gate="locked"] .radar-rings{background:repeating-radial-gradient(circle at 50% 100%,transparent 0 37px,rgba(245,196,81,.38) 37px 38px);transition:background .3s}
.radar-blips{position:absolute;inset:0}
.blip{position:absolute;transform:translate(-50%,50%);display:flex;align-items:center;gap:6px;color:var(--ink);font:10px/1 var(--mono);white-space:nowrap;pointer-events:none}
.blip i{width:7px;height:7px;background:var(--strong);box-shadow:0 0 0 3px rgba(var(--strong-rgb),.12)}
.blip.last i{background:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.gate-core{position:absolute;left:50%;bottom:0;width:58px;height:58px;margin-left:-29px;margin-bottom:-1px;display:grid;place-items:center;background:var(--panel);border:1px solid var(--accent);color:var(--accent)}
.gate-core svg{width:24px;height:24px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:square;stroke-linejoin:miter}
.gate[data-gate="auto"] .gate-core,.gate[data-gate="connecting"] .gate-core{animation:corePulse 1.25s ease-in-out infinite}
.gate[data-gate="locked"] .gate-core{background:var(--accent-fill);color:var(--on-accent)}
.gate[data-gate="error"] .gate-core{border-color:var(--red);color:var(--red)}
.gate[data-gate="unsupported"] .gate-core{border-color:var(--line);color:var(--faint)}
@keyframes corePulse{50%{box-shadow:0 0 0 10px rgba(245,196,81,.12)}}
.gate-body{padding:22px 24px 6px}
.gate-eyebrow{display:flex;justify-content:space-between;gap:12px;color:var(--faint);font:700 10px/1 var(--mono);letter-spacing:.12em}
.gate-eyebrow b{color:var(--accent);font-weight:700}
.gate-body h2{margin:14px 0 0;color:var(--strong);font:600 34px/1.08 var(--display);letter-spacing:-.01em}
.gate-body h2 em{font-style:italic;color:var(--accent)}
.gate-desc{margin:10px 0 0;color:var(--muted);font-size:14px;line-height:1.7}
.gate-known{margin-top:16px;border:1px solid var(--line)}
.gate-known-head{padding:9px 12px;border-bottom:1px solid var(--line);color:var(--faint);font:700 10px/1 var(--mono);letter-spacing:.1em}
.gate-dev{display:grid;grid-template-columns:minmax(0,1fr) auto auto;align-items:center;gap:12px;width:100%;min-height:48px;padding:0 12px;border:0;border-bottom:1px solid var(--line-soft);background:transparent;color:var(--ink);text-align:left;cursor:pointer}
.gate-dev:last-child{border-bottom:0}
.gate-dev:hover:not(:disabled){background:var(--panel-2)}
.gate-dev:hover:not(:disabled) .gate-dev-go{color:var(--accent);transform:translateX(3px)}
.gate-dev:disabled{opacity:.5;cursor:not-allowed}
.gate-dev-name{color:var(--strong);font-weight:800;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.gate-dev-tag{color:var(--muted);font:10px/1 var(--mono);border:1px solid var(--line);padding:4px 6px}
.gate-dev-tag.last{color:var(--accent);border-color:var(--accent-dark)}
.gate-dev-go{color:var(--faint);font:700 12px/1 var(--mono);transition:transform .15s,color .15s}
.gate-actions{display:grid;gap:8px;margin-top:16px}
.gate-actions .btn{width:100%}
.gate-alt{display:grid;grid-template-columns:1fr 1fr;margin:16px -24px 0;border-top:1px solid var(--line)}
.gate-link{min-height:58px;padding:10px 16px;border:0;background:transparent;color:var(--ink);text-align:left;cursor:pointer;font-size:13px;font-weight:800;display:flex;flex-direction:column;justify-content:center;gap:4px}
.gate-link+.gate-link{border-left:1px solid var(--line)}
.gate-link small{color:var(--faint);font:400 11px/1.3 var(--mono)}
.gate-link:hover{background:var(--panel-2);color:var(--accent)}
.gate-foot{display:flex;justify-content:space-between;gap:10px;padding:10px 16px;border-top:1px solid var(--line);background:var(--bg);color:var(--faint);font:10px/1.3 var(--mono);letter-spacing:.06em}
.gate-fly{position:fixed;z-index:130;width:18px;height:18px;background:var(--accent-fill);box-shadow:0 0 0 6px var(--accent-soft),0 0 24px rgba(245,196,81,.6);pointer-events:none}
@media(prefers-reduced-motion:reduce){.radar-sweep,.gate-core,.cap-dot{animation:none!important}.gate{transition:none}}
@media(max-width:520px){.gate{padding:12px;align-items:end}.gate-body h2{font-size:28px}.gate-alt{grid-template-columns:1fr}.gate-link+.gate-link{border-left:0;border-top:1px solid var(--line)}.gate-foot span:nth-child(2){display:none}.gate-radar{height:168px}.radar-scale.r{display:none}}

/* ===== 手册首页：连接状态条（连接后引导下一步） ===== */
.linkbar{display:grid;grid-template-columns:auto minmax(0,1fr) auto;align-items:center;gap:16px;margin-top:26px;padding:14px 16px;border:1px solid var(--line);background:var(--panel)}
.linkbar .lb-mark{width:34px;height:34px;display:grid;place-items:center;border:1px solid var(--accent);color:var(--accent);font:800 13px/1 var(--mono)}
.linkbar b{display:block;color:var(--strong);font-size:15px}
.linkbar span.lb-sub{display:block;margin-top:3px;color:var(--muted);font-size:13px;line-height:1.5}
.linkbar.on{border-color:var(--accent-dark);background:linear-gradient(90deg,var(--accent-soft),transparent 60%),var(--panel)}
.linkbar.on .lb-mark{background:var(--accent-fill);color:var(--on-accent)}
@media(max-width:600px){.linkbar{grid-template-columns:auto minmax(0,1fr)}.linkbar .btn{grid-column:1/-1}}

/* ===== 刷写页：串口作用域说明 ===== */
.serial-scope{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:16px;align-items:center;margin:0 0 18px;padding:12px 14px;border:1px dashed var(--line);color:var(--muted);font-size:13px;line-height:1.6}
.serial-scope b{color:var(--strong)}
@media(max-width:600px){.serial-scope{grid-template-columns:1fr}}

/* ===== 通用控件 ===== */
.btn{
  min-height:44px;border:1px solid var(--line);border-radius:0;padding:9px 16px;
  color:var(--ink);background:transparent;cursor:pointer;font-size:13px;font-weight:800;
  display:inline-flex;align-items:center;justify-content:center;gap:6px;transition:background .15s,border-color .15s,color .15s;
}
.btn:hover:not(:disabled){border-color:var(--accent);color:var(--strong);background:var(--panel-2)}
.btn:active:not(:disabled){transform:translateY(1px)}
.btn:disabled{opacity:.42;cursor:not-allowed}
.btn.primary{background:var(--accent-fill);border-color:var(--accent-fill);color:var(--on-accent)}
.btn.primary:hover:not(:disabled){background:var(--accent-fill-hover);border-color:var(--accent-fill-hover);color:var(--on-accent)}
.btn.alt{border-color:var(--accent);color:var(--accent)}
.btn.ghost{color:var(--muted)}
.btn.danger{background:var(--red);border-color:var(--red);color:var(--on-danger)}
.btn.sm{min-height:44px;padding:7px 12px;font-size:12px}
.btn.big{min-height:50px;padding:12px 22px;font-size:14px}
.actions,.dc-foot,.flash-cta{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.release-link{color:var(--accent);font-weight:800;text-decoration:none}
.release-link:hover{text-decoration:underline}

/* ===== 页面与面板 ===== */
#support-warning{margin:18px auto 0;max-width:1120px;border-color:var(--red);color:var(--red)}
#mode-compare{max-width:1120px;margin:24px auto 0;padding:0 20px 40px}
.card{background:var(--panel);border:1px solid var(--line);padding:22px}
.card+.card{margin-top:16px}
.card-head{display:flex;align-items:center;justify-content:space-between;gap:16px;margin-bottom:18px;padding-bottom:15px;border-bottom:1px solid var(--line)}
.card-head h2{margin:0;color:var(--strong);font-size:20px;line-height:1.2;font-weight:900}
.card-head .actions{justify-content:flex-end}
.badge{
  display:inline-flex;align-items:center;min-height:28px;padding:4px 9px;border:1px solid var(--line);
  color:var(--muted);font:700 12px/1 var(--mono);letter-spacing:.01em;
}
.badge.ok{border-color:var(--green);color:var(--green);background:var(--green-soft)}
.badge.warn{border-color:var(--amber);color:var(--amber);background:var(--amber-soft)}
.badge.err{border-color:var(--red);color:var(--red);background:var(--red-soft)}
.badge.muted{background:var(--panel-2)}
.flash-step{margin:12px 0;padding:16px;border:1px solid var(--line);background:var(--panel-2)}
.flash-step b{color:var(--strong);font-size:14px}
.flash-step p{margin:7px 0 0;color:var(--muted);font-size:14px;line-height:1.65}
.flash-lead{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:22px;align-items:center;padding:20px 0 22px;border-bottom:1px solid var(--line)}
.flash-lead strong{display:block;color:var(--strong);font-size:22px;line-height:1.25}
.flash-lead p{margin:7px 0 0;color:var(--muted);font-size:14px;line-height:1.65}
.flash-time{min-width:116px;border-left:1px solid var(--line);padding-left:18px;color:var(--accent);font:800 12px/1.5 var(--mono)}
.flash-time b{display:block;color:var(--strong);font:600 36px/1 var(--display)}
.flash-guide{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin:18px 0}
.flash-step.guide-step{margin:0;min-height:170px;padding:18px;display:flex;flex-direction:column}
.step-number{display:block;margin-bottom:22px;color:var(--accent);font:800 12px/1 var(--mono)}
.flash-step.guide-step p{margin-top:auto;padding-top:14px}
.flash-expect{display:grid;grid-template-columns:150px 1fr;gap:18px;padding:16px 0;border-top:1px solid var(--line);border-bottom:1px solid var(--line)}
.flash-expect>strong{color:var(--strong);font-size:14px}
.flash-terms{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.flash-term{padding-left:12px;border-left:2px solid var(--line);color:var(--muted);font-size:13px;line-height:1.5}
.flash-term b{display:block;color:var(--ink);font:700 12px/1.5 var(--mono)}
.flash-warning{margin:14px 0 0;padding:13px 15px;border:1px solid var(--accent-dark);background:var(--accent-soft);color:var(--ink);font-size:14px;line-height:1.6}
.flash-details{margin-top:16px;border-top:1px solid var(--line);padding-top:6px}
.flash-details summary{min-height:44px;display:flex;align-items:center;cursor:pointer;color:var(--muted);font-weight:800}
.flash-details[open] summary{color:var(--accent)}
.flash-cta{margin:18px 0}

/* ===== 刷写页：左侧版本时间轴 + 主窗口（IDE 式） ===== */
.fw-ide{display:grid;grid-template-columns:300px minmax(0,1fr);min-height:calc(100vh - 64px - var(--dock-space,0px) - var(--status-h,0px))}
.fw-rail{position:relative;border-right:1px solid var(--line);background:var(--panel);display:flex;flex-direction:column;min-height:0}
.pane-title{min-height:36px;display:flex;align-items:center;justify-content:space-between;gap:10px;padding:0 14px;border-bottom:1px solid var(--line);color:var(--faint);font:800 10px/1 var(--mono);letter-spacing:.12em;text-transform:uppercase;flex:0 0 auto}
.pane-title b{color:var(--muted);font-weight:700;letter-spacing:.02em}
.pane-x{width:28px;height:28px;border:0;background:transparent;color:var(--faint);cursor:pointer;display:grid;place-items:center;padding:0}
.pane-title .pane-x{margin-right:-8px}
.pane-x:hover{color:var(--accent)}
.pane-x svg{width:14px;height:14px;fill:none;stroke:currentColor;stroke-width:1.6}
.fw-timeline{position:relative;list-style:none;margin:0;padding:10px 0;flex:1 1 auto;overflow:auto}
.fw-timeline::before{content:"";position:absolute;left:27px;top:0;bottom:0;width:1px;background:var(--line)}
.fw-loading{padding:14px 18px 14px 46px;color:var(--faint);font:12px/1.5 var(--mono)}
.fw-row{position:relative;display:grid;grid-template-columns:28px minmax(0,1fr);gap:10px;width:100%;padding:12px 14px;border:0;background:transparent;color:var(--ink);text-align:left;cursor:pointer;transition:background .15s}
.fw-row:hover{background:var(--panel-2)}
.fw-node{position:relative;z-index:1;width:9px;height:9px;margin:7px 0 0 9px;border:1px solid var(--line);background:var(--bg);transition:background .2s,border-color .2s,transform .2s}
.fw-row[data-latest="1"] .fw-node{border-color:var(--green);background:var(--green)}
.fw-row[aria-current="true"]{background:var(--accent-soft)}
.fw-row[aria-current="true"] .fw-node{border-color:var(--accent);background:var(--accent);transform:rotate(45deg) scale(1.15)}
.fw-v{display:flex;align-items:baseline;gap:8px;color:var(--strong);font:600 26px/1 var(--display);letter-spacing:-.02em}
.fw-v small{font:800 9px/1 var(--mono);letter-spacing:.1em;padding:3px 5px;border:1px solid var(--green);color:var(--green)}
.fw-v small.old{border-color:var(--line);color:var(--faint)}
.fw-d{display:block;margin-top:6px;color:var(--muted);font:11px/1.5 var(--mono)}
.fw-row[aria-current="true"] .fw-v{color:var(--accent)}
.fw-head{position:absolute;left:0;top:0;width:3px;height:0;background:var(--accent);box-shadow:0 0 18px rgba(245,196,81,.55);transition:transform .45s cubic-bezier(.2,.8,.2,1),height .45s cubic-bezier(.2,.8,.2,1);pointer-events:none}
.fw-rail-note{margin:0;padding:12px 14px 16px;border-top:1px solid var(--line);color:var(--faint);font-size:12px;line-height:1.6;flex:0 0 auto}
.fw-main{min-width:0;padding:22px clamp(18px,3vw,40px) 40px;max-width:1080px}
.fw-headline{margin-bottom:14px}
.fw-pick{display:grid;grid-template-columns:minmax(0,1fr) auto;align-items:end;gap:18px;padding:6px 0 18px;border-bottom:1px solid var(--line)}
.fw-pick-k{display:block;color:var(--green);font:800 11px/1 var(--mono);letter-spacing:.1em}
.fw-pick[data-kind="rollback"] .fw-pick-k{color:var(--amber)}
.fw-pick-ver b{display:block;margin-top:10px;color:var(--strong);font:600 clamp(56px,7vw,96px)/.86 var(--display);letter-spacing:-.05em}
.fw-pick[data-kind="rollback"] .fw-pick-ver b{color:var(--amber)}
.fw-pick-meta{display:block;margin-top:10px;color:var(--muted);font:12px/1.5 var(--mono)}
.fw-pick-side{display:flex;flex-direction:column;align-items:flex-end;gap:8px}
.fw-board-label{color:var(--faint);font:800 10px/1 var(--mono);letter-spacing:.1em}
#firmware-board{min-height:40px;border:1px solid var(--line);background:var(--bg);color:var(--ink);padding:6px 10px;font:13px var(--mono);border-radius:0}
.fw-rollback{margin-top:16px;padding:14px 16px;border:1px solid var(--amber);background:var(--amber-soft)}
.fw-rollback b{color:var(--amber)}
.fw-rollback p{margin:6px 0 12px;color:var(--ink);font-size:13px;line-height:1.6}
.fw-rollback .check-line{background:transparent;border-color:color-mix(in srgb,var(--amber) 50%,transparent)}
.fw-notes{margin:8px 0 0;max-height:260px;overflow:auto;padding:12px 14px;border:1px solid var(--line);background:var(--bg);color:var(--ink);font:12px/1.7 var(--mono);white-space:pre-wrap;word-break:break-word}
.flash-anim{margin:22px 0 0;border:1px solid var(--line);background:linear-gradient(var(--line-soft) 1px,transparent 1px) 0 0/100% 30px,var(--bg)}
.flash-anim svg{display:block;width:100%;height:auto;max-height:190px}
.fa-laptop rect,.fa-laptop path,.fa-board rect{fill:none;stroke:var(--line);stroke-width:1.5}
.fa-laptop .fa-screen{fill:var(--panel)}
.fa-laptop text,.fa-board text{fill:var(--muted);font:11px var(--mono)}
.fa-board .fa-chip{fill:var(--panel-2);stroke:var(--ink)}
.fa-cap{fill:var(--faint);font:9px var(--mono);letter-spacing:.1em}
.fa-cable{fill:none;stroke:var(--line);stroke-width:3}
.fa-flow{fill:none;stroke:var(--accent);stroke-width:3;stroke-dasharray:4 22;animation:faFlow 1.1s linear infinite}
.fa-laptop .fa-bar-bg{fill:var(--line-soft);stroke:none}
.fa-laptop .fa-bar{fill:var(--accent);stroke:none;transform-box:fill-box;transform-origin:left center;animation:faBar 4.8s cubic-bezier(.5,0,.3,1) infinite}
.fa-led{fill:var(--faint);animation:faLed 4.8s steps(1) infinite}
@keyframes faFlow{to{stroke-dashoffset:-26}}
@keyframes faBar{0%{transform:scaleX(0)}75%,100%{transform:scaleX(1)}}
@keyframes faLed{0%,74%{fill:var(--amber)}75%,100%{fill:var(--green)}}
.flash-anim figcaption{display:grid;grid-template-columns:repeat(3,1fr);border-top:1px solid var(--line)}
.fa-step{padding:10px 14px;border-right:1px solid var(--line);color:var(--faint);font:12px/1.4 var(--sans);animation:faStep 4.8s steps(1) infinite}
.fa-step:nth-child(1){animation-delay:-4.8s}
.fa-step:nth-child(2){animation-delay:-3.2s}
.fa-step:nth-child(3){animation-delay:-1.6s}
.fa-step:last-child{border-right:0}
.fa-step b{margin-right:8px;font:800 11px var(--mono)}
@keyframes faStep{0%{color:var(--strong);background:var(--accent-soft)}33.33%,100%{color:var(--faint);background:transparent}}
.fw-step-shot p{margin-top:8px!important;padding-top:0!important}
.fw-shot{padding:0;border:1px solid var(--line);background:var(--bg);cursor:zoom-in;display:block;text-align:left;margin-top:12px}
.fw-shot img{display:block;width:100%;height:92px;object-fit:cover;object-position:top;filter:saturate(.85)}
.fw-shot span{display:block;padding:6px 8px;border-top:1px solid var(--line);color:var(--faint);font:10px/1 var(--mono);letter-spacing:.06em}
.fw-shot:hover{border-color:var(--accent)}
@media(prefers-reduced-motion:reduce){.fa-flow,.fa-bar,.fa-led,.fa-step{animation:none!important}.fw-head{transition:none}}
@media(max-width:900px){.fw-ide{grid-template-columns:1fr}.fw-rail{border-right:0;border-bottom:1px solid var(--line)}.fw-timeline{display:flex;overflow-x:auto;padding:0}.fw-timeline::before,.fw-head,.fw-rail-note{display:none}.fw-row{min-width:150px;border-right:1px solid var(--line-soft)}.fw-pick{grid-template-columns:1fr}.fw-pick-side{align-items:flex-start}.flash-guide{grid-template-columns:1fr}}
.hint{font-size:13px;color:var(--muted);line-height:1.65;margin-top:10px}
.hint b{color:var(--strong)}
.spec{display:grid;gap:0;margin:0}
.row{display:flex;justify-content:space-between;gap:14px;padding:10px 0;border-bottom:1px solid var(--line-soft);font-size:14px}
.row:last-child{border-bottom:0}
.row span:first-child{color:var(--muted);min-width:90px}
.row span:last-child{text-align:right;word-break:break-word;color:var(--ink);font-weight:700}
.flash-sha{font-family:var(--mono);font-size:12px!important;color:var(--muted)!important;font-weight:500!important}
esp-web-install-button{--esp-tools-button-color:var(--accent-fill);--esp-tools-button-text-color:var(--on-accent);--esp-tools-button-border-radius:0;display:inline-block}
#flash-activate{min-width:190px}
.two-col{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-top:16px}

/* ===== 信号宣言监控台 ===== */
#mode-connect{min-height:calc(100vh - 64px)}
#mode-connect>.card:first-child{border:0;padding:0;background:transparent}
.monitor-grid{display:grid;grid-template-columns:220px minmax(0,1fr) 272px;min-height:calc(100vh - 64px)}
.monitor-rail,.evidence{padding:30px 18px;border-right:1px solid var(--line)}
.evidence{border-right:0;border-left:1px solid var(--line)}
.eyebrow{color:var(--accent);font:800 12px/1.4 var(--mono);letter-spacing:.08em;text-transform:uppercase}
.monitor-rail h2,.evidence h2{margin:9px 0 0;color:var(--strong);font-size:24px;line-height:1.22;font-weight:900;letter-spacing:-.03em}
.device-id{margin-top:7px;color:var(--muted);font:12px/1.6 var(--mono);overflow-wrap:anywhere}
.link-state{margin:25px 0 18px;padding:17px 0;border-top:1px solid var(--line);border-bottom:1px solid var(--line)}
.link-state strong{display:block;color:var(--green);font-size:14px}
.link-state strong::before{content:"";display:inline-block;width:7px;height:7px;border-radius:50%;margin-right:8px;background:currentColor}
.link-state.is-idle strong{color:var(--muted)}
.link-state span{display:block;margin-top:5px;color:var(--muted);font:12px/1.5 var(--mono)}
.monitor-rail .actions{display:grid;gap:8px}
.monitor-rail .actions .btn{width:100%}
.monitor-note{margin:18px 0 0;color:var(--muted);font-size:13px;line-height:1.65}
.signal-stage{min-width:0;padding:24px 26px 30px}
.signal-head{display:flex;justify-content:space-between;gap:16px;padding:7px 0 15px;border-top:1px solid var(--line);font:12px/1.4 var(--mono);color:var(--muted)}
.hero-readout{display:grid;grid-template-columns:minmax(230px,.95fr) minmax(220px,.8fr);align-items:end;gap:22px;padding:12px 0 20px;border-bottom:1px solid var(--line)}
.hero-value{color:var(--strong);font:600 clamp(92px,10vw,176px)/.77 var(--display);letter-spacing:-.075em;white-space:nowrap}
.hero-value small{font:900 clamp(28px,3vw,46px)/1 var(--sans);letter-spacing:-.04em;color:var(--accent)}
.hero-copy{padding-bottom:4px}
.hero-copy strong{display:block;color:var(--strong);font-size:18px;line-height:1.35}
.hero-copy p{margin:8px 0 0;color:var(--muted);font-size:14px;line-height:1.65}
.trace-panel{margin-top:20px;border:1px solid var(--line);background:var(--panel)}
.trace-head{min-height:58px;padding:10px 14px;display:flex;align-items:center;justify-content:space-between;gap:12px;border-bottom:1px solid var(--line);flex-wrap:wrap}
.legend{display:flex;align-items:center;gap:6px;flex-wrap:wrap;color:var(--ink);font:12px/1 var(--mono)}
.legend-btn,.trace-range-btn,.trace-tool-btn{min-height:44px;border:1px solid transparent;background:transparent;color:var(--ink);padding:7px 9px;cursor:pointer;font:700 12px/1 var(--mono);white-space:nowrap}
.legend-btn{display:inline-flex;align-items:center;gap:8px}.legend-btn i{width:20px;height:3px;display:inline-block}.legend-btn[aria-pressed="false"]{color:var(--faint);text-decoration:line-through}.legend-btn[aria-pressed="false"] i{opacity:.3}
.trace-actions{display:flex;align-items:center;justify-content:flex-end;gap:6px;flex-wrap:wrap}
.trace-ranges{display:flex;border:1px solid var(--line)}
.trace-range-btn{min-width:54px;border-right:1px solid var(--line);color:var(--muted)}.trace-range-btn:last-child{border-right:0}.trace-range-btn.active{background:var(--ink);color:var(--bg)}
.trace-tool-btn{border-color:var(--line);color:var(--muted)}.trace-tool-btn:hover,.legend-btn:hover,.trace-range-btn:hover{color:var(--strong);background:var(--panel-2)}.trace-tool-btn.active{border-color:var(--accent);color:var(--accent);background:var(--accent-soft)}
.trace-meta{min-height:39px;padding:8px 14px;display:flex;align-items:center;justify-content:space-between;gap:12px;border-bottom:1px solid var(--line-soft);color:var(--muted);font:12px/1.4 var(--mono)}
.trace-meta strong{color:var(--accent);font-weight:800}.trace-meta span:last-child{text-align:right}
.trace-window{position:relative;height:300px;overflow:hidden;touch-action:none;background-image:linear-gradient(var(--line-soft) 1px,transparent 1px);background-size:100% 25%}
.trace-window:focus-visible{outline:2px solid var(--accent);outline-offset:-2px}
.trace-window svg{display:block;width:100%;height:100%;overflow:hidden}
.trace-window path{fill:none;vector-effect:non-scaling-stroke;stroke-linecap:round;stroke-linejoin:round}
.trace-axis line{stroke:var(--line-soft);stroke-width:1;vector-effect:non-scaling-stroke}.trace-axis text{fill:var(--faint);font:11px var(--mono)}
.trace-crosshair{stroke:var(--strong);stroke-width:1;stroke-dasharray:4 4;vector-effect:non-scaling-stroke;opacity:.8}
.trace-marker{stroke:var(--panel);stroke-width:2;vector-effect:non-scaling-stroke}
.trace-tooltip{position:absolute;z-index:3;top:12px;width:214px;padding:10px 12px;border:1px solid var(--line);background:rgba(var(--bg-rgb),.94);box-shadow:0 10px 30px rgba(0,0,0,calc(.35*var(--shadow-k)));pointer-events:none;font:12px/1.55 var(--mono)}
.trace-tooltip strong{display:block;margin-bottom:5px;color:var(--strong);font-weight:800}.trace-tooltip-row{display:flex;align-items:center;justify-content:space-between;gap:10px}.trace-tooltip-row span:first-child{color:var(--muted)}.trace-tooltip-row b{color:var(--strong)}
.trace-empty{position:absolute;inset:0;display:grid;place-items:center;color:var(--faint);font:12px/1.5 var(--mono);text-align:center;padding:18px;pointer-events:none}
.trace-stats{display:grid;grid-template-columns:repeat(4,1fr);border-top:1px solid var(--line)}
.trace-stat{min-width:0;padding:11px 14px;border-right:1px solid var(--line-soft)}.trace-stat:last-child{border-right:0}.trace-stat span{display:block;color:var(--muted);font:11px/1.4 var(--mono)}.trace-stat b{display:block;margin-top:3px;color:var(--strong);font:700 14px/1.4 var(--mono);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.trace-stat em{color:var(--accent);font-size:11px;font-style:normal}
.sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}
.signal-foot{display:grid;grid-template-columns:repeat(4,1fr);border-top:1px solid var(--line)}
.mini-metric{min-width:0;padding:15px;border-right:1px solid var(--line)}
.mini-metric:last-child{border-right:0}
.mini-metric span{display:block;color:var(--muted);font:12px/1.4 var(--mono);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mini-metric b{display:block;margin-top:4px;color:var(--strong);font:700 28px/1.1 var(--mono);letter-spacing:-.04em}
.mini-metric em{color:var(--accent);font-size:12px;font-style:normal;letter-spacing:0}
.evidence h2{font-size:28px}
.health-score{display:grid;grid-template-columns:70px 1fr;align-items:center;gap:10px;margin-top:18px;padding:16px 0;border-top:1px solid var(--line);border-bottom:1px solid var(--line)}
.health-score>b{color:var(--strong);font:600 58px/.9 var(--display)}
.health-score p{margin:0;color:var(--muted);font-size:12px;line-height:1.45}.health-score strong{color:var(--green);font-size:13px}
.evidence-list{margin-top:8px}
.proof-row{min-height:54px;display:grid;grid-template-columns:8px 1fr auto;align-items:center;gap:9px;border-bottom:1px solid var(--line-soft)}
.proof-row>i{width:7px;height:7px;border-radius:50%;background:var(--green)}
.proof-row.off>i{background:var(--faint)}.proof-row.warn>i{background:var(--accent)}
.proof-row b{color:var(--strong);font:800 12px/1.2 var(--mono)}
.proof-row small{color:var(--muted);font:12px/1.35 var(--mono)}
.evidence>.actions{margin-top:16px;display:grid;grid-template-columns:1fr 1fr}
.evidence>.actions .btn{padding-left:8px;padding-right:8px}
.protocol,.device-details{margin-top:16px;border-top:1px solid var(--line)}
.protocol summary,.device-details summary{min-height:46px;display:flex;align-items:center;cursor:pointer;color:var(--muted);font-size:13px;font-weight:800}
.protocol[open] summary,.device-details[open] summary{color:var(--accent)}
.device-lower{grid-column:1/-1;border-top:1px solid var(--line);padding:22px;display:grid;grid-template-columns:minmax(260px,.7fr) minmax(0,1.3fr);gap:28px;background:var(--panel)}
.device-lower h3{margin:0 0 10px;color:var(--strong);font-size:16px}
.device-card{border:1px solid var(--line);padding:16px;background:var(--panel-2)}
.dc-head{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:12px}
.dc-name{font-weight:900;font-size:16px;color:var(--strong)}
.dc-meta{font:12px/1.5 var(--mono);color:var(--muted);margin-top:3px;overflow-wrap:anywhere}
.dc-body{display:grid;gap:0}.dc-foot{margin-top:12px}

/* ===== NVS 配置读取与事务保存 ===== */
.config-panel{grid-column:1/-1;border:1px solid var(--line);background:var(--panel-2);padding:20px}
.config-head{display:flex;align-items:flex-start;justify-content:space-between;gap:18px;padding-bottom:15px;border-bottom:1px solid var(--line)}
.config-head h3{margin:0!important}.config-head p{margin:5px 0 0;color:var(--muted);font-size:13px;line-height:1.6}
.config-meta{display:flex;gap:7px;flex-wrap:wrap;justify-content:flex-end}
.config-toolbar{display:flex;align-items:center;justify-content:space-between;gap:14px;margin:15px 0;flex-wrap:wrap}
.config-toolbar .actions{justify-content:flex-end}.config-status{min-height:42px;display:flex;align-items:center;flex:1;padding:9px 12px;border:1px solid var(--line);color:var(--muted);font-size:13px;line-height:1.5}
.config-status.ok{border-color:var(--green);color:var(--green);background:var(--green-soft)}.config-status.warn{border-color:var(--amber);color:var(--amber);background:var(--amber-soft)}.config-status.err{border-color:var(--red);color:var(--red);background:var(--red-soft)}
.config-error-summary{margin:12px 0;padding:13px 15px;border:1px solid var(--red);background:var(--red-soft);color:var(--red)}

.config-groups{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.config-group{border:1px solid var(--line);background:var(--panel)}.config-group[open]{grid-column:1/-1}

.form-field input[type="number"],.form-field input[type="text"],.form-field select{width:100%;min-height:44px;border:1px solid var(--line);border-radius:0;background:var(--bg);color:var(--ink);padding:9px 10px;font:14px/1.4 var(--mono)}
.form-field input[aria-invalid="true"],.form-field select[aria-invalid="true"]{border-color:var(--red);background:var(--red-soft)}
.field-hint{display:block;margin-top:5px;color:var(--faint);font-size:12px;line-height:1.45}.field-error{display:block;min-height:17px;margin-top:4px;color:var(--red);font-size:12px;line-height:1.4}
.bridge-config .field-hint{color:var(--muted)}
.check-line{min-height:44px;display:flex;align-items:center;gap:9px;border:1px solid var(--line);padding:9px 11px;background:var(--bg);color:var(--ink);cursor:pointer}.check-line input{width:18px;height:18px;accent-color:var(--accent)}
.check-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.config-save-note{margin-top:13px;padding:11px 13px;border-left:3px solid var(--accent);background:var(--accent-soft);color:var(--muted);font-size:13px;line-height:1.6}
.config-unavailable{grid-column:1/-1;padding:18px;border:1px solid var(--line);background:var(--panel)}

/* ===== GATT、模板、比对、日志 ===== */
.svc-list{display:flex;flex-direction:column;gap:7px;margin-top:4px}
.svc-item{border:1px solid var(--line);padding:12px;background:var(--panel-2)}
.svc-head{display:flex;align-items:flex-start;justify-content:space-between;gap:12px}
.svc-name{font-weight:800;font-size:12px;color:var(--strong);font-family:var(--mono)}
.svc-uuid{font:12px/1.45 var(--mono);color:var(--faint);overflow-wrap:anywhere;text-align:right}
.chars{margin-top:9px;padding-top:9px;border-top:1px dashed var(--line);display:flex;flex-direction:column;gap:7px}
.char{font-size:12px;color:var(--muted);display:flex;justify-content:space-between;gap:12px}.char b{color:var(--ink)}

.compare-table th{font-weight:800;color:var(--accent);font:12px/1.4 var(--mono);background:var(--panel-2)}
.compare-table td.field-name{font-weight:700;color:var(--ink);background:var(--panel-2);width:120px;white-space:nowrap}
.compare-table td.diff{background:var(--amber-soft)}.compare-table td.same{background:var(--green-soft)}
.compare-table .cell-val{font:12px/1.5 var(--mono);word-break:break-word;color:var(--ink)}
.compare-table .cell-missing{color:var(--faint);font-style:italic}
.templates{display:flex;flex-direction:column;gap:8px;margin-top:12px}
.tpl-item{border:1px solid var(--line);padding:12px;background:var(--panel-2);display:flex;align-items:center;justify-content:space-between;gap:12px}
.tpl-info{display:flex;flex-direction:column;gap:3px}.tpl-name{font-weight:800;color:var(--strong)}.tpl-sub{font:12px/1.45 var(--mono);color:var(--muted)}.tpl-ops{display:flex;gap:6px}
.empty-state{text-align:center;padding:48px 20px;color:var(--muted)}
.empty-state .big{font:600 72px/1 var(--display);color:var(--faint);margin-bottom:10px}.empty-state p{margin:5px 0;font-size:14px}
.log{height:220px;overflow:auto;background:var(--bg);color:var(--ink);padding:13px 15px;font:12px/1.75 var(--mono);border:1px solid var(--line)}
.log div{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.info{color:var(--ink)}.data-log{color:var(--green)}.warn-log{color:var(--amber)}.err-log{color:var(--red)}

  .trace-head{align-items:flex-start}.trace-actions{width:100%;justify-content:flex-start}.trace-ranges{max-width:100%;overflow-x:auto}.trace-window{height:260px}.trace-meta{align-items:flex-start;flex-direction:column;gap:2px}.trace-meta span:last-child{text-align:left}.evidence{grid-column:auto;grid-template-columns:1fr;padding:22px 16px}.evidence>.eyebrow,.evidence>h2{grid-column:auto}.health-score{margin-top:16px}

  #mode-flash,#mode-compare{margin-top:18px;padding:0 14px 28px}.card{padding:16px}.card-head{align-items:flex-start;flex-direction:column}.card-head .actions{justify-content:flex-start}
  .flash-lead{grid-template-columns:1fr}.flash-time{border-left:0;border-top:1px solid var(--line);padding:12px 0 0}.flash-guide{grid-template-columns:1fr}.flash-step.guide-step{min-height:0}.step-number{margin-bottom:12px}.flash-step.guide-step p{margin-top:7px;padding-top:0}.flash-expect{grid-template-columns:1fr}.flash-terms{grid-template-columns:1fr}.flash-step p,.flash-lead p,.flash-warning{font-size:16px}
