x); }\n  .device-results article { padding:12px 16px; grid-template-columns:1fr; }\n  .device-results article>button { width:100%; }\n  .bridge-device-item { grid-template-columns:minmax(0,1fr) auto; padding:7px 0; }\n  .bridge-device-state { align-self:end; grid-column:1; grid-row:2; }\n  .bridge-device-actions { grid-column:2; grid-row:1/3; }\n  .replace-bridge-confirm { grid-template-columns:1fr; padding:12px 16px; }\n  .replace-bridge-confirm .primary-btn { width:100%; }\n  .formula-line { align-items:flex-start; flex-direction:column; gap:4px; }\n}\n@media(prefers-reduced-motion:reduce) {\n  *,*::before,*::after { scroll-behavior:auto!important; transition:none!important; animation:none!important; }\n}\n\u003c/style>\n\u003c/head>\n\u003cbody>\n\u003cnoscript>请启用 JavaScript 后配置设备。\u003c/noscript>\n  \u003cheader class=\"topbar\">\n    \u003cdiv class=\"topbar-inner\">\n      \u003ca class=\"brand\" href=\"#\" aria-label=\"BikePower\">\n        \u003csvg class=\"brand-mark\" viewBox=\"0 0 64 64\" aria-hidden=\"true\">\n          \u003cpath class=\"brand-accent\" d=\"M37 4 22 28h11l-8 14 19-22H33z\"/>\n          \u003cpath class=\"brand-line\" d=\"M13 19a24 24 0 1 0 34 27M7 12a36 36 0 0 1 13-7\"/>\n          \u003ccircle class=\"brand-hub\" cx=\"22\" cy=\"35\" r=\"5\"/>\n        \u003c/svg>\n        \u003cspan>Bike\u003cstrong>Power\u003c/strong>\u003c/span>\n      \u003c/a>\n      \u003cdiv class=\"device-heading\">\n        \u003cb id=\"headerDeviceName\">BikePower-C3\u003c/b>\n        \u003cspan id=\"headerFirmware\">正在读取固件…\u003c/span>\n      \u003c/div>\n      \u003cdiv class=\"session-clock\">\n        \u003cspan>配网剩余\u003c/span>\n        \u003cb id=\"wifiTimer\" aria-label=\"配网剩余时间\">05:00\u003c/b>\n        \u003cbutton class=\"icon-btn\" id=\"renewBtn\" type=\"button\" title=\"续期配网\" aria-label=\"续期配网\">\n          \u003csvg viewBox=\"0 0 24 24\" aria-hidden=\"true\">\u003cpath d=\"M20 11a8 8 0 1 0-2.3 5.7\"/>\u003cpath d=\"M20 5v6h-6\"/>\u003c/svg>\n        \u003c/button>\n      \u003c/div>\n    \u003c/div>\n  \u003c/header>\n\n  \u003cmain class=\"page\">\n    \u003cnav class=\"sport-switch\" aria-label=\"运动类型\">\n      \u003cbutton class=\"is-active\" type=\"button\" data-sport=\"cycling\" aria-pressed=\"true\">骑行\u003c/button>\n      \u003cbutton type=\"button\" data-sport=\"running\" aria-pressed=\"false\">跑步\u003c/button>\n    \u003c/nav>\n\n    \u003cdiv class=\"workspace\">\n      \u003csection class=\"live-pane\" aria-labelledby=\"liveTitle\">\n        \u003cdiv class=\"section-kicker\">\n          \u003cspan>当前输出\u003c/span>\n          \u003cspan class=\"status-chip status-chip--ok\" id=\"liveStatus\">\u003ci>\u003c/i>模拟运行\u003c/span>\n        \u003c/div>\n        \u003cdiv class=\"live-title-row\">\n          \u003cdiv>\n            \u003ch1 id=\"liveTitle\">模拟骑行输出\u003c/h1>\n            \u003cp id=\"liveSubtitle\">正在读取设备…\u003c/p>\n          \u003c/div>\n          \u003cspan class=\"applied-tag\">已应用\u003c/span>\n        \u003c/div>\n\n        \u003cdiv class=\"signal-chain\" aria-label=\"信号链路\">\n          \u003cdiv class=\"chain-node\">\n            \u003cspan>上游\u003c/span>\n            \u003cb id=\"chainSource\">模拟引擎\u003c/b>\n            \u003csmall id=\"chainSourceState\">已连接\u003c/small>\n          \u003c/div>\n          \u003cdiv class=\"chain-path chain-path--in\">\u003ci>\u003c/i>\u003cspan id=\"chainTransform\">平滑\u003c/span>\u003c/div>\n          \u003cdiv class=\"chain-node chain-node--core\">\n            \u003cspan>BikePower\u003c/span>\n            \u003cb>校正与保护\u003c/b>\n            \u003csmall>广播中\u003c/small>\n          \u003c/div>\n          \u003cdiv class=\"chain-path chain-path--out\">\u003ci>\u003c/i>\u003cspan>BLE\u003c/span>\u003c/div>\n          \u003cdiv class=\"chain-node\">\n            \u003cspan>下游\u003c/span>\n            \u003cb>骑行 App\u003c/b>\n            \u003csmall>已订阅\u003c/small>\n          \u003c/div>\n        \u003c/div>\n\n        \u003cdiv class=\"hero-metric\">\n          \u003cspan id=\"heroMetricLabel\">模拟功率\u003c/span>\n          \u003cdiv>\u003cstrong id=\"heroMetricValue\">—\u003c/strong>\u003cb id=\"heroMetricUnit\">W\u003c/b>\u003c/div>\n          \u003cp id=\"heroMetricMeta\">目标 220 W\u003c/p>\n        \u003c/div>\n\n        \u003cdiv class=\"metric-grid\">\n          \u003carticle>\n            \u003cspan id=\"metricTwoLabel\">模拟踏频\u003c/span>\n            \u003cdiv>\u003cstrong id=\"metricTwoValue\">88\u003c/strong>\u003cb id=\"metricTwoUnit\">rpm\u003c/b>\u003c/div>\n            \u003csmall id=\"metricTwoMeta\">本机平滑生成\u003c/small>\n          \u003c/article>\n          \u003carticle>\n            \u003cspan>模拟心率\u003c/span>\n            \u003cdiv>\u003cstrong id=\"heartLiveValue\">148\u003c/strong>\u003cb>bpm\u003c/b>\u003c/div>\n            \u003csmall id=\"heartLiveMeta\">随原始功率联动\u003c/small>\n          \u003c/article>\n        \u003c/div>\n\n        \u003cdiv class=\"runtime-alert\" id=\"runtimeAlert\">\n          \u003ci>\u003c/i>\n          \u003cdiv>\n            \u003cb id=\"runtimeAlertTitle\">模拟输出正在运行\u003c/b>\n            \u003cp id=\"runtimeAlertText\">功率与踏频由设备本机平滑生成。\u003c/p>\n          \u003c/div>\n        \u003c/div>\n\n        \u003cdetails class=\"diagnostics\">\n          \u003csummary>运行详情 \u003cspan>展开\u003c/span>\u003c/summary>\n          \u003cdl>\n            \u003cdiv>\u003cdt>配置版本\u003c/dt>\u003cdd id=\"schemaVersion\">—\u003c/dd>\u003c/div>\n            \u003cdiv>\u003cdt>空闲堆\u003c/dt>\u003cdd id=\"heapValue\">正在读取…\u003c/dd>\u003c/div>\n            \u003cdiv>\u003cdt>样本距今\u003c/dt>\u003cdd id=\"packetCount\">—\u003c/dd>\u003c/div>\n            \u003cdiv>\u003cdt id=\"eventStateLabel\">曲柄事件\u003c/dt>\u003cdd id=\"crankState\">有效\u003c/dd>\u003c/div>\n            \u003cdiv>\u003cdt>App 订阅\u003c/dt>\u003cdd id=\"appServices\">CPS / CSC / FTMS\u003c/dd>\u003c/div>\n            \u003cdiv>\u003cdt id=\"upstreamStateLabel\">上游状态\u003c/dt>\u003cdd id=\"reconnectState\">无\u003c/dd>\u003c/div>\n          \u003c/dl>\n        \u003c/details>\n      \u003c/section>\n\n      \u003csection class=\"editor-pane\" aria-labelledby=\"editorTitle\">\n        \u003cdiv class=\"editor-head\">\n          \u003cdiv>\n            \u003cspan>现场配置\u003c/span>\n            \u003ch2 id=\"editorTitle\">骑行输出\u003c/h2>\n          \u003c/div>\n          \u003cspan class=\"draft-chip\" id=\"draftChip\" hidden>有未保存修改\u003c/span>\n        \u003c/div>\n        \u003cdiv class=\"runtime-alert is-warn mode-switch-notice\" id=\"modeSwitchNotice\" role=\"status\" hidden>\n          \u003ci>\u003c/i>\n          \u003cdiv>\n            \u003cb id=\"modeSwitchTitle\">跑步模式尚未应用\u003c/b>\n            \u003cp id=\"modeSwitchText\">保存后设备将重建跑步广播，当前 BLE 连接可能短暂断开。\u003c/p>\n          \u003c/div>\n        \u003c/div>\n\n        \u003cdiv id=\"cyclingEditor\">\n          \u003csection class=\"editor-section\">\n            \u003cdiv class=\"section-title\">\n              \u003cdiv>\u003cspan>01\u003c/span>\u003ch3>输出来源\u003c/h3>\u003c/div>\n              \u003cp id=\"sourceSummary\">本机平滑模拟\u003c/p>\n            \u003c/div>\n            \u003cdiv class=\"segmented source-segment\" role=\"group\" aria-label=\"骑行输出来源\">\n              \u003cbutton class=\"is-active\" type=\"button\" data-source=\"simulation\">\n                \u003cb>模拟输出\u003c/b>\u003csmall>固定 / 机器人\u003c/small>\n              \u003c/button>\n              \u003cbutton type=\"button\" data-source=\"bridge\">\n                \u003cb>真实功率计\u003c/b>\u003csmall>功率 + 同源踏频\u003c/small>\n              \u003c/button>\n            \u003c/div>\n          \u003c/section>\n\n          \u003csection class=\"editor-section bridge-entry\" id=\"bridgeIntro\" hidden>\n            \u003cdiv class=\"bridge-entry-copy\">\n              \u003cspan class=\"bridge-entry-index\">02\u003c/span>\n              \u003cdiv>\n                \u003cspan>真实功率来源\u003c/span>\n                \u003ch3>添加第一台功率计\u003c/h3>\n                \u003cp>最多保存三台；测试通过前，当前模拟输出保持不变。\u003c/p>\n              \u003c/div>\n            \u003c/div>\n            \u003cbutton class=\"primary-btn\" id=\"bridgeStartScanBtn\" type=\"button\">选择功率计\u003c/button>\n          \u003c/section>\n\n          \u003cdiv id=\"bridgeEditor\" hidden>\n            \u003csection class=\"editor-section\">\n              \u003cdiv class=\"section-title\">\n                \u003cdiv>\u003cspan>02\u003c/span>\u003ch3>功率计主备\u003c/h3>\u003c/div>\n                \u003cbutton class=\"text-btn\" id=\"scanBtn\" type=\"button\">添加功率计\u003c/button>\n              \u003c/div>\n              \u003cdiv class=\"bridge-source-status\" aria-live=\"polite\">\n                \u003cdiv>\n                  \u003cspan>配置来源\u003c/span>\n                  \u003cb id=\"configuredSource\">模拟输出\u003c/b>\n                \u003c/div>\n                \u003cdiv>\n                  \u003cspan>实际来源\u003c/span>\n                  \u003cb id=\"actualSource\">模拟引擎\u003c/b>\n                \u003c/div>\n                \u003cdiv>\n                  \u003cspan>下次尝试\u003c/span>\n                  \u003cb id=\"nextBridgeAttempt\">—\u003c/b>\n                \u003c/div>\n                \u003cbutton class=\"secondary-btn\" id=\"retryBridgeBtn\" type=\"button\">立即重试\u003c/button>\n              \u003c/div>\n              \u003cdiv class=\"bridge-device-list\" id=\"bridgeDeviceList\">\u003c/div>\n              \u003ctemplate id=\"bridgeDeviceTemplate\">\n                \u003cdiv class=\"bridge-device-item\" data-device>\n                  \u003cdiv class=\"bridge-device-name\">\u003cb>\u003c/b>\u003cspan>\u003c/span>\u003c/div>\n                  \u003cspan class=\"bridge-device-state\">\u003c/span>\n                  \u003cdiv class=\"bridge-device-actions\">\n                    \u003cbutton class=\"icon-btn\" type=\"button\" data-action=\"prefer\" title=\"设为首选\" aria-label=\"设为首选\">↑\u003c/button>\n                    \u003cbutton class=\"icon-btn\" type=\"button\" data-action=\"delete\" title=\"删除功率计\" aria-label=\"删除功率计\">×\u003c/button>\n                  \u003c/div>\n                \u003c/div>\n              \u003c/template>\n              \u003cp class=\"bridge-fallback\" id=\"fallbackSimulationSummary\" hidden>\u003c/p>\n              \u003cdiv id=\"selectedDeviceDetail\">\n                \u003cdiv class=\"device-row\">\n                  \u003cdiv class=\"device-monogram\">PM\u003c/div>\n                  \u003cdiv>\n                    \u003cb id=\"selectedDeviceName\">未选择功率计\u003c/b>\n                    \u003cspan id=\"selectedDeviceMeta\">扫描并测试后可查看设备信息\u003c/span>\n                  \u003c/div>\n                  \u003cspan class=\"inline-state\" id=\"meterConnection\">待测试\u003c/span>\n                \u003c/div>\n                \u003cdiv class=\"capability-row\" id=\"deviceCapabilities\">\n                  \u003cspan>功率\u003c/span>\u003cspan>真实踏频\u003c/span>\n                \u003c/div>\n                \u003cdiv class=\"identity-heading\">\u003cb>功率计设备信息\u003c/b>\u003cspan>DIS 设备信息\u003c/span>\u003c/div>\n                \u003cdl class=\"identity-grid\" id=\"meterInfo\">\u003c/dl>\n                \u003clabel class=\"copy-check\">\u003cinput id=\"copyIdentity\" type=\"checkbox\">\u003cspan>\u003cb>复制设备信息到开发板\u003c/b>\u003csmall>仅可复制本次新增功率计；自动接管备选不会改写开发板身份。\u003c/small>\u003c/span>\u003c/label>\n                \u003cdiv id=\"identityOptions\" hidden>\n                  \u003clabel class=\"wide-field\">开发板广播名称\n                    \u003cselect id=\"identityNameSource\">\n                      \u003coption value=\"meter\">使用功率计名称\u003c/option>\n                      \u003coption value=\"board\">保留开发板名称\u003c/option>\n                      \u003coption value=\"custom\">自定义名称\u003c/option>\n                    \u003c/select>\n                  \u003c/label>\n                  \u003clabel class=\"wide-field\" id=\"customNameField\" hidden>自定义名称\u003cinput id=\"customIdentityName\" type=\"text\" maxlength=\"23\" placeholder=\"输入开发板广播名称\">\u003c/label>\n                  \u003cdiv class=\"identity-heading\">\u003cb>保存后的开发板信息\u003c/b>\u003cspan>预览\u003c/span>\u003c/div>\n                  \u003cdl class=\"identity-grid\" id=\"identityPreview\">\u003c/dl>\n                  \u003cp class=\"identity-note\">仅复制名称与设备信息，不复制蓝牙地址。骑行 App 中可能出现同名设备。\u003c/p>\n                \u003c/div>\n              \u003c/div>\n              \u003cbutton class=\"quiet-danger\" id=\"stopBridgeBtn\" type=\"button\">停止桥接\u003c/button>\n            \u003c/section>\n\n            \u003csection class=\"editor-section\">\n              \u003cdiv class=\"section-title\">\n                \u003cdiv>\u003cspan>03\u003c/span>\u003ch3>功率校正\u003c/h3>\u003c/div>\n                \u003cp>实际 \u003cb id=\"actualCalibration\">+12 W\u003c/b>\u003c/p>\n              \u003c/div>\n              \u003cp class=\"shared-calibration-hint\" id=\"sharedCalibrationHint\">这组校正适用于全部已保存功率计\u003c/p>\n              \u003cdiv class=\"segmented\" role=\"group\" aria-label=\"校正模式\">\n                \u003cbutton type=\"button\" data-calibration=\"raw\">原值\u003c/button>\n                \u003cbutton class=\"is-active\" type=\"button\" data-calibration=\"watts\">按瓦数\u003c/button>\n                \u003cbutton type=\"button\" data-calibration=\"percent\">按百分比\u003c/button>\n              \u003c/div>\n              \u003cdiv class=\"adjustment\" id=\"calibrationAdjustment\">\n                \u003clabel for=\"calibrationValue\" id=\"calibrationLabel\">调整瓦数\u003c/label>\n                \u003cdiv class=\"stepper\">\n                  \u003cbutton type=\"button\" id=\"calibrationMinus\" aria-label=\"减少校正值\">−\u003c/button>\n                  \u003cdiv>\n                    \u003cinput id=\"calibrationValue\" type=\"number\" value=\"12\" inputmode=\"decimal\">\n                    \u003cspan id=\"calibrationUnit\">W\u003c/span>\n                  \u003c/div>\n                  \u003cbutton type=\"button\" id=\"calibrationPlus\" aria-label=\"增加校正值\">+\u003c/button>\n                \u003c/div>\n                \u003cinput id=\"calibrationRange\" type=\"range\" min=\"-200\" max=\"200\" value=\"12\" aria-label=\"功率校正值\">\n              \u003c/div>\n              \u003cdiv class=\"formula-line\">\n                \u003cspan id=\"calibrationFormula\">输入 + 12 W，0 W 保持为 0 W\u003c/span>\n                \u003cb id=\"calibrationPreview\">238 W → 250 W\u003c/b>\n              \u003c/div>\n            \u003c/section>\n          \u003c/div>\n\n          \u003cdiv id=\"simulationEditor\">\n            \u003csection class=\"editor-section\">\n              \u003cdiv class=\"section-title\">\n                \u003cdiv>\u003cspan>02\u003c/span>\u003ch3>模拟目标\u003c/h3>\u003c/div>\n                \u003cp>当前 \u003cb id=\"simulationModeSummary\">固定功率\u003c/b>\u003c/p>\n              \u003c/div>\n              \u003cdiv class=\"segmented two-options\" role=\"group\" aria-label=\"模拟模式\">\n                \u003cbutton class=\"is-active\" type=\"button\" data-sim-mode=\"fixed\">固定功率\u003c/button>\n                \u003cbutton type=\"button\" data-sim-mode=\"pacer\">配速机器人\u003c/button>\n              \u003c/div>\n              \u003cdiv class=\"field-pair\">\n                \u003clabel id=\"fixedPowerField\">目标功率\u003cinput id=\"simPower\" type=\"number\" min=\"0\" max=\"2000\" value=\"220\" inputmode=\"numeric\">\u003cspan>W\u003c/span>\u003c/label>\n                \u003clabel id=\"robotWeightField\" hidden>体重\u003cinput id=\"profileWeight\" type=\"number\" min=\"30\" max=\"200\" value=\"70\" inputmode=\"decimal\">\u003cspan>kg\u003c/span>\u003c/label>\n                \u003clabel>模拟踏频\u003cinput id=\"simCadence\" type=\"number\" value=\"88\" inputmode=\"numeric\">\u003cspan>rpm\u003c/span>\u003c/label>\n              \u003c/div>\n              \u003cdiv class=\"field-pair\">\n                \u003clabel>功率浮动\u003cinput id=\"powerFloat\" type=\"number\" min=\"0\" max=\"100\">\u003cspan>±W\u003c/span>\u003c/label>\n                \u003clabel>踏频浮动\u003cinput id=\"c     q("[data-practice-reset]").addEventListener("click", () => exerciseEvent("reset"));

    const stories = {

    q("[data-config-reset]").addEventListener("click", () => { stopStory(); positions.save = -1; config = configuration(null, "tick"); paintConfig(); });
    host.querySelectorAll("[data-bridge-input],[data-bridge-mode],[data-bridge-amount]").forEach(input => input.addEventListener("input", () => {

    q("[data-bridge-reset]").addEventListener("click", () => { stopStory(); q("[data-bridge-input]").value = 200; paintBridge(); });
    q("[data-handoff-release]").addEventListener("click", () => { stopStory(); link = handoff(link, "release"); paintHandoff(); });
    q("[data-handoff-app]").addEventListener("click", () => { stopStory(); link = handoff(link, "app"); paintHandoff(); });
    q("[data-handoff-reset]").addEventListener("click", () => { stopStory(); positions.handoff = -1; link = handoff(null, "tick"); paintHandoff(); });

  function init() {

  }
  function initManualLayout() {
    const content = document.querySelector("#manual-content");
    if (!content) return;
    const chapters = ['install', 'connect', 'button', 'hotspot', 'cycling', 'running',
      'profile', 'device', 'step', 'lights', 'upstream', 'about', 'exit', 'troubleshoot', 'overview', 'compare'];
    content.querySelectorAll(".ch").forEach((old, index) => {
      const name = chapters[index], node = document.createElement("details");
      node.className = "ch manual-chapter";
      node.id = old.id;
      node.innerHTML = `<summary><h2>${name === "button" ? "按钮日常操作" : guides[name].title}</h2></summary>` +
        (name === "button" ? `<div class="operation-demos">${buttonMarkup()}</div><p class="operation-caution"><b>注意</b>配网时先松开，再确认。</p>` :
          `<div data-operation-guide="${name}"></div>`);
      old.replaceWith(node);
    });
    const hero = content.querySelector(".manual-hero");
    const operations = content.querySelector("#operations");
    const tools = document.createElement("details");
    tools.className = "manual-tools";
    tools.innerHTML = "<summary>准备动手？打开电脑工具</summary>";
    ["#manual-linkbar", "#onboarding-entry", "#tool-launchpad"].forEach(selector => {
      const node = content.querySelector(selector);

    operations.after(tools);
    const title = document.createElement("div");
    title.className = "manual-more";
    title.innerHTML = "<h2>其他步骤，展开看演示</h2>";
    tools.after(title);
    content.querySelectorAll('a[href^="#ch"]').forEach(link => link.addEventListener("click", () => {
      const target = document.getElementById(link.hash.slice(1));
      if (target && target.tagName === "DETAILS") target.open = true;

  }
  function initGuide(host) {
    const name = host.dataset.operationGuide, guide = guides[name];
    if (window.BikePowerPhone?.portalGuides.has(name)) {
      window.BikePowerPhone.mountGuide(host, name);
      return;
    }
    host.innerHTML = guideMarkup(name);
    const root = host.firstElementChild;
    const q = selector => root.querySelector(selector);
    const motion = matchMedia("(prefers-reduced-motion: reduce)");
    let position = 0, running = false, request = 0, started = 0;
    function paint() {
      const frame = guide.frames[position];
      root.dataset.guideStep = String(position);
      root.dataset.result = frame[4];
      root.dataset.playing = String(running);
      root.dataset.ledOn = "true";
      q("[data-guide-stage]").innerHTML = guideScreen(name, position);
      q("[data-guide-caption]").textContent = frame[0];
      q("[data-guide-counter]").textContent = (position + 1) + " / " + guide.frames.length;
      q("[data-guide-play]").textContent = motion.matches ? "逐步演示" : running ? "暂停" : position === guide.frames.length - 1 ? "重播" : "播放演示";
      q("[data-guide-play]").setAttribute("aria-pressed", String(running));
    }
    function pause() { running = false; cancelAnimationFrame(request); root.dataset.playing = "false"; q("[data-guide-play]").setAttribute("aria-pressed", "false"); q("[data-guide-play]").textContent = motion.matches ? "逐步演示" : "播放演示"; }
    function next() { position = (position + 1) % guide.frames.length; paint(); }
    function tick(now) {
      if (!running) return;
      if (name === "lights") root.dataset.ledOn = String(position === 2 || Math.floor(now / (position === 1 ? 200 : 1000)) % 2 === 0);
      if (now - started >= 1900) {
        if (position === guide.frames.length - 1) { pause(); paint(); return; }
        next(); started = now;
      }
      request = requestAnimationFrame(tick);
    }
    q("[data-guide-play]").addEventListener("click", () => {
      if (running) { pause(); return; }
      if (motion.matches) { next(); return; }
      if (position === guide.frames.length - 1) position = 0;
      running = true; started = performance.now(); paint();
      request = requestAnimationFrame(tick);
    });
    q("[data-guide-next]").addEventListener("click", () => { pause(); next(); });
    q("[data-guide-reset]").addEventListener("click", () => { pause(); position = 0; paint(); });
    document.addEventListener("visibilitychange", () => { if (document.hidden) pause(); });
    window.addEventListener("blur", pause);
    motion.addEventListener("change", pause);
    const details = host.closest("details");
    if (details) details.addEventListener("toggle", () => { if (!details.open) pause(); });
    if ("IntersectionObserver" in window) new IntersectionObserver(entries => {
      if (!entries[0].isIntersecting) pause();
    }).observe(host);
    paint();
  }
  if (document.readyState === "loading") document.addEventListener("DOMContentLoaded", init);
  else init();
})();
/* 页面教学独立于设备会话，不写入 BLE、串口或配置。 */
(function () {
  "use strict";
  const scenes = {
    short: { title: "短按减功率", duration: 1200, steps: [0, 300, 1000] },
    adjust: { title: "按住持续调功", duration: 2000, steps: [0, 500, 900, 1300, 1700] },
    wifi: { title: "长按 + 二次确认", duration: 4300, steps: [0, 500, 2100, 2300, 3300, 4000] },
    cancel: { title: "不确认，自动取消", duration: 6000, steps: [0, 2100, 2300, 3800, 5400] }
  };
  function buttonFrame(scene, elapsed) {
    const config = scenes[scene];
    if (!config) throw new Error("未知按钮演示");
    const t = Math.max(0, Math.min(Number(elapsed) || 0, config.duration));
    const release = scene === "short" ? 300 : scene === "adjust" ? 1500 : 2300;
    const pressed = t < release || scene === "wifi" && t >= 3300 && t < 3500;
    let power = 200, state = "ble", text = "按下设备操作键，开始计时。";
    if (scene === "short") {
      if (t >= release) { power = 180; text = "轻按松开，目标减少 20 W。"; }
    } else {
      const hold = Math.min(t, release, 1999);
      if (hold >= 500) power += (Math.floor((hold - 500) / 200) + 1) * 20;
      if (t >= 500) text = "继续按住，目标逐步增加。";
      if (scene === "adjust" && t >= release) text = "不到 2 秒松开，保留调节结果。";
      if (scene !== "adjust" && t >= 2000) text = "满 2 秒了，现在松开。";
      if (scene !== "adjust" && t >= release) {
        power = 200;
        state = "confirm";
        text = "灯快闪了，3 秒内再按一次。目标恢复原值。";
      }
      if (scene === "wifi" && t >= 3300) {
        state = "wifi";
        text = "热点已开启。去手机 WiFi 连接 BikePower-XXXXXX。";
      }
      if (scene === "cancel" && t >= 5300) {
        state = "ble";
        text = "没有再次确认，自动取消；目标保持原值。";
      }
    }
    const countdown = state === "confirm" ? Math.max(0, (5300 - t) / 1000) : null;
    const phase = t < release ? "hold" : state === "confirm" ? "release" : "confirm";
    const ledOn = state === "confirm" ? Math.floor(t / 200) % 2 === 0 : Math.floor(t / 1000) % 2 === 0;
    return { power, state, pressed, text, elapsed: t, progress: t / config.duration, countdown, phase, ledOn };
  }
  function releaseLabel(info) {
    if (!info) return "本地预览 · 未发布";
    if (!info.built_at || !/^[0-9a-f]{40}$/i.test(info.commit || "") || !Number.isFinite(Date.parse(info.built_at))) return "更新信息暂不可用";
    const date = new Intl.DateTimeFormat("zh-CN", {
      timeZone: "Asia/Shanghai", year: "numeric", month: "2-digit", day: "2-digit",
      hour: "2-digit", minute: "2-digit", hourCycle: "h23"
    }).format(new Date(info.built_at));
    return "页面更新发布时间 " + date + "（北京时间 · 页面构建） · " +
      info.commit.slice(0, 7) + (info.dirty ? " · 本地未提交预览" : "");
  }
  const api = { buttonFrame, releaseLabel, scenes };
  if (typeof module !== "undefined") module.exports = api;
  if (typeof window !== "undefined") window.BikePowerExperience = api;
  if (typeof document === "undefined") return;

  function initDemo(host) {
    let scene = "wifi", elapsed = 0, running = false, started = 0, request = 0;
    const play = host.querySelector("[data-demo-play]");
    const step = host.querySelector("[data-demo-step]");
    const caption = host.querySelector("[data-demo-caption]");
    const motion = matchMedia("(prefers-reduced-motion: reduce)");
    function paint(announce) {
      const frame = buttonFrame(scene, elapsed);
      host.dataset.state = frame.state;
      host.dataset.pressed = String(frame.pressed);
      host.dataset.playing = String(running);
      host.dataset.ledOn = String(frame.ledOn);
      host.querySelector("[data-demo-power]").textContent = frame.power;
      host.querySelector("[data-demo-time]").textContent = (frame.elapsed / 1000).toFixed(1) + " s";
      host.querySelector("[data-demo-fill]").style.transform = "scaleX(" + frame.progress + ")";
      host.querySelector("[data-demo-state]").textContent = {
        ble: "蓝牙工作", confirm: "等待二次确认", wifi: "WiFi 配网"
      }[frame.state];
      host.querySelector("[data-demo-text]").textContent = frame.text;
      const ledLabel = host.querySelector("[data-demo-led-label]");
      if (ledLabel) ledLabel.textContent = frame.state === "confirm" ? "指示灯 · 快闪确认" : frame.state === "wifi" ? "指示灯 · 配网节奏" : "指示灯 · 慢闪";
      host.querySelector("[data-demo-key]").textContent = frame.pressed ? "按住" : "松开";
      const countdown = host.querySelector("[data-demo-countdown]");
      if (countdown) countdown.textContent = frame.countdown !== null ? "确认剩余 " + frame.countdown.toFixed(1) + " s" :
        frame.state === "wifi" ? "到手机 WiFi 设置连接热点" :
        scene === "short" || scene === "adjust" ? "0.5 秒起每 0.2 秒加一步" :
        frame.elapsed >= 5300 ? "确认超时，热点未开启" : "满 2 秒后松开";
      host.querySelectorAll("[data-demo-phase]").forEach(item => {
        item.dataset.active = String(item.dataset.demoPhase === frame.phase);
        item.parentElement.classList.toggle("hidden", scene === "short" || scene === "adjust");
      });
      play.textContent = motion.matches ? "逐步演示" : running ? "暂停" : elapsed >= scenes[scene].duration ? "重播" : "播放演示";
      play.setAttribute("aria-pressed", String(running));
      if (announce) caption.textContent = frame.text;
    }
    function pause(announce = true) {
      if (running) elapsed = Math.min(performance.now() - started, scenes[scene].duration);
      running = false;
      cancelAnimationFrame(request);
      paint(announce);
    }
    function tick(now) {
      elapsed = Math.min(now - started, scenes[scene].duration);
      if (elapsed >= scenes[scene].duration) { running = false; paint(true); return; }
      paint(false);
      request = requestAnimationFrame(tick);
    }
    function next() {
      pause(false);
      elapsed = scenes[scene].steps.find(time => time > elapsed + 1) ?? scenes[scene].duration;
      paint(true);
    }
    play.addEventListener("click", () => {
      if (motion.matches) {
        if (elapsed >= scenes[scene].duration) elapsed = 0;
        else { next(); return; }
        paint(true);
        return;
      }
      if (running) { pause(); return; }
      if (elapsed >= scenes[scene].duration) elapsed = 0;
      running = true;
      started = performance.now() - elapsed;
      paint(true);
      request = requestAnimationFrame(tick);
    });
    step.addEventListener("click", next);
    host.querySelector("[data-demo-reset]").addEventListener("click", () => { pause(false); elapsed = 0; paint(true); });
    host.querySelectorAll("[data-demo-scene]").forEach(button => {
      button.addEventListener("click", () => {
        pause(false);
        scene = button.dataset.demoScene;
        elapsed = 0;
        host.querySelectorAll("[data-demo-scene]").forEach(item => item.setAttribute("aria-pressed", String(item === button)));
        host.querySelector("[data-demo-title]").textContent = scenes[scene].title;
        paint(true);
      });
    });
    document.addEventListener("visibilitychange", () => { if (document.hidden) pause(false); });
    host.closest("[data-operation-demos]")?.addEventListener("demo:pause", () => pause(false));
    window.addEventListener("blur", () => pause(false));
    motion.addEventListener("change", () => pause(false));
    if ("IntersectionObserver" in window) {
      new IntersectionObserver(entries => { if (!entries[0].isIntersecting) pause(false); }).observe(host);
    }
    paint(false);
  }
  async function init() {
    document.querySelectorAll("[data-button-demo]").forEach(initDemo);
    if (location.protocol === "file:") {
      document.querySelectorAll("[data-page-release]").forEach(el => el.textContent = "本地预览 · 未发布");
      return;
    }
    try {
      const response = await fetch("./site-info.json", { cache: "no-cache" });
      const info = response.ok ? await response.json() : null;
      const local = ["localhost", "127.0.0.1", ""].includes(location.hostname);
      const label = !info && !local ? "更新信息暂不可用" : releaseLabel(info);
      document.querySelectorAll("[data-page-release]").forEach(el => el.textContent = label);
    } catch (_) {
      document.querySelectorAll("[data-page-release]").forEach(el => {
        el.textContent = location.protocol === "file:" ? "本地预览 · 未发布" : "更新信息暂不可用";
      });
    }
  }
  if (document.readyState === "loading") document.addEventListener("DOMContentLoaded", init);
  else init();
})();
