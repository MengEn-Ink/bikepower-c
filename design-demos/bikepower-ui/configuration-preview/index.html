iv:first-child span { font-size:14px; font-weight:650; }\n.action-bar>div:first-child small { font-size:13px; margin-top:4px; }\n.primary-btn,.secondary-btn { min-height:48px; border-radius:8px; font-size:14px; font-weight:700; padding:0 24px; }\n.primary-btn { color:#17191d; }\n.primary-btn:disabled { border-color:var(--line); background:var(--surface-3); color:var(--muted); }\n.toast { bottom:106px; }\nhtml[data-theme=dark] .status-chip--ok,html[data-theme=dark] .applied-tag { border-color:#376b70; }\nhtml[data-theme=dark] .runtime-alert,html[data-theme=dark] .shared-calibration-hint { border-color:#376b70; }\nhtml[data-theme=dark] .runtime-alert.is-warn,html[data-theme=dark] .bridge-fallback { border-color:#7f693d; }\nhtml[data-theme=dark] .runtime-alert.is-warn b,html[data-theme=dark] .runtime-alert.is-warn p { color:var(--warn); }\n.workspace.is-mode-pending { grid-template-columns:1fr; }\n@media(max-width:920px) {\n  body { padding-bottom:118px; }\n  .topbar-inner { min-height:56px; padding:0 16px; }\n  .brand { font-size:17px; }\n  .page { padding:12px 12px 32px; }\n  .sport-switch { width:100%; margin-bottom:12px; }\n  .workspace { display:block; }\n  .live-pane { position:static; padding:14px 16px; margin-bottom:16px; border:1px solid var(--line); gap:0 8px; }\n  .section-kicker>span:first-child { font-size:12px; }\n  .live-title-row { display:none; }\n  .live-title-row h1 { font-size:16px; }\n  .live-title-row p { margin-top:3px; font-size:12px; }\n  .hero-metric { margin:0; padding:0 0 10px; border:0; }\n  .hero-metric>div { margin-top:5px; min-height:38px; }\n  .hero-metric strong { font-size:38px; letter-spacing:-1px; }\n  .hero-metric b { font-size:13px; }\n  .hero-metric p { display:none; }\n  .metric-grid article,.metric-grid article+article { padding:0 0 10px 10px; border-left:1px solid var(--line); }\n  .metric-grid strong { font-size:28px; }\n  .metric-grid small { display:none; }\n  .metric-grid article>div { margin-top:5px; }\n  .hero-metric>span,.metric-grid article>span { font-size:12px; }\n  .diagnostics { margin-top:2px; }\n  .diagnostics summary { min-height:32px; font-size:12px; }\n  .editor-pane { padding:20px 16px 16px; }\n  .editor-head { padding-bottom:18px; }\n  .editor-head h2 { font-size:22px; margin:0; }\n  .editor-section { padding:18px 0; }\n  .section-title h3 { font-size:15px; }\n  .section-title p { font-size:12px; }\n  .source-segment button { min-height:58px; }\n  .field-pair,.inline-fields { gap:12px; }\n  .check-grid { gap:8px; }\n  .check-grid label { padding:9px 8px; gap:6px; }\n  .check-grid b { font-size:13px; }\n  .action-bar { padding:10px 16px calc(12px + env(safe-area-inset-bottom,0px)); min-height:98px; }\n  .action-bar>div:first-child { margin-bottom:7px; }\n  .action-bar>div:first-child span { font-size:13px; }\n  .action-bar>div:last-child { gap:10px; grid-template-columns:.85fr 1.15fr; }\n}\n@media(max-width:350px) {\n  .page { padding-left:8px; padding-right:8px; }\n  .editor-pane { padding:18px 12px; }\n  .metric-grid strong { font-size:24px; }\n  .section-title p { max-width:45%; text-align:right; }\n  .field-pair label { font-size:13px; }\n}\n\u003c/style>\u003c/head>\n\u003cbody>\n\u003cnoscript>请启用 JavaScript 后配置设备。\u003c/noscript>\n  \u003cheader class=\"topbar\">\n    \u003cdiv class=\"topbar-inner\">\n      \u003ca class=\"brand\" href=\"#\" aria-label=\"BikePower\">\n        \u003csvg class=\"brand-mark\" viewBox=\"0 0 64 64\" aria-hidden=\"true\">\n          \u003cpath class=\"brand-accent\" d=\"M37 4 22 28h11l-8 14 19-22H33z\"/>\n          \u003cpath class=\"brand-line\" d=\"M13 19a24 24 0 1 0 34 27M7 12a36 36 0 0 1 13-7\"/>\n          \u003ccircle class=\"brand-hub\" cx=\"22\" cy=\"35\" r=\"5\"/>\n        \u003c/svg>\n        \u003cspan>Bike\u003cstrong>Power\u003c/strong>\u003c/span>\n      \u003c/a>\n      \u003cdiv class=\"device-heading\">\n        \u003cb id=\"headerDeviceName\">我的训练设备\u003c/b>\n        \u003cspan id=\"headerFirmware\">设备配置\u003c/span>\n      \u003c/div>\n      \u003cdiv class=\"session-clock\">\n        \u003cspan>闲置关闭\u003c/span>\n        \u003cb id=\"wifiTimer\" aria-label=\"无操作后关闭倒计时\">05:00\u003c/b>\n        \u003cbutton class=\"icon-btn\" id=\"renewBtn\" type=\"button\" title=\"续期配网\" aria-label=\"续期配网\">\n          \u003csvg viewBox=\"0 0 24 24\" aria-hidden=\"true\">\u003cpath d=\"M20 11a8 8 0 1 0-2.3 5.7\"/>\u003cpath d=\"M20 5v6h-6\"/>\u003c/svg>\n        \u003c/button>\n      \u003c/div>\n    \u003c/div>\n  \u003c/header>\n\n  \u003cmain class=\"page\">\n    \u003cdiv class=\"session-warning\" id=\"sessionWarning\" role=\"status\" hidden>\n      \u003cdiv>\u003cb>即将关闭配网\u003c/b>\u003cp>继续无操作，\u003cstrong id=\"warningSeconds\">30\u003c/strong> 秒后关闭 WiFi。操作页面可续期至 5 分钟。\u003c/p>\n      \u003cp id=\"warningDirty\" hidden>未保存修改不会自动提交，请及时保存。\u003c/p>\u003c/div>\n      \u003cbutton class=\"secondary-btn\" id=\"warningRenewBtn\" type=\"button\">继续配置\u003c/button>\n    \u003c/div>\n    \u003cp class=\"session-renew-error\" id=\"sessionRenewError\" role=\"status\" hidden>\u003c/p>\n    \u003cnav class=\"sport-switch\" aria-label=\"运动类型\">\n      \u003cbutton class=\"is-active\" type=\"button\" data-sport=\"cycling\" aria-pressed=\"true\">骑行\u003c/button>\n      \u003cbutton type=\"button\" data-sport=\"running\" aria-pressed=\"false\">跑步\u003c/button>\n    \u003c/nav>\n\n    \u003cdiv class=\"workspace\">\n      \u003csection class=\"live-pane\" aria-labelledby=\"liveTitle\">\n        \u003cdiv class=\"section-kicker\">\n          \u003cspan>当前输出\u003c/span>\n          \u003cspan class=\"status-chip status-chip--ok\" id=\"liveStatus\">\u003ci>\u003c/i>模拟运行\u003c/span>\n        \u003c/div>\n        \u003cdiv class=\"live-title-row\">\n          \u003cdiv>\n            \u003ch1 id=\"liveTitle\">模拟骑行输出\u003c/h1>\n            \u003cp id=\"liveSubtitle\">当前配置已应用 · App 已连接\u003c/p>\n          \u003c/div>\n          \u003cspan class=\"applied-tag\">已应用\u003c/span>\n        \u003c/div>\n\n        \u003cdiv class=\"signal-chain\" aria-label=\"信号链路\" hidden>\n          \u003cdiv class=\"chain-node\">\n            \u003cspan>上游\u003c/span>\n            \u003cb id=\"chainSource\">模拟引擎\u003c/b>\n            \u003csmall id=\"chainSourceState\">已连接\u003c/small>\n          \u003c/div>\n          \u003cdiv class=\"chain-path chain-path--in\">\u003ci>\u003c/i>\u003cspan id=\"chainTransform\">平滑\u003c/span>\u003c/div>\n          \u003cdiv class=\"chain-node chain-node--core\">\n            \u003cspan>BikePower\u003c/span>\n            \u003cb>校正与保护\u003c/b>\n            \u003csmall>广播中\u003c/small>\n          \u003c/div>\n          \u003cdiv class=\"chain-path chain-path--out\">\u003ci>\u003c/i>\u003cspan>BLE\u003c/span>\u003c/div>\n          \u003cdiv class=\"chain-node\">\n            \u003cspan>下游\u003c/span>\n            \u003cb>骑行 App\u003c/b>\n            \u003csmall>已订阅\u003c/small>\n          \u003c/div>\n        \u003c/div>\n\n        \u003cdiv class=\"hero-metric\">\n          \u003cspan id=\"heroMetricLabel\">模拟功率\u003c/span>\n          \u003cdiv>\u003cstrong id=\"heroMetricValue\">220\u003c/strong>\u003cb id=\"heroMetricUnit\">W\u003c/b>\u003c/div>\n          \u003cp id=\"heroMetricMeta\">已应用目标 220 W\u003c/p>\n        \u003c/div>\n\n        \u003cdiv class=\"metric-grid\">\n          \u003carticle>\n            \u003cspan id=\"metricTwoLabel\">模拟踏频\u003c/span>\n            \u003cdiv>\u003cstrong id=\"metricTwoValue\">88\u003c/strong>\u003cb id=\"metricTwoUnit\">rpm\u003c/b>\u003c/div>\n            \u003csmall id=\"metricTwoMeta\">本机平滑生成\u003c/small>\n          \u003c/article>\n          \u003carticle>\n            \u003cspan>模拟心率\u003c/span>\n            \u003cdiv>\u003cstrong id=\"heartLiveValue\">145\u003c/strong>\u003cb>bpm\u003c/b>\u003c/div>\n            \u003csmall id=\"heartLiveMeta\">随功率变化\u003c/small>\n          \u003c/article>\n        \u003c/div>\n\n        \u003cdiv class=\"runtime-alert\" id=\"runtimeAlert\">\n          \u003ci>\u003c/i>\n          \u003cdiv>\n            \u003cb id=\"runtimeAlertTitle\">模拟输出正在运行\u003c/b>\n            \u003cp id=\"runtimeAlertText\">功率与踏频由设备本机平滑生成。\u003c/p>\n          \u003c/div>\n        \u003c/div>\n\n        \u003cdetails class=\"diagnostics\">\n          \u003csummary>运行详情 \u003cspan>展开\u003c/span>\u003c/summary>\n          \u003cdl>\n            \u003cdiv>\u003cdt>配置版本\u003c/dt>\u003cdd id=\"schemaVersion\">配置已读取\u003c/dd>\u003c/div>\n            \u003cdiv>\u003cdt>空闲堆\u003c/dt>\u003cdd id=\"heapValue\">117.2 KiB\u003c/dd>\u003c/div>\n            \u003cdiv>\u003cdt>样本距今\u003c/dt>\u003cdd id=\"packetCount\">—\u003c/dd>\u003c/div>\n            \u003cdiv>\u003cdt id=\"eventStateLabel\">曲柄事件\u003c/dt>\u003cdd id=\"crankState\">有效\u003c/dd>\u003c/div>\n            \u003cdiv>\u003cdt>App 订阅\u003c/dt>\u003cdd id=\"appServices\">CPS / CSC / FTMS\u003c/dd>\u003c/div>\n            \u003cdiv>\u003cdt id=\"upstreamStateLabel\">上游状态\u003c/dt>\u003cdd id=\"reconnectState\">无\u003c/dd>\u003c/div>\n          \u003c/dl>\n        \u003c/details>\n      \u003c/section>\n\n      \u003csection class=\"editor-pane\" aria-labelledby=\"editorTitle\">\n        \u003cdiv class=\"editor-head\">\n          \u003cdiv>\n            \u003cspan>现场配置\u003c/span>\n            \u003ch2 id=\"editorTitle\">骑行输出\u003c/h2>\n          \u003c/div>\n          \u003cspan class=\"draft-chip\" id=\"draftChip\" hidden>有未保存修改\u003c/span>\n        \u003c/div>\n        \u003cdiv class=\"runtime-alert is-warn mode-switch-notice\" id=\"modeSwitchNotice\" role=\"status\" hidden>\n          \u003ci>\u003c/i>\n          \u003cdiv>\n            \u003cb id=\"modeSwitchTitle\">跑步模式尚未应用\u003c/b>\n            \u003cp id=\"modeSwitchText\">保存后设备将重建跑步广播，当前 BLE 连接可能短暂断开。\u003c/p>\n          \u003c/div>\n        \u003c/div>\n\n        \u003cdiv id=\"cyclingEditor\">\n          \u003csection class=\"editor-section\">\n            \u003cdiv class=\"section-title\">\n              \u003cdiv>\u003cspan>01\u003c/span>\u003ch3>输出来源\u003c/h3>\u003c/div>\n              \u003cp id=\"sourceSummary\">本机模拟\u003c/p>\n            \u003c/div>\n            \u003cdiv class=\"segmented source-segment\" role=\"group\" aria-label=\"骑行输出来源\">\n              \u003cbutton class=\"is-active\" type=\"button\" data-source=\"simulation\">\n                \u003cb>模拟输出\u003c/b>\u003csmall>固定 / 机器人\u003c/small>\n              \u003c/button>\n              \u003cbutton type=\"button\" data-source=\"bridge\">\n                \u003cb>真实功率计\u003c/b>\u003csmall>功率 + 同源踏频\u003c/small>\n              \u003c/button>\n            \u003c/div>\n          \u003c/section>\n\n          \u003csection class=\"editor-section bridge-entry\" id=\"bridgeIntro\" hidden>\n            \u003cdiv class=\"bridge-entry-copy\">\n              \u003cspan class=\"bridge-entry-index\">02\u003c/span>\n              \u003cdiv>\n                \u003cspan>真实功率来源\u003c/span>\n                \u003ch3>添加第一台功率计\u003c/h3>\n                \u003cp>最多保存三台；测试通过前，当前模拟输出保持不变。\u003c/p>\n              \u003c/div>\n            \u003c/div>\n            \u003cbutton class=\"primary-btn\" id=\"bridgeStartScanBtn\" type=\"button\">选择功率计\u003c/button>\n          \u003c/section>\n\n          \u003cdiv id=\"bridgeEditor\" hidden>\n            \u003csection class=\"editor-section\">\n              \u003cdiv class=\"section-title\">\n                \u003cdiv>\u003cspan>02\u003c/span>\u003ch3>功率计主备\u003c/h3>\u003c/div>\n                \u003cbutton class=\"text-btn\" id=\"scanBtn\" type=\"button\">添加功率计\u003c/button>\n              \u003c/div>\n              \u003cdiv class=\"bridge-source-status\" aria-live=\"polite\">\n                \u003cdiv>\n                  \u003cspan>配置来源\u003c/span>\n                  \u003cb id=\"configuredSource\">模拟输出\u003c/b>\n                \u003c/div>\n                \u003cdiv>\n                  \u003cspan>实际来源\u003c/span>\n                  \u003cb id=\"actualSource\">模拟引擎\u003c/b>\n                \u003c/div>\n                \u003cdiv>\n                  \u003cspan>下次尝试\u003c/span>\n                  \u003cb id=\"nextBridgeAttempt\">—\u003c/b>\n                \u003c/div>\n                \u003cbutton class=\"secondary-btn\" id=\"retryBridgeBtn\" type=\"button\">立即重试\u003c/button>\n              \u003c/div>\n              \u003cdiv class=\"bridge-device-list\" id=\"bridgeDeviceList\">\u003c/div>\n              \u003ctemplate id=\"bridgeDeviceTemplate\">\n                \u003cdiv class=\"bridge-device-item\" data-device>\n                  \u003cdiv class=\"bridge-device-name\">\u003cb>\u003c/b>\u003cspan>\u003c/span>\u003c/div>\n                  \u003cspan class=\"bridge-device-state\">\u003c/span>\n                  \u003cdiv class=\"bridge-device-actions\">\n                    \u003cbutton class=\"icon-btn\" type=\"button\" data-action=\"prefer\" title=\"设为首选\" aria-label=\"设为首选\">↑\u003c/button>\n                    \u003cbutton class=\"icon-btn\" type=\"button\" data-action=\"delete\" title=\"删除功率计\" aria-label=\"删除功率计\">×\u003c/button>\n                  \u003c/div>\n                \u003c/div>\n              \u003c/template>\n              \u003cp class=\"bridge-fallback\" id=\"fallbackSimulationSummary\" hidden>\u003c/p>\n              \u003cdiv id=\"selectedDeviceDetail\">\n                \u003cdiv class=\"device-row\">\n                  \u003cdiv class=\"device-monogram\">PM\u003c/div>\n                  \u003cdiv>\n                    \u003cb id=\"selectedDeviceName\">未选择功率计\u003c/b>\n                    \u003cspan id=\"selectedDeviceMeta\">扫描并测试后可查看设备信息\u003c/span>\n                  \u003c/div>\n                  \u003cspan class=\"inline-state\" id=\"meterConnection\">待测试\u003c/span>\n                \u003c/div>\n                \u003cdiv class=\"capability-row\" id=\"deviceCapabilities\">\n                  \u003cspan>功率\u003c/span>\u003cspan>真实踏频\u003c/span>\n                \u003c/div>\n                \u003cdiv class=\"identity-heading\">\u003cb>功率计设备信息\u003c/b>\u003cspan>DIS 设备信息\u003c/span>\u003c/div>\n                \u003cdl class=\"identity-grid\" id=\"meterInfo\">\u003c/dl>\n                \u003clabel class=\"copy-check\">\u003cinput id=\"copyIdentity\" type=\"checkbox\">\u003cspan>\u003cb>复制设备信息到开发板\u003c/b>\u003csmall>仅可复制本次新增功率计；自动接管备选不会改写开发板身份。\u003c/small>\u003c/span>\u003c/label>\n                \u003cdiv id=\"identityOptions\" hidden>\n                  \u003clabel class=\"wide-field\">开发板广播名称\n                    \u003cselect id=\"identityNameSource\">\n                      \u003coption value=\"meter\">使用功率计名称\u003c/option>\n                      \u003coption value=\"board\">保留开发板名称\u003c/option>\n                      \u003coption value=\"custom\">自定义名称\u003c/option>\n                    \u003c/select>\n                  \u003c/label>\n                  \u003clabel class=\"wide-field\" id=\"customNameField\" hidden>自定义名称\u003cinput id=\"customIdentityName\" type=\"text\" maxlength=\"23\" placeholder=\"输入开发板广播名称\">\u003c/label>\n                  \u003cdiv class=\"identity-heading\">\u003cb>保存后的开发板信息\u003c/b>\u003cspan>预览\u003c/span>\u003c/div>\n                  \u003cdl class=\"identity-grid\" id=\"identityPreview\">\u003c/dl>\n                  \u003cp class=\"identity-note\">仅复制名称与设备信息，不复制蓝牙地址。骑行 App 中可能出现同名设备。\u003c/p>\n                \u003c/div>\n              \u003c/div>\n              \u003cbutton class=\"quiet-danger\" id=\"stopBridgeBtn\" type=\"button\">停止桥接\u003c/button>\n            \u003c/section>\n\n            \u003csection class=\"editor-section\">\n              \u003cdiv class=\"section-title\">\n                \u003cdiv>\u003cspan>03\u003c/span>\u003ch3>功率校正\u003c/h3>\u003c/div>\n                \u003cp>实际 \u003cb id=\"actualCalibration\">+12 W\u003c/b>\u003c/p>\n              \u003c/div>\n              \u003cp class=\"shared-calibration-hint\" id=\"sharedCalibrationHint\">这组校正适用于全部已保存功率计\u003c/p>\n              \u003cdiv class=\"segmented\" role=\"group\" aria-label=\"校正模式\">\n                \u003cbutton type=\"button\" data-calibration=\"raw\">原值\u003c/button>\n                \u003cbutton class=\"is-active\" type=\"button\" data-calibration=\"watts\">按瓦数\u003c/button>\n                \u003cbutton type=\"button\" data-calibration=\"percent\">按百分比\u003c/button>\n              \u003c/div>\n              \u003cdiv class=\"adjustment\" id=\"calibrationAdjustment\">\n                \u003clabel for=\"calibrationValue\" id=\"calibrationLabel\">调整瓦数\u003c/label>\n                \u003cdiv class=\"stepper\">\n                  \u003cbutton type=\"button\" id=\"calibrationMinus\" aria-label=\"减少校正值\">−\u003c/button>\n                  \u003cdiv>\n                    \u003cinput id=\"calibrationValue\" type=\"number\" value=\"12\" inputmode=\"decimal\">\n                    \u003cspan id=\"calibrationUnit\">W\u003c/span>\n                  \u003c/div>\n                  \u003cbutton type=\"button\" id=\"calibrationPlus\" aria-label=\"增加校正值\">+\u003c/button>\n                \u003c/div>\n                \u003cinput id=\"calibrationRange\" type=\"range\" min=\"-200\" max=\"200\" value=\"12\" aria-label=\"功率校正值\">\n              \u003c/div>\n              \u003cdiv class=\"formula-line\">\n                \u003cspan id=\"calibrationFormula\">输入 + 12 W，0 W 保持为 0 W\u003c/span>\n                \u003cb id=\"calibrationPreview\">238 W → 250 W\u003c/b>\n              \u003c/div>\n            \u003c/section>\n          \u003c/div>\n\n          \u003cdiv id=\"simulationEditor\">\n            \u003csection class=\"editor-section\">\n              \u003cdiv class=\"section-title\">\n                \u003cdiv>\u003cspan>02\u003c/span>\u003ch3>模拟目标\u003c/h3>\u003c/div>\n                \u003cp>当前 \u003cb id=\"simulationModeSummary\">固定功率\u003c/b>\u003c/p>\n              \u003c/div>\n              \u003cdiv class=\"segmented two-options\" role=\"group\" aria-label=\"模拟模式\">\n                \u003cbutton class=\"is-active\" type=\"button\" data-sim-mode=\"fixed\">固定功率\u003c/button>\n                \u003cbutton type=\"button\" data-sim-mode=\"pacer\">配速机器人\u003c/button>\n              \u003c/div>\n              \u003cdiv class=\"field-pair\">\n                \u003clabel id=\"fixedPowerField\">目标功率\u003cinput id=\"simPower\" type=\"number\" min=\"0\" max=\"2000\" value=\"220\" inputmode=\"numeric\">\u003cspan>W\u003c/span>\u003c/label>\n                \u003clabel id=\"robotWeightField\" hidden>体重\u003cinput id=\"profileWeight\" type=\"number\" min=\"30\" max=\"200\" value=\"70\" inputmode=\"decimal\">\u003cspan>kg\u003c/span>\u003c/label>\n                \u003clabel>模拟踏频\u003cinput id=\"simCadence\" type=\"number\" value=\"88\" inputmode=\"numeric\">\u003cspan>rpm\u003c/span>\u003c/label>\n              \u003c/div>\n              \u003cdiv class=\"field-pair\">\n                \u003clabel>功率浮动\u003cinput id=\"powerFloat\" type=\"number\" min=\"0\" max=\"100\" value=\"50\">\u003cspan>±W\u003c/span>\u003c/label>\n                \u003clabel>踏频浮动\u003cinput id=\"cadenceFloat\" type=\"number\" min=\"0\" max=\"20\" value=\"8\">\u003cspan>±rpm\u003c/span>\u003c/label>\n              \u003c/div>\n              \u003cdiv id=\"robotFields\" hidden>\n                \u003clabel class=\"wide-field intensity-field\">骑行强度\n                  \u003cselect id=\"robotPreset\">\n                    \u003coption value=\"recovery\">恢复骑行 · 1.5–2.0 W/kg\u003c/option>\n                    \u003coption value=\"endurance\" selected>耐力骑行 · 2.5–3.0 W/kg\u003c/option>\n                    \u003coption value=\"tempo\">节奏骑行 · 3.0–3.5 W/kg\u003c/option>\n                    \u003coption value=\"custom\">自定义强度\u003c/option>\n                  \u003c/select>\n                \u003c/label>\n                \u003cdiv class=\"field-pair\" id=\"customRobotFields\" hidden>\n                  \u003clabel>强度下限\u003cinput id=\"wkgMin\" type=\"number\" min=\"0.5\" max=\"10\" step=\"0.1\" value=\"2.5\" inputmode=\"decimal\">\u003cspan>W/kg\u003c/span>\u003c/label>\n                  \u003clabel>强度上限\u003cinput id=\"wkgMax\" type=\"number\" min=\"0.5\" max=\"10\" step=\"0.1\" value=\"3\" inputmode=\"decimal\">\u003cspan>W/kg\u003c/span>\u003c/label>\n                \u003c/div>\n                \u003clabel class=\"wide-field\">自定义档名称\u003cinput id=\"customPacerName\" maxlength=\"31\">\u003c/label>\n                \u003cdiv class=\"robot-preview\">\u003cspan>功率范围 \u003cb id=\"robotPowerRange\">175–210 W\u003c/b>\u003c/span>\u003csmall>按体重与强度平滑变化\u003c/small>\u003c/div>\n                \u003cp class=\"field-error\" id=\"robotRangeError\" role=\"status\" hidden>强度下限不能大于上限\u003c/p>\n              \u003c/div>\n            \u003c/section>\n          \u003c/div>\n\n          \u003csection class=\"editor-section\">\n            \u003cdiv class=\"section-title\">\n              \u003cdiv>\u003cspan id=\"broadcastIndex\">03\u003c/span>\u003ch3>广播数据\u003c/h3>\u003c/div>\n              \u003cp>至少保留一项\u003c/p>\n            \u003c/div>\n            \u003cdiv class=\"check-grid\">\n              \u003clabel>\u003cinput type=\"checkbox\" data-broadcast=\"power\" checked>\u003cspan>\u003cb>功率\u003c/b>\u003csmall>CPS / FTMS\u003c/small>\u003c/span>\u003c/label>\n              \u003clabel>\u003cinput type=\"checkbox\" data-broadcast=\"cadence\" checked>\u003cspan>\u003cb>踏频\u003c/b>\u003csmall>CSC / FTMS\u003c/small>\u003c/span>\u003c/label>\n              \u003clabel>\u003cinput type=\"checkbox\" data-broadcast=\"heart\" checked>\u003cspan>\u003cb>心率\u003c/b>\u003csmall>HRS / FTMS\u003c/small>\u003c/span>\u003c/label>\n              \u003clabel>\u003cinput type=\"checkbox\" data-cadence-bundle>\u003cspan>\u003cb>踏频随功率\u003c/b>\u003csmall>兼容码表：不单独暴露 CSC\u003c/small>\u003c/span>\u003c/label>\n            \u003c/div>\n          \u003c/section>\n\n          \u003csection class=\"editor-section\" id=\"heartSection\">\n            \u003cdiv class=\"section-title\">\n              \u003cdiv>\u003cspan id=\"heartIndex\">04\u003c/span>\u003ch3>模拟心率\u003c/h3>\u003c/div>\n              \u003cbutton class=\"toggle is-on\" id=\"heartToggle\" type=\"button\" role=\"switch\" aria-checked=\"true\">\u003ci>\u003c/i>\u003cb>已启用\u003c/b>\u003c/button>\n            \u003c/div>\n            \u003cp class=\"identity-note\" id=\"bridgeHeartHint\" hidden>接入真实功率计后默认关闭；可手动开启模拟心率。\u003c/p>\n            \u003cdiv id=\"heartFields\">\n              \u003cdiv class=\"segmented\" role=\"group\" aria-label=\"模拟心率模式\">\n                \u003cbutton class=\"is-active\" type=\"button\" data-heart-mode=\"linked\">功率联动\u003c/button>\n                \u003cbutton type=\"button\" data-heart-mode=\"fixed\">固定心率\u003c/button>\n              \u003c/div>\n              \u003cdiv class=\"field-pair\" id=\"linkedHeartFields\">\n                \u003clabel>FTP\u003cinput id=\"ftpValue\" type=\"number\" value=\"300\">\u003cspan>W\u003c/span>\u003c/label>\n                \u003clabel>阈值心率\u003cinput id=\"thresholdHeart\" type=\"number\" value=\"190\">\u003cspan>bpm\u003c/span>\u003c/label>\n              \u003c/div>\n              \u003cdiv class=\"field-pair\" id=\"fixedHeartFields\" hidden>\n                \u003clabel>目标心率\u003cinput id=\"fixedHeart\" type=\"number\" value=\"145\">\u003cspan>bpm\u003c/span>\u003c/label>\n              \u003c/div>\n              \u003clabel class=\"wide-field\">固定心率浮动\u003cinput id=\"hrFloat\" type=\"number\" min=\"0\" max=\"20\" value=\"2\">\u003cspan>±bpm\u003c/span>\u003c/label>\n            \u003c/div>\n          \u003c/section>\n        \u003c/div>\n\n        \u003cdiv id=\"runningEditor\" hidden>\n          \u003csection class=\"editor-section\">\n            \u003cdiv class=\"section-title\">\n              \u003cdiv>\u003cspan>01\u003c/span>\u003ch3>跑步模式\u003c/h3>\u003c/div>\n              \u003cp id=\"runModeSummary\">固定配速\u003c/p>\n            \u003c/div>\n            \u003cdiv class=\"segmented\" role=\"group\" aria-label=\"跑步模式\">\n              \u003cbutton class=\"is-active\" type=\"button\" data-run-mode=\"fixed\">固定配速\u003c/button>\n              \u003cbutton type=\"button\" data-run-mode=\"pacer\">配速档\u003c/button>\n\n            \u003c/div>\n            \u003cdiv id=\"runRobotFields\" hidden>\n              \u003clabel class=\"wide-field\">配速档\u003cselect id=\"runPreset\">\u003c/select>\u003c/label>\n              \u003cdiv class=\"field-pair\" id=\"runCustomFields\" hidden>\n                \u003clabel>最快配速\u003cinput id=\"runPaceLow\" type=\"number\" min=\"144\" max=\"1200\">\u003cspan>秒/km\u003c/span>\u003c/label>\n                \u003clabel>最慢配速\u003cinput id=\"runPaceHigh\" type=\"number\" min=\"144\" max=\"1200\">\u003cspan>秒/km\u003c/span>\u003c/label>\n              \u003c/div>\n              \u003clabel class=\"wide-field\">自定义档名称\u003cinput id=\"runCustomName\" maxlength=\"31\">\u003c/label>\n            \u003c/div>\n            \u003cdiv class=\"pace-editor\" id=\"fixedPaceFields\">\n              \u003clabel>配速\u003c/label>\n              \u003cdiv>\u003cinput id=\"paceMinutes\" type=\"number\" value=\"5\">\u003cspan>分\u003c/span>\u003cinput id=\"paceSeconds\" type=\"number\" value=\"0\">\u003cspan>秒/km\u003c/span>\u003c/div>\n              \u003csmall id=\"paceSpeed\">12.00 km/h\u003c/small>\n            \u003c/div>\n            \u003clabel class=\"wide-field\">配速浮动\u003cinput id=\"runPaceFloat\" type=\"number\" min=\"0\" max=\"60\">\u003cspan>±秒/km\u003c/span>\u003c/label>\n            \u003cdiv class=\"field-pair\">\n              \u003clabel>步频\u003cinput id=\"runCadence\" type=\"number\" value=\"170\">\u003cspan>spm\u003c/span>\u003c/label>\n              \u003clabel>步频浮动\u003cinput id=\"runCadenceFloat\" type=\"number\" value=\"4\">\u003cspan>±spm\u003c/span>\u003c/label>\n            \u003c/div>\n          \u003c/section>\n\n        \u003c/div>\n\n        \u003cdiv id=\"sharedHeart\">\u003c/div>\n        \u003cdetails class=\"device-settings\">\n          \u003csummary>\n            \u003cdiv>\u003cspan>设备\u003c/span>\u003cb>名称、按钮与固件详情\u003c/b>\u003c/div>\n            \u003cspan>展开\u003c/span>\n          \u003c/summary>\n          \u003cdiv class=\"device-settings-body\">\n            \u003clabel class=\"wide-field\">设备名称\u003cinput id=\"deviceNameInput\" type=\"text\" value=\"BikePower-C3\" maxlength=\"23\">\u003c/label>\n            \u003clabel class=\"wide-field\">按钮调功步进\u003cinput id=\"powerStepInput\" type=\"number\" value=\"20\">\u003cspan>W\u003c/span>\u003c/label>\n            \u003cdl class=\"identity-grid\" id=\"boardIdentity\">\u003c/dl>\n            \u003cdl class=\"firmware-list\">\n              \u003cdiv>\u003cdt>固件\u003c/dt>\u003cdd id=\"firmwareVersion\">预览样本\u003c/dd>\u003c/div>\n              \u003cdiv>\u003cdt>板型\u003c/dt>\u003cdd id=\"boardType\">—\u003c/dd>\u003c/div>\n              \u003cdiv>\u003cdt>Git SHA\u003c/dt>\u003cdd id=\"gitSha\">—\u003c/dd>\u003c/div>\n              \u003cdiv>\u003cdt>编译时间\u003c/dt>\u003cdd id=\"buildTime\">—\u003c/dd>\u003c/div>\n            \u003c/dl>\n          \u003c/div>\n        \u003c/details>\n      \u003c/section>\n    \u003c/div>\n  \u003c/main>\n\n  \u003cdiv class=\"action-bar\">\n    \u003cdiv>\n      \u003cspan id=\"saveState\" role=\"status\">当前配置已应用\u003c/span>\n      \u003csmall id=\"saveHint\">修改设置后，保存并确认生效\u003c/small>\n    \u003c/div>\n    \u003cdiv>\n      \u003cbutton class=\"secondary-btn\" id=\"closeWifiBtn\" type=\"button\">关闭 WiFi\u003c/button>\n      \u003cbutton class=\"primary-btn\" id=\"saveBtn\" type=\"button\" disabled>保存并应用\u003c/button>\n    \u003c/div>\n  \u003c/div>\n\n\n\n  \u003cdiv class=\"modal\" id=\"scanModal\" hidden>\n    \u003cdiv class=\"modal-backdrop\" data-close-modal=\"scan\">\u003c/div>\n    \u003csection class=\"modal-sheet\" role=\"dialog\" aria-modal=\"true\" aria-labelledby=\"scanTitle\">\n      \u003cheader>\n        \u003cdiv>\u003cspan>功率计扫描\u003c/span>\u003ch2 id=\"scanTitle\">选择真实功率来源\u003c/h2>\u003c/div>\n        \u003cbutton class=\"icon-btn\" type=\"button\" data-close-modal=\"scan\" aria-label=\"关闭\">×\u003c/button>\n      \u003c/header>\n      \u003cdiv class=\"scan-state\">\u003ci>\u003c/i>\u003cspan id=\"scanStatus\">正在扫描附近 CPS 功率计…\u003c/span>\u003cbutton id=\"rescanBtn\" type=\"button\">重新扫描\u003c/button>\u003c/div>\n      \u003cdiv class=\"device-results\" id=\"scanResults\">\u003c/div>\n      \u003cdiv class=\"replace-bridge-confirm\" id=\"replaceBridgeConfirm\" hidden>\n        \u003clabel for=\"replaceBridgeSlot\">已保存三台功率计，请选择替换项\u003c/label>\n        \u003cselect id=\"replaceBridgeSlot\">\u003c/select>\n        \u003cbutton class=\"primary-btn\" id=\"confirmBridgeReplaceBtn\" type=\"button\">确认替换\u003c/button>\n      \u003c/div>\n      \u003cp class=\"modal-note\">测试不会替换当前输出；保存后才会应用新设备。\u003c/p>\n    \u003c/section>\n  \u003c/div>\n\n  \u003cdiv class=\"modal\" id=\"closeModal\" hidden>\n    \u003cdiv class=\"modal-backdrop\" data-close-modal=\"close\">\u003c/div>\n    \u003csection class=\"confirm-sheet\" role=\"dialog\" aria-modal=\"true\" aria-labelledby=\"closeTitle\">\n      \u003cspan>关闭本次配网\u003c/span>\n      \u003ch2 id=\"closeTitle\">网页将无法继续访问\u003c/h2>\n      \u003cp>已运行的功率桥接会继续；未保存修改不会自动提交。\u003c/p>\n      \u003cdiv>\n        \u003cbutton class=\"secondary-btn\" type=\"button\" data-close-modal=\"close\">取消\u003c/button>\n        \u003cbutton class=\"primary-btn\" id=\"confirmCloseBtn\" type=\"button\">确认关闭\u003c/button>\n      \u003c/div>\n    \u003c/section>\n  \u003c/div>\n\n  \u003cdiv class=\"wifi-closed\" id=\"wifiClosed\" tabindex=\"-1\" role=\"region\" aria-labelledby=\"wifiClosedTitle\" hidden>\n    \u003cdiv>\n      \u003cspan id=\"wifiClosedState\">本次配网已结束\u003c/span>\n      \u003ch2 id=\"wifiClosedTitle\">配网页已关闭\u003c/h2>\n      \u003cp id=\"wifiClosedText\">已应用的运动输出继续运行，WiFi 配网正在退出。\u003c/p>\n      \u003cp>未保存修改不会自动提交。再次配置请长按设备按钮满 2 秒后松开，再短按一次开启热点。\u003c/p>\n      \u003cbutton class=\"secondary-btn\" id=\"sessionRetryBtn\" type=\"button\" hidden>重新检查设备状态\u003c/button>\n    \u003c/div>\n  \u003c/div>\n\n  \u003cdiv class=\"toast\" id=\"toast\" role=\"status\" aria-live=\"polite\">\u003c/div>\n  \n\u003cscript>\n/* 静态设计预览：只展示本地样本，不执行设备接口。 */\nconst previewTheme = new URLSearchParams(location.search).get('theme');\ndocument.documentElement.dataset.theme = document.documentElement.dataset.theme || (previewTheme === 'dark' ? 'dark' : 'light');\ndocument.querySelectorAll('.modal,.wifi-closed').forEach(n => n.hidden = true);\ndocument.querySelectorAll('button').forEach(n => { n.addEventListener('click', e => e.preventDefault()); });\n\u003c/script>\u003c/body>\n\u003c/html>\n";let theme='light';const canvas=document.getElementById('canvas'),screen=document.getElementById('screen');
screen.srcdoc=screenSource;document.querySelectorAll('[data-device]').forEach(button=>{if(button.tagName!=='BUTTON')return;button.onclick=()=>{canvas.dataset.device=button.dataset.device;document.querySelectorAll('button[data-device]').forEach(b=>b.setAttribute('aria-pressed',String(b===button)));};});
document.getElementById('themeButton').onclick=function(){theme=theme==='light'?'dark':'light';this.textContent=theme==='light'?'切换深色':'切换浅色';screen.srcdoc=screenSource.replace('<html lang=', '<html data-theme="'+theme+'" lang=');};
</script></body></html>
