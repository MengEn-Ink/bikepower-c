name: 缺陷报告
description: 报告可复现的固件、BLE、配网、网页刷写或交付问题
title: "[Bug] "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: 请勿公开提交密钥、串口唯一标识、未脱敏日志或漏洞细节；安全问题请使用私密漏洞报告。
  - type: dropdown
    id: area
    attributes:
      label: 问题范围
      options:
        - 固件运行与状态机
        - BLE / FTMS / 设备兼容
        - WiFi 配网门户
        - GitHub Pages / 网页刷写
        - 构建、测试或 GitHub Actions
        - 文档
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: 固件版本与提交
      placeholder: 例如 v4.1.1 / commit SHA
    validations:
      required: true
  - type: dropdown
    id: board
    attributes:
      label: 板型
      options:
        - generic-c3
        - m5stamp-c3
        - 不适用 / 未知
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: 复现步骤
      placeholder: |
        1. 准备……
        2. 执行……
        3. 观察到……
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: 预期结果
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: 实际结果与脱敏证据
    validations:
      required: true
  - type: checkboxes
    id: checks
    attributes:
      label: 提交前确认
      options:
        - label: 我已搜索现有 Issue，确认不是重复问题。
          required: true
        - label: 我已移除凭据、个人信息和设备唯一标识。
          required: true
        - label: 这不是需要私密披露的安全漏洞。
          required: true
