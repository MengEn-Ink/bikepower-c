name: 功能建议
description: 提议可验收的固件、网页工具、测试或文档改进
title: "[Feature] "
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: 要解决的问题
      description: 说明谁在什么场景遇到什么问题，而不只是描述实现。
    validations:
      required: true
  - type: textarea
    id: outcome
    attributes:
      label: 期望结果与验收标准
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: 影响范围
      multiple: true
      options:
        - 固件与硬件适配
        - BLE / FTMS
        - WiFi 配网
        - GitHub Pages / 网页刷写
        - 测试 Harness / CI
        - 发布与仓库治理
        - 文档
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: 建议方案与兼容性风险
  - type: checkboxes
    id: checks
    attributes:
      label: 提交前确认
      options:
        - label: 我已搜索现有 Issue 和文档，确认没有等价需求。
          required: true
        - label: 我没有提交凭据或其他敏感信息。
          required: true
