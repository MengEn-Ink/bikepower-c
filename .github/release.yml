changelog:
  exclude:
    labels:
      - duplicate
      - invalid
      - question
      - wontfix
      - release-note:skip
  categories:
    - title: 新功能
      labels: [enhancement]
    - title: 问题修复
      labels: [bug]
    - title: 文档
      labels: [documentation]
    - title: 其他改动
      labels: ["*"]
