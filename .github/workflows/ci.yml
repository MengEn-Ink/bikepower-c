name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  quick-harness:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 2

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24"

      - name: Install Python harness dependencies
        run: python3 -m pip install --disable-pip-version-check -r requirements-test.txt

      - name: Web flash lifecycle and DOM regression
        run: |
          npm ci --prefix tests/web-flash --ignore-scripts --registry=https://registry.npmjs.org
          npm test --prefix tests/web-flash
          tests/web-flash/node_modules/.bin/playwright install --with-deps chromium
          npm run browser --prefix tests/web-flash

      - name: Run quick operation harness
        run: >-
          python3 tests/operation_gate.py
          --level quick
          --report "${RUNNER_TEMP}/operation-gate-quick.md"

      - name: Check commit whitespace
        run: git diff --check HEAD^ HEAD

      - name: Upload harness report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: operation-gate-quick-${{ github.run_id }}
          path: ${{ runner.temp }}/operation-gate-quick.md
          if-no-files-found: error
          retention-days: 14
