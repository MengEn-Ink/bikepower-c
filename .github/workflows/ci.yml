name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  docs:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout exact source
        uses: actions/checkout@v7
        with:
          fetch-depth: 2
      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Docs quality gate
        run: python3 scripts/tools/quality_gate.py --level docs
      - name: Release version consistency
        run: python3 scripts/tools/check_release_version_consistency.py

  virtual-board:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15]
    steps:
      - name: Checkout exact source
        uses: actions/checkout@v7
        with:
          fetch-depth: 2
      - name: Setup virtual runtime
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Cache ESP-IDF toolchains
        uses: actions/cache@v5
        with:
          path: ~/.espressif
          key: idf-v5.5.4-${{ runner.os }}-${{ runner.arch }}
          restore-keys: idf-v5.5.4-${{ runner.os }}-
      - name: Cache virtual runtime
        uses: actions/cache@v5
        with:
          path: build/virtual-board-tools/venv
          key: virtual-venv-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('requirements-virtual-board.txt') }}
          restore-keys: virtual-venv-${{ runner.os }}-${{ runner.arch }}-
      - name: Install locked emulator and harness
        run: sh scripts/virtual_board.sh setup
      - name: Controller refusal regression
        run: build/virtual-board-tools/venv/bin/python tests/test_virtual_board.py
      - name: Build actual ESP32-C3 firmware
        shell: bash
        run: |
          IDF_DIR="$HOME/esp-idf-v5.5.4"
          if [ ! -d "$IDF_DIR/.git" ]; then
            git clone --branch v5.5.4 --depth 1 --recursive --shallow-submodules https://github.com/espressif/esp-idf.git "$IDF_DIR"
          fi
          "$IDF_DIR/install.sh" esp32c3
          . "$IDF_DIR/export.sh"
          GDB=$(command -v riscv32-esp-elf-gdb || true)
          if [ -z "$GDB" ]; then GDB=$(command -v gdb-multiarch || true); fi
          test -n "$GDB"
          sh scripts/virtual_board.sh build
          sh scripts/virtual_board.sh test build/virtual-board-build --security --running
          sh scripts/virtual_board.sh debug build/virtual-board-build --gdb "$GDB"
      - name: Upload public evidence only
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: virtual-board-${{ matrix.os }}-${{ github.run_id }}
          path: |
            tests/reports/virtual-board/**/report.json
            tests/reports/virtual-board/**/report.md
            tests/reports/virtual-board/**/gdb.log
          if-no-files-found: warn
          retention-days: 14

  quick-harness:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 2

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24"

      - name: Install Python harness dependencies
        run: python3 -m pip install --disable-pip-version-check -r requirements-test.txt

      - name: Web flash lifecycle and DOM regression
        run: |
          npm ci --prefix tests/web-flash --ignore-scripts --registry=https://registry.npmjs.org
          npm test --prefix tests/web-flash
          tests/web-flash/node_modules/.bin/playwright install --with-deps chromium
          npm run browser --prefix tests/web-flash

      - name: Run quick operation harness
        run: >-
          python3 tests/operation_gate.py
          --level quick
          --report "${RUNNER_TEMP}/operation-gate-quick.md"

      - name: Check commit whitespace
        run: git diff --check HEAD^ HEAD

      - name: Upload harness report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: operation-gate-quick-${{ github.run_id }}
          path: ${{ runner.temp }}/operation-gate-quick.md
          if-no-files-found: error
          retention-days: 14
