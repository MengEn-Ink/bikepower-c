<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 460" font-family="'PingFang SC','Microsoft YaHei',sans-serif">
  <title>WiFi 与 BLE 共存配网流程</title>
  <rect width="800" height="460" fill="#fff"/>
  <text x="400" y="38" text-anchor="middle" font-size="22" font-weight="bold" fill="#222">WiFi / BLE 共存配网</text>
  <g font-size="16" fill="#222">
    <rect x="30" y="70" width="740" height="50" rx="8" fill="#e3f2fd" stroke="#1976d2"/>
    <text x="400" y="101" text-anchor="middle">BLE 工作 → 长按 ≥2s 松开 → 3s 内二次按键</text>
    <text x="400" y="145" text-anchor="middle">↓ radio_ctrl_enter_wifi</text>
    <rect x="30" y="164" width="740" height="100" rx="8" fill="#e8f5e9" stroke="#388e3c"/>
    <text x="50" y="196">BLE 保持在线；启动 SoftAP、HTTP 与 Captive Portal</text>
    <text x="50" y="225">BPW_XXXX · 密码 12345678 · http://192.168.4.1</text>
    <text x="50" y="250">配置保存经主任务事务与 NVS；默认 300 秒，仅主动续期延长</text>
    <text x="400" y="290" text-anchor="middle">↓ 关闭事务成功 / 超时 → done 回调 → APP_EVT_WIFI_DONE</text>
    <rect x="30" y="311" width="740" height="60" rx="8" fill="#e3f2fd" stroke="#1976d2"/>
    <text x="400" y="346" text-anchor="middle">radio_ctrl_exit_wifi → 关闭 HTTP / SoftAP → 回 BLE_ACTIVE</text>
    <text x="400" y="402" text-anchor="middle" font-weight="bold">普通配网不停止 BLE、不重启设备</text>
    <text x="400" y="432" text-anchor="middle" font-size="14" fill="#555">仅共存初始化失败时停止 BLE 后重试；禁止开机自动启 WiFi</text>
  </g>
</svg>
