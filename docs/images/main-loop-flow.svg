<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 460" font-family="'PingFang SC','Microsoft YaHei',sans-serif">
  <title>主任务和 BLE 通知数据流</title>
  <rect width="800" height="460" fill="#fff"/>
  <text x="400" y="38" text-anchor="middle" font-size="22" font-weight="bold" fill="#222">主任务与通知 · 两种节拍</text>
  <g font-size="16" fill="#222">
    <rect x="30" y="70" width="740" height="52" rx="8" fill="#e3f2fd" stroke="#1976d2"/>
    <text x="400" y="102" text-anchor="middle">按钮事件 / BLE 控制 / HTTP 配置与桥接命令 → 队列或邮箱</text>
    <text x="400" y="149" text-anchor="middle">↓ 主任务每 50ms 处理</text>
    <rect x="30" y="168" width="740" height="105" rx="8" fill="#e8f5e9" stroke="#388e3c"/>
    <text x="50" y="198">处理事件与配置事务 → 更新引擎 → 推进桥接主备状态机</text>
    <text x="50" y="229">选择模拟 / 实际桥接 / 跑步来源 → 发布完整数据与配置快照</text>
    <text x="50" y="255">连接轮询、LED 状态、延迟 NVS 保存与看门狗喂狗</text>
    <text x="400" y="301" text-anchor="middle">↓ 数据锁保护整体输出快照</text>
    <rect x="30" y="319" width="740" height="80" rx="8" fill="#fff3e0" stroke="#ef6c00"/>
    <text x="50" y="349">BLE 定时器每 1000ms 采集一次 → 纯 C codec 打包 → 按缓存句柄通知</text>
    <text x="50" y="378">通知与协议栈生命周期互斥；GATT 锁内复制、锁外写 mbuf</text>
    <text x="400" y="435" text-anchor="middle" font-size="14" fill="#555">主循环更新快照；通知回调不操作 NVS、不阻塞、不重新分配大缓冲</text>
  </g>
</svg>
