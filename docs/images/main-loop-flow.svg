<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 440" font-family="'PingFang SC','Microsoft YaHei',sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L10,5 L0,10 Z" fill="#666"/>
    </marker>
    <filter id="shadow">
      <feDropShadow dx="1" dy="1" stdDeviation="2" flood-opacity="0.15"/>
    </filter>
  </defs>

  <text x="400" y="25" text-anchor="middle" font-size="16" font-weight="bold" fill="#333">BikePower C — 主循环数据流（50ms 节拍）</text>

  <!-- 时间轴 -->
  <line x1="100" y1="60" x2="750" y2="60" stroke="#999" stroke-width="1"/>
  <text x="90" y="64" text-anchor="end" font-size="10" fill="#666">t=0</text>
  <text x="440" y="64" text-anchor="middle" font-size="10" fill="#666">50ms</text>
  <text x="750" y="64" text-anchor="start" font-size="10" fill="#666">10s（心跳）</text>

  <!-- tick 标记 -->
  <line x1="220" y1="55" x2="220" y2="65" stroke="#999" stroke-width="1"/>
  <line x1="340" y1="55" x2="340" y2="65" stroke="#999" stroke-width="1"/>
  <line x1="460" y1="55" x2="460" y2="65" stroke="#999" stroke-width="1"/>
  <line x1="580" y1="55" x2="580" y2="65" stroke="#999" stroke-width="1"/>
  <line x1="700" y1="55" x2="700" y2="65" stroke="#999" stroke-width="1"/>

  <!-- ===== 步骤 1: 事件消费 ===== -->
  <rect x="100" y="80" width="640" height="35" rx="4" fill="#e3f2fd" stroke="#1976d2" stroke-width="1"/>
  <text x="420" y="102" text-anchor="middle" font-size="11" fill="#1565c0">1. 消费事件队列（非阻塞，一次批量取出所有待处理事件）</text>

  <!-- 向下箭头 -->
  <line x1="420" y1="115" x2="420" y2="135" stroke="#666" stroke-width="1" marker-end="url(#arrow)"/>

  <!-- ===== 步骤 2: 连接轮询 ===== -->
  <rect x="100" y="140" width="640" height="35" rx="4" fill="#fce4ec" stroke="#e91e63" stroke-width="1"/>
  <text x="420" y="162" text-anchor="middle" font-size="11" fill="#c2185b">2. 轮询 BLE 连接数 → 变化时投递连接事件到状态机</text>

  <line x1="420" y1="175" x2="420" y2="195" stroke="#666" stroke-width="1" marker-end="url(#arrow)"/>

  <!-- ===== 步骤 3: 状态机 ===== -->
  <rect x="100" y="200" width="640" height="35" rx="4" fill="#fff3e0" stroke="#ff9800" stroke-width="1"/>
  <text x="420" y="222" text-anchor="middle" font-size="11" fill="#e65100">3. app_state_tick() — 状态机节拍：空闲 / 调功 / 确认 / 配网</text>

  <line x1="420" y1="235" x2="420" y2="255" stroke="#666" stroke-width="1" marker-end="url(#arrow)"/>
  <line x1="735" y1="218" x2="760" y2="218" stroke="#ff9800" stroke-width="1" marker-end="url(#arrow)"/>
  <rect x="610" y="178" width="125" height="26" rx="4" fill="#fff8e1" stroke="#ff9800" stroke-width="0.8"/>
  <text x="672" y="195" text-anchor="middle" font-size="8.5" fill="#e65100">ST_WIFI_CONFIG 时跳过 BLE 快照</text>

  <!-- ===== 步骤 4: 快照生成 ===== -->
  <rect x="100" y="260" width="640" height="35" rx="4" fill="#e8f5e9" stroke="#4caf50" stroke-width="1"/>
  <text x="420" y="282" text-anchor="middle" font-size="11" fill="#2e7d32">4. power_engine_snapshot() → 按模式生成功率/踏频/心率快照</text>

  <line x1="420" y1="295" x2="420" y2="310" stroke="#666" stroke-width="1" marker-end="url(#arrow)"/>

  <!-- ===== 步骤 5: BLE 通知 ===== -->
  <rect x="100" y="315" width="640" height="35" rx="4" fill="#fce4ec" stroke="#e91e63" stroke-width="1"/>
  <text x="420" y="337" text-anchor="middle" font-size="11" fill="#c2185b">5. ble_bikepower_set_data() → 更新共享数据，notify_tick 每 1s 发 GATT 通知</text>

  <!-- 心跳分支标记 -->
  <line x1="700" y1="55" x2="700" y2="260" stroke="#999" stroke-dasharray="4,3"/>
  <rect x="165" y="370" width="470" height="28" rx="4" fill="#fdfdfd" stroke="#999" stroke-width="0.5"/>
  <text x="400" y="388" text-anchor="middle" font-size="9" fill="#888">每 200 tick（约 10s）：心跳日志 + 堆监控；脏配置由主循环检测后写入 NVS</text>
  <line x1="700" y1="350" x2="635" y2="370" stroke="#999" stroke-dasharray="4,3" marker-end="url(#arrow)"/>
</svg>
