<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 480" font-family="'PingFang SC','Microsoft YaHei',sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L10,5 L0,10 Z" fill="#666"/>
    </marker>
    <marker id="arrow-green" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L10,5 L0,10 Z" fill="#4caf50"/>
    </marker>
    <marker id="arrow-orange" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L10,5 L0,10 Z" fill="#ff9800"/>
    </marker>
    <filter id="shadow">
      <feDropShadow dx="1" dy="1" stdDeviation="2" flood-opacity="0.15"/>
    </filter>
  </defs>

  <text x="400" y="25" text-anchor="middle" font-size="16" font-weight="bold" fill="#333">BikePower C — 物理按钮 &amp; LED 状态机</text>

  <!-- 图例 -->
  <rect x="30" y="35" width="12" height="12" rx="2" fill="#e8f5e9" stroke="#4caf50" stroke-width="1"/>
  <text x="48" y="45" font-size="10" fill="#555">短按</text>
  <rect x="120" y="35" width="12" height="12" rx="2" fill="#fff3e0" stroke="#ff9800" stroke-width="1"/>
  <text x="138" y="45" font-size="10" fill="#555">长按</text>
  <rect x="210" y="35" width="12" height="12" rx="2" fill="#fce4ec" stroke="#e91e63" stroke-width="1"/>
  <text x="228" y="45" font-size="10" fill="#555">BLE 事件</text>

  <!-- ===== 状态 1: 空闲 ===== -->
  <rect x="50" y="70" width="150" height="50" rx="25" fill="#e8f5e9" stroke="#4caf50" stroke-width="2" filter="url(#shadow)"/>
  <text x="125" y="95" text-anchor="middle" font-size="12" font-weight="bold" fill="#2e7d32">空闲</text>
  <text x="125" y="110" text-anchor="middle" font-size="9" fill="#666">LED 慢闪（广播）</text>

  <!-- 空闲 → 调功 -->
  <line x1="200" y1="85" x2="240" y2="85" stroke="#4caf50" stroke-width="1.5" marker-end="url(#arrow-green)"/>
  <text x="215" y="80" font-size="9" fill="#4caf50">短按</text>
  <text x="215" y="95" font-size="8" fill="#999">-20W</text>

  <!-- ===== 状态 2: 调功 ===== -->
  <rect x="250" y="70" width="150" height="50" rx="25" fill="#e8f5e9" stroke="#4caf50" stroke-width="2" filter="url(#shadow)"/>
  <text x="325" y="95" text-anchor="middle" font-size="12" font-weight="bold" fill="#2e7d32">调功</text>
  <text x="325" y="110" text-anchor="middle" font-size="9" fill="#666">LED 快闪一次</text>

  <!-- 调功 → 空闲（超时） -->
  <path d="M 400 80 Q 460 55 400 55 Q 340 55 400 65" fill="none" stroke="#999" stroke-width="1" stroke-dasharray="4,3"/>
  <text x="430" y="52" font-size="8" fill="#999">即时生效</text>

  <!-- 调功 另一箭头回空闲 -->
  <line x1="325" y1="120" x2="125" y2="120" stroke="#999" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#arrow)"/>
  <text x="225" y="135" font-size="9" fill="#999">短按 -20W</text>

  <!-- ===== 状态 3: LED 快闪（长按确认） ===== -->
  <rect x="50" y="180" width="160" height="50" rx="25" fill="#fff3e0" stroke="#ff9800" stroke-width="2" filter="url(#shadow)"/>
  <text x="130" y="205" text-anchor="middle" font-size="12" font-weight="bold" fill="#e65100">LED 快闪</text>
  <text x="130" y="220" text-anchor="middle" font-size="9" fill="#666">等待二次确认</text>

  <!-- 调功 → LED 快闪 -->
  <line x1="325" y1="120" x2="130" y2="175" stroke="#ff9800" stroke-width="1.5" marker-end="url(#arrow-orange)"/>
  <text x="300" y="145" font-size="9" fill="#ff9800">长按 ≥2s</text>

  <!-- LED 快闪 → 空闲（确认窗口超时） -->
  <path d="M 50 200 Q 20 160 40 130 Q 60 122 120 122" fill="none" stroke="#999" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#arrow)"/>
  <text x="18" y="165" font-size="8" fill="#999">3s 超时取消</text>

  <!-- ===== 状态 4: 配网中 ===== -->
  <rect x="280" y="180" width="200" height="50" rx="25" fill="#fff3e0" stroke="#ff9800" stroke-width="2" filter="url(#shadow)"/>
  <text x="380" y="205" text-anchor="middle" font-size="12" font-weight="bold" fill="#e65100">WiFi 配网中</text>
  <text x="380" y="220" text-anchor="middle" font-size="9" fill="#666">LED 慢闪（WiFi 广播）</text>

  <!-- LED 快闪 → 配网 -->
  <line x1="210" y1="205" x2="275" y2="205" stroke="#ff9800" stroke-width="1.5" marker-end="url(#arrow-orange)"/>
  <text x="240" y="200" font-size="9" fill="#ff9800">窗口内再按</text>
  <text x="240" y="215" font-size="8" fill="#999">（3s 内）</text>

  <!-- 配网 → 恢复（超时） -->
  <line x1="480" y1="200" x2="530" y2="200" stroke="#ff4500" stroke-width="1" stroke-dasharray="4,3"/>
  <text x="500" y="195" font-size="8" fill="#ff4500">180s 超时</text>
  <text x="500" y="210" font-size="8" fill="#999">自动重启</text>

  <!-- ===== 状态 5: 配网成功 ===== -->
  <rect x="540" y="180" width="200" height="50" rx="25" fill="#c8e6c9" stroke="#4caf50" stroke-width="2" filter="url(#shadow)"/>
  <text x="640" y="205" text-anchor="middle" font-size="12" font-weight="bold" fill="#2e7d32">保存并重启</text>
  <text x="640" y="220" text-anchor="middle" font-size="9" fill="#666">LED 常亮 1s → 重启</text>

  <line x1="530" y1="200" x2="535" y2="200" stroke="#ff9800" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="560" y="195" font-size="9" fill="#4caf50">保存配置</text>

  <!-- ===== LED 状态 6: BLE 连接 ===== -->
  <rect x="250" y="310" width="200" height="50" rx="25" fill="#fce4ec" stroke="#e91e63" stroke-width="2" filter="url(#shadow)"/>
  <text x="350" y="335" text-anchor="middle" font-size="12" font-weight="bold" fill="#c2185b">BLE 已连接</text>
  <text x="350" y="350" text-anchor="middle" font-size="9" fill="#666">LED 常亮</text>

  <!-- 空闲 → 连接 -->
  <line x1="125" y1="120" x2="300" y2="305" stroke="#e91e63" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="160" y="210" font-size="9" fill="#e91e63">BLE 连接</text>

  <!-- 调功 → 连接 -->
  <line x1="350" y1="120" x2="350" y2="305" stroke="#e91e63" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="360" y="290" font-size="9" fill="#e91e63">BLE 连接</text>

  <!-- 连接 → 空闲 -->
  <path d="M 450 335 Q 520 350 450 370 Q 380 390 300 370 Q 240 350 250 335" fill="none" stroke="#999" stroke-width="1" stroke-dasharray="4,3"/>
  <text x="460" y="365" font-size="9" fill="#999">BLE 断开</text>

  <!-- 底部说明 -->
  <text x="400" y="420" text-anchor="middle" font-size="10" fill="#888">GPIO9 按钮（中断驱动，内部上拉）· LED 通用板 GPIO12 电平 / M5Stamp GPIO2 SK6812 RGB · FreeRTOS 队列通信</text>
  <text x="400" y="440" text-anchor="middle" font-size="10" fill="#888">WiFi 配网期间 BLE 被射频互斥关闭，重启后恢复 BLE</text>
  <text x="400" y="460" text-anchor="middle" font-size="10" fill="#888">LED 指示：慢闪 = 广播中 · 快闪 = 等待确认 · 常亮 = 已连接 · 关 = 休眠</text>
</svg>
