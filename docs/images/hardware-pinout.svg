<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 430" font-family="'PingFang SC','Microsoft YaHei',sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L10,5 L0,10 Z" fill="#666"/>
    </marker>
    <filter id="shadow">
      <feDropShadow dx="1" dy="1" stdDeviation="2" flood-opacity="0.14"/>
    </filter>
  </defs>

  <text x="430" y="32" text-anchor="middle" font-size="17" font-weight="bold" fill="#333">BikePower C — ESP32-C3 板型与引脚对照</text>
  <text x="430" y="54" text-anchor="middle" font-size="10" fill="#777">固件启动时自动检测板型，应用层通过 board_btn_pin() / board_led_kind() 选择实际硬件路径</text>

  <rect x="60" y="90" width="320" height="220" rx="10" fill="#e3f2fd" stroke="#1976d2" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="220" y="120" text-anchor="middle" font-size="14" font-weight="bold" fill="#1565c0">通用 ESP32-C3 开发板</text>

  <rect x="155" y="145" width="130" height="92" rx="8" fill="#fff" stroke="#42a5f5" stroke-width="1.2"/>
  <text x="220" y="173" text-anchor="middle" font-size="13" font-weight="bold" fill="#333">ESP32-C3</text>
  <text x="220" y="194" text-anchor="middle" font-size="9" fill="#666">GPIO12 读高</text>
  <text x="220" y="211" text-anchor="middle" font-size="9" fill="#666">判定为通用板</text>

  <rect x="75" y="155" width="58" height="36" rx="6" fill="#e8f5e9" stroke="#4caf50" stroke-width="1.2"/>
  <text x="104" y="178" text-anchor="middle" font-size="10" font-weight="bold" fill="#2e7d32">按钮</text>
  <text x="104" y="207" text-anchor="middle" font-size="9" fill="#666">GPIO9</text>
  <line x1="133" y1="173" x2="155" y2="178" stroke="#666" stroke-width="1" marker-end="url(#arrow)"/>

  <rect x="307" y="155" width="58" height="36" rx="6" fill="#fff3e0" stroke="#ff9800" stroke-width="1.2"/>
  <text x="336" y="178" text-anchor="middle" font-size="10" font-weight="bold" fill="#e65100">LED</text>
  <text x="336" y="207" text-anchor="middle" font-size="9" fill="#666">GPIO12</text>
  <line x1="285" y1="178" x2="307" y2="173" stroke="#666" stroke-width="1" marker-end="url(#arrow)"/>

  <text x="220" y="272" text-anchor="middle" font-size="10" fill="#555">普通 LED：高电平点亮；按钮：内部上拉，按下接地</text>

  <rect x="480" y="90" width="320" height="220" rx="10" fill="#f3e5f5" stroke="#8e24aa" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="640" y="120" text-anchor="middle" font-size="14" font-weight="bold" fill="#6a1b9a">M5Stamp C3</text>

  <rect x="575" y="145" width="130" height="92" rx="8" fill="#fff" stroke="#ab47bc" stroke-width="1.2"/>
  <text x="640" y="173" text-anchor="middle" font-size="13" font-weight="bold" fill="#333">ESP32-C3</text>
  <text x="640" y="194" text-anchor="middle" font-size="9" fill="#666">GPIO3 按钮上拉读高</text>
  <text x="640" y="211" text-anchor="middle" font-size="9" fill="#666">判定为 M5Stamp</text>

  <rect x="495" y="155" width="58" height="36" rx="6" fill="#e8f5e9" stroke="#4caf50" stroke-width="1.2"/>
  <text x="524" y="178" text-anchor="middle" font-size="10" font-weight="bold" fill="#2e7d32">按钮</text>
  <text x="524" y="207" text-anchor="middle" font-size="9" fill="#666">GPIO3</text>
  <line x1="553" y1="173" x2="575" y2="178" stroke="#666" stroke-width="1" marker-end="url(#arrow)"/>

  <rect x="727" y="155" width="58" height="36" rx="6" fill="#fff3e0" stroke="#ff9800" stroke-width="1.2"/>
  <text x="756" y="178" text-anchor="middle" font-size="10" font-weight="bold" fill="#e65100">RGB</text>
  <text x="756" y="207" text-anchor="middle" font-size="9" fill="#666">GPIO2</text>
  <line x1="705" y1="178" x2="727" y2="173" stroke="#666" stroke-width="1" marker-end="url(#arrow)"/>

  <text x="640" y="272" text-anchor="middle" font-size="10" fill="#555">SK6812 RGB：蓝=广播，绿=连接，黄=确认</text>

  <rect x="170" y="340" width="520" height="42" rx="6" fill="#fff" stroke="#999" stroke-width="1"/>
  <text x="430" y="359" text-anchor="middle" font-size="10" font-weight="bold" fill="#555">共通约束</text>
  <text x="430" y="376" text-anchor="middle" font-size="10" fill="#666">USB/5V 供电，GND 共地；UART0 保留给烧录、日志和故障定位</text>
</svg>
