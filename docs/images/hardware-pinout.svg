<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 410" font-family="'PingFang SC','Microsoft YaHei',sans-serif">
  <title>支持板型和引脚</title>
  <rect width="800" height="410" fill="#fff"/>
  <text x="400" y="38" text-anchor="middle" font-size="22" font-weight="bold" fill="#222">ESP32-C3 · 板型与引脚</text>
  <g font-size="16" fill="#222">
    <rect x="30" y="70" width="350" height="210" rx="8" fill="#e3f2fd" stroke="#1976d2"/>
    <text x="50" y="105" font-weight="bold">通用 ESP32-C3</text>
    <text x="50" y="145">按钮：GPIO9 · 内部上拉</text>
    <text x="50" y="180">LED：GPIO12 · 低电平点亮</text>
    <text x="50" y="215">检测：GPIO3 下拉后读低</text>
    <text x="50" y="250">按板卡原厂接线与丝印核对</text>
    <rect x="400" y="70" width="370" height="210" rx="8" fill="#e8f5e9" stroke="#388e3c"/>
    <text x="420" y="105" font-weight="bold">M5Stamp C3</text>
    <text x="420" y="145">按钮：GPIO3 · 板载外部上拉</text>
    <text x="420" y="180">LED：GPIO2 · SK6812 RGB</text>
    <text x="420" y="215">检测：GPIO3 下拉后仍读高</text>
    <text x="420" y="250">检测结束后 GPIO3 恢复</text>
    <text x="400" y="320" text-anchor="middle">两种按钮按下均接地；描述表统一提供引脚和 LED 驱动</text>
    <text x="400" y="352" text-anchor="middle">USB / 稳定 5V 供电 · GND 共地 · 保留下载与日志接口</text>
    <text x="400" y="382" text-anchor="middle" font-size="14" fill="#555">其他板卡不可直接套用 GPIO；先核对 Flash、启动脚和 LED 极性</text>
  </g>
</svg>
