<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 460" font-family="'PingFang SC','Microsoft YaHei',sans-serif">
  <title>BikePower C 当前软件架构</title>
  <rect width="800" height="460" fill="#fff"/>
  <text x="400" y="38" text-anchor="middle" font-size="22" font-weight="bold" fill="#222">BikePower C — 软件架构</text>
  <g font-size="15" fill="#222">
    <rect x="30" y="70" width="740" height="140" rx="8" fill="#e3f2fd" stroke="#1976d2"/>
    <text x="50" y="100" font-weight="bold">应用层 · main/</text>
    <text x="50" y="130">app_main：主任务、事件队列、配置提交、快照发布与 WDT</text>
    <text x="50" y="159">BLE 外设 / 上游功率计 / 主备运行时 / 按钮 / LED / NVS</text>
    <text x="50" y="188">radio_ctrl：WiFi 启停唯一入口；HTTP 门户与 BLE 普通配网共存</text>
    <text x="400" y="234" text-anchor="middle" fill="#555">↓ 公开接口</text>
    <rect x="30" y="250" width="740" height="90" rx="8" fill="#e8f5e9" stroke="#388e3c"/>
    <text x="50" y="280" font-weight="bold">领域层 · components/bikepower_domain/ · 纯 C、可 Host 测试</text>
    <text x="50" y="308">功率 / 心率 / 跑步 / 配置 / 协议编码 / 真实校正 / 三设备主备状态机</text>
    <rect x="30" y="365" width="740" height="65" rx="8" fill="#f3e5f5" stroke="#8e24aa"/>
    <text x="50" y="393" font-weight="bold">平台：ESP-IDF 5.5.4 · FreeRTOS · NimBLE · GPIO · NVS · WiFi</text>
    <text x="50" y="417">ESP32-C3 · 通用板与 M5Stamp C3；领域层不依赖 ESP-IDF</text>
  </g>
</svg>
