<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 520" font-family="'PingFang SC','Microsoft YaHei',sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L10,5 L0,10 Z" fill="#666"/>
    </marker>
    <linearGradient id="gpu" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#e8f5e9"/>
      <stop offset="100%" style="stop-color:#c8e6c9"/>
    </linearGradient>
    <linearGradient id="app" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#e3f2fd"/>
      <stop offset="100%" style="stop-color:#bbdefb"/>
    </linearGradient>
    <linearGradient id="ble" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#fce4ec"/>
      <stop offset="100%" style="stop-color:#f8bbd0"/>
    </linearGradient>
    <linearGradient id="ui" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#fff3e0"/>
      <stop offset="100%" style="stop-color:#ffe0b2"/>
    </linearGradient>
    <linearGradient id="hw" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#f3e5f5"/>
      <stop offset="100%" style="stop-color:#e1bee7"/>
    </linearGradient>
    <filter id="shadow">
      <feDropShadow dx="1" dy="1" stdDeviation="2" flood-opacity="0.15"/>
    </filter>
  </defs>

  <!-- 标题 -->
  <text x="400" y="30" text-anchor="middle" font-size="16" font-weight="bold" fill="#333">BikePower C — 软件架构总览</text>

  <!-- ===== 硬件层 ===== -->
  <rect x="30" y="460" width="740" height="50" rx="6" fill="url(#hw)" stroke="#9c27b0" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="400" y="486" text-anchor="middle" font-size="13" font-weight="bold" fill="#7b1fa2">硬件层</text>
  <text x="400" y="502" text-anchor="middle" font-size="10" fill="#666">ESP32-C3（RISC-V 160MHz · 400KB SRAM · Flash 依开发板配置）· 通用板 / M5Stamp C3 双板适配</text>

  <!-- GPIO 标注 -->
  <line x1="160" y1="460" x2="160" y2="440" stroke="#999" stroke-dasharray="3,3"/>
  <text x="160" y="435" text-anchor="middle" font-size="9" fill="#999">GPIO9 按钮</text>
  <line x1="640" y1="460" x2="640" y2="440" stroke="#999" stroke-dasharray="3,3"/>
  <text x="640" y="435" text-anchor="middle" font-size="9" fill="#999">GPIO12 LED / GPIO2 SK6812</text>

  <!-- ===== 领域层 ===== -->
  <rect x="30" y="330" width="740" height="110" rx="6" fill="url(#gpu)" stroke="#4caf50" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="400" y="355" text-anchor="middle" font-size="13" font-weight="bold" fill="#2e7d32">领域层（components/bikepower_domain/）— 纯 C，可 Host 单测</text>

  <!-- 领域模块 -->
  <rect x="50" y="365" width="160" height="60" rx="4" fill="#fff" stroke="#66bb6a" stroke-width="1"/>
  <text x="130" y="387" text-anchor="middle" font-size="11" font-weight="bold" fill="#333">power_engine</text>
  <text x="130" y="403" text-anchor="middle" font-size="9" fill="#666">功率引擎 · ERG 控制</text>
  <text x="130" y="417" text-anchor="middle" font-size="9" fill="#666">模式切换 · 快照生成</text>

  <rect x="230" y="365" width="140" height="60" rx="4" fill="#fff" stroke="#66bb6a" stroke-width="1"/>
  <text x="300" y="387" text-anchor="middle" font-size="11" font-weight="bold" fill="#333">hr_model</text>
  <text x="300" y="403" text-anchor="middle" font-size="9" fill="#666">心率模拟</text>
  <text x="300" y="417" text-anchor="middle" font-size="9" fill="#666">FTP 6 区映射</text>

  <rect x="390" y="365" width="140" height="60" rx="4" fill="#fff" stroke="#66bb6a" stroke-width="1"/>
  <text x="460" y="387" text-anchor="middle" font-size="11" font-weight="bold" fill="#333">config_store</text>
  <text x="460" y="403" text-anchor="middle" font-size="9" fill="#666">配置 Schema</text>
  <text x="460" y="417" text-anchor="middle" font-size="9" fill="#666">校验 · 迁移</text>

  <rect x="550" y="365" width="100" height="60" rx="4" fill="#fff" stroke="#66bb6a" stroke-width="1"/>
  <text x="600" y="387" text-anchor="middle" font-size="11" font-weight="bold" fill="#333">profile</text>
  <text x="600" y="403" text-anchor="middle" font-size="9" fill="#666">用户档案</text>
  <text x="600" y="417" text-anchor="middle" font-size="9" fill="#666">默认值</text>

  <rect x="670" y="365" width="80" height="60" rx="4" fill="#fff" stroke="#66bb6a" stroke-width="1"/>
  <text x="710" y="387" text-anchor="middle" font-size="11" font-weight="bold" fill="#333">domain_rng</text>
  <text x="710" y="403" text-anchor="middle" font-size="9" fill="#666">随机数</text>

  <!-- ===== 应用层 ===== -->
  <rect x="30" y="125" width="740" height="190" rx="6" fill="url(#app)" stroke="#1976d2" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="400" y="150" text-anchor="middle" font-size="13" font-weight="bold" fill="#1565c0">应用层（main/）— 接入 ESP-IDF + NimBLE</text>

  <!-- 应用子模块 -->
  <rect x="45" y="160" width="130" height="50" rx="4" fill="#fff" stroke="#42a5f5" stroke-width="1"/>
  <text x="110" y="180" text-anchor="middle" font-size="11" font-weight="bold" fill="#333">app_main</text>
  <text x="110" y="196" text-anchor="middle" font-size="9" fill="#666">入口 · 主循环 · 喂狗</text>

  <rect x="190" y="160" width="130" height="50" rx="4" fill="#fff" stroke="#42a5f5" stroke-width="1"/>
  <text x="255" y="180" text-anchor="middle" font-size="11" font-weight="bold" fill="#333">app_state</text>
  <text x="255" y="196" text-anchor="middle" font-size="9" fill="#666">7 态状态机</text>

  <rect x="335" y="160" width="130" height="50" rx="4" fill="#fff" stroke="#42a5f5" stroke-width="1"/>
  <text x="400" y="180" text-anchor="middle" font-size="11" font-weight="bold" fill="#333">nvs_store</text>
  <text x="400" y="196" text-anchor="middle" font-size="9" fill="#666">NVS 读写 · 脏标记落盘</text>

  <rect x="480" y="160" width="130" height="50" rx="4" fill="#fff" stroke="#42a5f5" stroke-width="1"/>
  <text x="545" y="180" text-anchor="middle" font-size="11" font-weight="bold" fill="#333">button</text>
  <text x="545" y="196" text-anchor="middle" font-size="9" fill="#666">GPIO9 中断 · 长/短按</text>

  <rect x="625" y="160" width="130" height="50" rx="4" fill="#fff" stroke="#42a5f5" stroke-width="1"/>
  <text x="690" y="180" text-anchor="middle" font-size="11" font-weight="bold" fill="#333">led</text>
  <text x="690" y="196" text-anchor="middle" font-size="9" fill="#666">GPIO12 · 四态指示</text>

  <!-- 应用子模块第二行 -->
  <rect x="45" y="225" width="165" height="50" rx="4" fill="#fff" stroke="#42a5f5" stroke-width="1"/>
  <text x="127" y="245" text-anchor="middle" font-size="11" font-weight="bold" fill="#333">ble_bikepower</text>
  <text x="127" y="261" text-anchor="middle" font-size="9" fill="#666">NimBLE 五服务 · 广播 · 控制点</text>

  <rect x="224" y="225" width="120" height="50" rx="4" fill="#fff" stroke="#42a5f5" stroke-width="1"/>
  <text x="284" y="245" text-anchor="middle" font-size="11" font-weight="bold" fill="#333">radio_ctrl</text>
  <text x="284" y="261" text-anchor="middle" font-size="9" fill="#666">BLE/WiFi 射频开关</text>

  <rect x="358" y="225" width="125" height="50" rx="4" fill="#fff" stroke="#42a5f5" stroke-width="1"/>
  <text x="420" y="245" text-anchor="middle" font-size="11" font-weight="bold" fill="#333">board_detect</text>
  <text x="420" y="261" text-anchor="middle" font-size="9" fill="#666">GPIO12 双板自检</text>

  <rect x="497" y="225" width="258" height="50" rx="4" fill="#fff" stroke="#42a5f5" stroke-width="1"/>
  <text x="626" y="245" text-anchor="middle" font-size="11" font-weight="bold" fill="#333">wifi_portal</text>
  <text x="626" y="261" text-anchor="middle" font-size="9" fill="#666">SoftAP + HTTP 配网 · 11 路由 · 超时恢复</text>

  <!-- 箭头：应用层 → 领域层 -->
  <line x1="130" y1="275" x2="130" y2="330" stroke="#666" stroke-width="1" marker-end="url(#arrow)"/>
  <line x1="400" y1="275" x2="400" y2="330" stroke="#666" stroke-width="1" marker-end="url(#arrow)"/>
  <line x1="600" y1="275" x2="600" y2="330" stroke="#666" stroke-width="1" marker-end="url(#arrow)"/>

  <!-- 箭头：领域层 → 硬件层 -->
  <line x1="200" y1="440" x2="200" y2="460" stroke="#666" stroke-width="1" marker-end="url(#arrow)"/>
  <line x1="400" y1="440" x2="400" y2="460" stroke="#666" stroke-width="1" marker-end="url(#arrow)"/>
  <line x1="600" y1="440" x2="600" y2="460" stroke="#666" stroke-width="1" marker-end="url(#arrow)"/>

  <!-- ===== BLE 外部设备连接 ===== -->
  <rect x="30" y="60" width="340" height="50" rx="6" fill="url(#ble)" stroke="#e91e63" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="200" y="83" text-anchor="middle" font-size="11" font-weight="bold" fill="#c2185b">BLE 外部设备</text>
  <text x="200" y="99" text-anchor="middle" font-size="9" fill="#666">骑行 App（佳明/行者/迈金等）</text>

  <line x1="200" y1="110" x2="200" y2="125" stroke="#e91e63" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="215" y="120" font-size="9" fill="#e91e63">GATT 读写/通知</text>

  <!-- ===== WiFi 配网设备连接 ===== -->
  <rect x="430" y="60" width="340" height="50" rx="6" fill="url(#ui)" stroke="#ff9800" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="600" y="83" text-anchor="middle" font-size="11" font-weight="bold" fill="#e65100">配网设备</text>
  <text x="600" y="99" text-anchor="middle" font-size="9" fill="#666">手机浏览器访问 192.168.4.1</text>

  <line x1="600" y1="110" x2="600" y2="125" stroke="#ff9800" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="615" y="120" font-size="9" fill="#e65100">HTTP 配置提交</text>
</svg>
